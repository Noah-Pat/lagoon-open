<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lagoon Open — Wii Pier Tennis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;600;700;800&display=swap">
<style>
:root{
  --ink:#fff8ec;
  --ink-dim:rgba(255,248,236,.74);
  --glass:rgba(12,34,44,.76);
  --glass-hi:rgba(22,56,70,.88);
  --glass-edge:rgba(255,248,236,.18);
  --coral:#ff6b4a;
  --coral-dk:#bd4026;
  --sun:#ffd23f;
  --lagoon:#38b2a0;
  --cyan:#5ce1e6;
  --deep:#091f28;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:relative;height:100%;width:100%;overflow:hidden}
#court{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

.chip{background:var(--glass);border:1px solid var(--glass-edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,.28)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .1s}
.btn:hover{background:var(--glass-hi)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.seg button:focus-visible,.play:focus-visible,.opp-card:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.led{width:8px;height:8px;border-radius:50%;background:rgba(255,248,236,.28);flex:none}
.led.on{background:#5cf29a;box-shadow:0 0 10px #5cf29a}

/* Scoreboard */
#score{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));padding:9px 11px;display:grid;grid-template-columns:12px auto 34px 46px;align-items:center;row-gap:4px;column-gap:7px;font-variant-numeric:tabular-nums;pointer-events:none;min-width:196px}
#score .nm{font-weight:800;font-size:13.5px;padding-right:6px;display:flex;align-items:center;gap:6px}
#score .tag{font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,210,63,.18);color:var(--sun);padding:2px 5px;border-radius:5px;font-weight:800}
#score .g{font-family:var(--display);font-size:21px;text-align:center;color:var(--sun);line-height:1}
#score .p{font-family:var(--display);font-size:20px;text-align:center;background:rgba(255,248,236,.12);border-radius:8px;padding:2px 0;line-height:1.05}
#score .dot{width:8px;height:8px;border-radius:50%;background:transparent;justify-self:center;transition:background .2s,box-shadow .2s}
#score .dot.on{background:var(--sun);box-shadow:0 0 10px var(--sun)}
#score .hdr{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);text-align:center;font-weight:700}
#scoreBadge{grid-column:1/-1;margin-top:2px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:linear-gradient(90deg,var(--coral),#ff944a);color:#fff}

/* Training HUD */
#trainHud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));padding:10px 14px;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums;pointer-events:none}
#trainHud .blk{display:flex;flex-direction:column;align-items:center;min-width:54px}
#trainHud .lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
#trainHud .val{font-family:var(--display);font-size:24px;line-height:1.05;color:var(--ink)}
#trainHud .val.sun{color:var(--sun)}
#trainHud .val.cyan{color:var(--cyan)}
#trainHud .val.low{color:var(--coral)}

/* Rally / Speed telemetry */
#telemetry{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;align-items:center}
.pill{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.05em;display:inline-flex;align-items:center;gap:6px;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;font-variant-numeric:tabular-nums}
.pill.show{opacity:1;transform:none}
.pill .v{font-family:var(--display);font-size:16px;color:var(--sun);font-weight:400}
.pill.rocket{border-color:rgba(255,210,63,.55);background:rgba(46,24,14,.84)}
.pill.rocket .v{color:#fff08a;text-shadow:0 0 12px rgba(255,190,60,.8)}
#lobBadge{border-color:rgba(92,225,230,.55);color:var(--cyan)}

/* Top-right controls */
#tools{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:56vw}
#fpsTag{font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;padding:7px 10px;border-radius:999px;color:var(--ink-dim);pointer-events:none}

/* Center callouts */
#msg{position:absolute;left:0;right:0;top:19%;text-align:center;pointer-events:none;transition:opacity .22s,transform .22s cubic-bezier(.2,1.2,.3,1);opacity:0;transform:scale(.92) translateY(10px)}
#msg.show{opacity:1;transform:none}
#msg .big{font-family:var(--display);font-size:clamp(36px,7.5vw,70px);line-height:.98;letter-spacing:.02em;text-shadow:0 4px 0 rgba(9,31,40,.72),0 0 36px rgba(255,140,72,.45);text-wrap:balance}
#msg .small{margin-top:8px;font-weight:800;font-size:clamp(14px,2.2vw,19px);color:var(--sun);text-shadow:0 2px 8px rgba(0,0,0,.55)}

/* Shot feedback & serve meter */
#feedback{position:absolute;left:50%;bottom:calc(62px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.95);padding:7px 15px;font-weight:700;font-size:13.5px;letter-spacing:.02em;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap}
#feedback.show{opacity:1;transform:translateX(-50%) scale(1)}
#feedback b{color:var(--sun);font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.04em}
#feedback.crit{border-color:rgba(255,210,63,.65);background:rgba(44,24,12,.86)}
#feedback.crit b{color:#fff49c}

#serveMeter{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:14px;height:148px;border-radius:999px;padding:3px;pointer-events:none;display:flex;align-items:flex-end;position:absolute}
#serveMeter .track{position:relative;width:100%;height:100%;border-radius:999px;background:rgba(255,248,236,.12);overflow:hidden}
#serveMeter .sweet{position:absolute;left:0;right:0;top:4%;height:14%;background:linear-gradient(180deg,#fff3a0,var(--sun));box-shadow:0 0 12px var(--sun);border-radius:999px}
#serveMeter .pin{position:absolute;left:-2px;right:-2px;height:7px;border-radius:999px;background:#fff;box-shadow:0 0 10px #fff;bottom:0;transform:translateY(50%)}

#hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:7px 15px;font-size:12.5px;color:var(--ink-dim);text-align:center;max-width:calc(100% - 28px);pointer-events:none}
#hint strong{color:var(--ink)}

/* Menu overlay */
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,rgba(9,31,40,.22),rgba(6,22,30,.76));padding:16px;overflow:auto;z-index:20}
.card{width:min(540px,100%);padding:24px 24px 20px;display:flex;flex-direction:column;gap:14px;border-radius:24px}
.top-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sun);font-weight:800}
.skill-pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:rgba(255,248,236,.1);border:1px solid rgba(255,248,236,.16);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.skill-pill .pro{background:var(--sun);color:var(--deep);font-size:10px;padding:1px 6px;border-radius:999px;letter-spacing:.08em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,8.5vw,60px);line-height:.92;margin:0;color:var(--ink);text-shadow:0 4px 0 var(--coral)}
.lede{margin:0;color:var(--ink-dim);line-height:1.48;font-size:13.5px}

/* Opponent cards */
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opp-card{text-align:left;padding:11px 11px 10px;border-radius:16px;background:rgba(255,248,236,.06);border:1.5px solid rgba(255,248,236,.12);transition:border-color .15s,background .15s,transform .12s;display:flex;flex-direction:column;gap:4px}
.opp-card:hover{background:rgba(255,248,236,.11);transform:translateY(-1px)}
.opp-card[aria-pressed="true"]{background:rgba(255,248,236,.16);border-color:var(--sun);box-shadow:0 0 0 1px var(--sun) inset,0 8px 20px rgba(0,0,0,.22)}
.opp-top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.opp-nm{font-family:var(--display);font-size:20px;line-height:1;color:var(--ink)}
.opp-crown{font-size:14px;color:var(--sun)}
.opp-tier{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--cyan)}
.opp-desc{font-size:11.5px;color:var(--ink-dim);line-height:1.3}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,248,236,.08);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;color:var(--ink-dim)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--deep)}
.play{border:0;background:linear-gradient(180deg,#ff7d5c,var(--coral));color:#fff;font-family:var(--display);font-size:21px;letter-spacing:.04em;padding:11px 26px;border-radius:999px;box-shadow:0 4px 0 var(--coral-dk);transition:transform .1s,box-shadow .1s}
.play:hover{filter:brightness(1.06)}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-dk)}
.play.alt{background:linear-gradient(180deg,#44c4b2,#2b9687);box-shadow:0 4px 0 #1b665c;font-size:17px;padding:11px 18px}
.play.alt:active{box-shadow:0 2px 0 #1b665c}
.play.ghost{background:rgba(255,248,236,.12);box-shadow:none;border:1px solid var(--glass-edge);font-size:16px;padding:10px 18px}

.controls{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin:0;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.18)}
.controls dt{font-weight:800;color:var(--sun)}
.controls dd{margin:0;color:var(--ink-dim);min-width:0;line-height:1.38}
.note{font-size:11.5px;color:var(--ink-dim);margin:0;line-height:1.45}

/* Post-match stats & skill bar */
.final-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.final{font-family:var(--display);font-size:54px;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-box{padding:8px 6px;border-radius:12px;background:rgba(255,248,236,.07);text-align:center}
.stat-box .sv{font-family:var(--display);font-size:20px;color:var(--ink);line-height:1.1}
.stat-box .sl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);font-weight:700;margin-top:2px}
.skill-box{padding:11px 13px;border-radius:14px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;gap:7px}
.skill-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700}
.skill-delta{font-family:var(--display);font-size:18px}
.skill-delta.up{color:#66f5a3}
.skill-delta.dn{color:#ff846b}
.skill-bar{height:10px;border-radius:999px;background:rgba(255,248,236,.12);overflow:hidden;position:relative}
.skill-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lagoon),var(--sun),var(--coral));transition:width .8s cubic-bezier(.2,.9,.2,1)}
.skill-mark{position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,248,236,.4)}

@media (max-width:600px){
  .opps{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  #tools .lbl{display:none}
  #score{min-width:160px;padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){#msg,#feedback,.pill,.skill-fill{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="court" aria-label="Lagoon Open 3D Tennis Court"></canvas>

    <span class="dot" id="srv1"></span><span class="nm"><span id="oppNameHud">Reef</span><span class="tag" id="oppTierHud">Pro</span></span><span class="g" id="g1">0</span><span class="p" id="p1">0</span>
    <div id="scoreBadge" hidden></div>
  </div>

  <div id="trainHud" class="chip" hidden aria-live="polite">

  <div id="tools">
    <div id="fpsTag" class="chip" hidden>60 FPS</div>
    <button class="btn" id="wiiBtn" type="button" title="Connect Wii Remote via WebHID"><span class="led" id="wiiLed"></span><span class="lbl" id="wiiLbl">Wii Remote</span></button>

    <button class="btn" id="menuBtn" type="button" title="Pause / Menu (Esc)">Menu</button>
  </div>

  <div id="msg"><div class="big" id="msgBig"></div><div class="small" id="msgSmall"></div></div>
  <div id="feedback" class="chip"></div>
  <div id="serveMeter" class="chip" hidden><div class="track"><div class="sweet"></div><div class="pin" id="servePin"></div></div></div>
  <div id="hint" class="chip"></div>

  <div id="overlay">
    <div class="card chip" id="card"></div>
  </div>
</div>

// 2. ZERO-ALLOCATION 3D MATH

const M4 = () => new Float32Array(16);
const M3 = () => new Float32Array(9);

function m4Ident(o) {
  o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o;
}
function m4Mul(o, a, b) {
  const a00=a[0],a01=a[4],a02=a[8],a03=a[12], a10=a[1],a11=a[5],a12=a[9],a13=a[13],
        a20=a[2],a21=a[6],a22=a[10],a23=a[14], a30=a[3],a31=a[7],a32=a[11],a33=a[15];
  for (let c = 0; c < 4; c++) {
    const k = c * 4, b0 = b[k], b1 = b[k+1], b2 = b[k+2], b3 = b[k+3];
    o[k]   = a00*b0 + a01*b1 + a02*b2 + a03*b3;
    o[k+1] = a10*b0 + a11*b1 + a12*b2 + a13*b3;
    o[k+2] = a20*b0 + a21*b1 + a22*b2 + a23*b3;
    o[k+3] = a30*b0 + a31*b1 + a32*b2 + a33*b3;
  }
  return o;
}
function eulerYXZ(o, rx, ry, rz, tx, ty, tz) {
  const cx=Math.cos(rx), sx=Math.sin(rx), cy=Math.cos(ry), sy=Math.sin(ry), cz=Math.cos(rz), sz=Math.sin(rz);
  o[0]=cy*cz+sy*sx*sz;  o[4]=-cy*sz+sy*sx*cz; o[8]=sy*cx;   o[12]=tx;
  o[1]=cx*sz;           o[5]=cx*cz;           o[9]=-sx;     o[13]=ty;
  o[2]=-sy*cz+cy*sx*sz; o[6]=sy*sz+cy*sx*cz;  o[10]=cy*cx;  o[14]=tz;
  o[3]=0;               o[7]=0;               o[11]=0;      o[15]=1;
  return o;
}
function m4Scale(o, a, sx, sy, sz) {
  o[0]=a[0]*sx; o[1]=a[1]*sx; o[2]=a[2]*sx; o[3]=a[3]*sx;
  o[4]=a[4]*sy; o[5]=a[5]*sy; o[6]=a[6]*sy; o[7]=a[7]*sy;
  o[8]=a[8]*sz; o[9]=a[9]*sz; o[10]=a[10]*sz; o[11]=a[11]*sz;
  o[12]=a[12];  o[13]=a[13];  o[14]=a[14];  o[15]=a[15];
  return o;
}
function m4Trans(o, tx, ty, tz) {
  m4Ident(o); o[12]=tx; o[13]=ty; o[14]=tz; return o;
}
function m4Persp(o, fovY, aspect, near, far) {
  const f = 1 / Math.tan(fovY * 0.5), nf = 1 / (near - far);
  o.fill(0);
  o[0] = f / aspect; o[5] = f; o[10] = (far + near) * nf; o[11] = -1; o[14] = 2 * far * near * nf;
  return o;
}
function m4Ortho(o, l, r, b, t, n, f) {
  const lr = 1 / (l - r), bt = 1 / (b - t), nf = 1 / (n - f);
  o.fill(0);
  o[0] = -2 * lr; o[5] = -2 * bt; o[10] = 2 * nf;
  o[12] = (l + r) * lr; o[13] = (t + b) * bt; o[14] = (f + n) * nf; o[15] = 1;
  return o;
}
function m4LookAt(o, ex, ey, ez, tx, ty, tz, ux, uy, uz) {
  let zx = ex - tx, zy = ey - ty, zz = ez - tz;
  let zl = Math.hypot(zx, zy, zz) || 1; zx /= zl; zy /= zl; zz /= zl;
  let xx = uy * zz - uz * zy, xy = uz * zx - ux * zz, xz = ux * zy - uy * zx;
  let xl = Math.hypot(xx, xy, xz) || 1; xx /= xl; xy /= xl; xz /= xl;
  let yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  o[0]=xx; o[4]=xy; o[8]=xz;  o[12]=-(xx*ex+xy*ey+xz*ez);
  o[1]=yx; o[5]=yy; o[9]=yz;  o[13]=-(yx*ex+yy*ey+yz*ez);
  o[2]=zx; o[6]=zy; o[10]=zz; o[14]=-(zx*ex+zy*ey+zz*ez);
  o[3]=0;  o[7]=0;  o[11]=0;  o[15]=1;

}
function m4Invert(o, a) {

        a20=a[8],a21=a[9],a22=a[10],a23=a[11],a30=a[12],a31=a[13],a32=a[14],a33=a[15];
  const b00=a00*a11-a01*a10, b01=a00*a12-a02*a10, b02=a00*a13-a03*a10,
        b03=a01*a12-a02*a11, b04=a01*a13-a03*a11, b05=a02*a13-a03*a12,
        b06=a20*a31-a21*a30, b07=a20*a32-a22*a30, b08=a20*a33-a23*a30,
        b09=a21*a32-a22*a31, b10=a21*a33-a23*a31, b11=a22*a33-a23*a32;
  let det = b00*b11 - b01*b10 + b02*b09 + b03*b08 - b04*b07 + b05*b06;
  if (!det) return m4Ident(o);
  det = 1 / det;
  o[0]=(a11*b11-a12*b10+a13*b09)*det;  o[1]=(a02*b10-a01*b11-a03*b09)*det;
  o[2]=(a31*b05-a32*b04+a33*b03)*det;  o[3]=(a22*b04-a21*b05-a23*b03)*det;
  o[4]=(a12*b08-a10*b11-a13*b07)*det;  o[5]=(a00*b11-a02*b08+a03*b07)*det;
  o[6]=(a32*b02-a30*b05-a33*b01)*det;  o[7]=(a20*b05-a22*b02+a23*b01)*det;
  o[8]=(a10*b10-a11*b08+a13*b06)*det;  o[9]=(a01*b08-a00*b10-a03*b06)*det;
  o[10]=(a30*b04-a31*b02+a33*b00)*det; o[11]=(a21*b02-a20*b04-a23*b00)*det;
  o[12]=(a11*b07-a10*b09-a12*b06)*det; o[13]=(a00*b09-a01*b07+a02*b06)*det;
  o[14]=(a31*b01-a30*b03-a32*b00)*det; o[15]=(a20*b03-a21*b01+a22*b00)*det;

}
function m3Normal(o, m) {
  const a00=m[0],a01=m[1],a02=m[2], a10=m[4],a11=m[5],a12=m[6], a20=m[8],a21=m[9],a22=m[10];
  const b01=a22*a11-a12*a21, b11=-a22*a10+a12*a20, b21=a21*a10-a11*a20;
  let d = a00*b01 + a01*b11 + a02*b21;
  if (!d) { o.fill(0); o[0]=o[4]=o[8]=1; return o; }
  d = 1 / d;
  o[0]=b01*d; o[1]=b11*d; o[2]=b21*d;
  o[3]=(-a22*a01+a02*a21)*d; o[4]=(a22*a00-a02*a20)*d; o[5]=(-a21*a00+a01*a20)*d;
  o[6]=(a12*a01-a02*a11)*d;  o[7]=(-a12*a00+a02*a10)*d; o[8]=(a11*a00-a01*a10)*d;
  return o;
}
function xform(m, x, y, z, o) {
  o[0]=m[0]*x+m[4]*y+m[8]*z+m[12]; o[1]=m[1]*x+m[5]*y+m[9]*z+m[13]; o[2]=m[2]*x+m[6]*y+m[10]*z+m[14];
  return o;
}

// 3. WEBGL2 CONTEXT & GLSL ES 3.00 SHADERS

const gl = cv.getContext("webgl2", { antialias: false, alpha: false, depth: true, powerPreference: "high-performance" });
if (!gl) {
  $("card").innerHTML = `<h1>WebGL2 Required</h1><p class="lede">Lagoon Open's 3D engine needs WebGL2 (supported in Chrome, Edge, Firefox, and Safari).</p>`;
  $("overlay").hidden = false;

}
const ANISO_EXT = gl.getExtension("EXT_texture_filter_anisotropic");
const MAX_ANISO = ANISO_EXT ? Math.min(8, gl.getParameter(ANISO_EXT.MAX_TEXTURE_MAX_ANISOTROPY_EXT)) : 1;
const MAX_SAMPLES = Math.min(4, gl.getParameter(gl.MAX_SAMPLES) || 0);

function compileShader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, compileShader(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, compileShader(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, "");
    u[name] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}

const GLSL_SKY_HELPERS = `
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*0.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);return mix(mix(hash21(i),hash21(i+vec2(1,0)),u.x),mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),u.x),u.y);}
float fbm2(vec2 p){return vnoise(p)*0.62+vnoise(p*2.07+vec2(19.1,7.7))*0.38;}
vec3 fogSky(vec3 rd){
  vec3 dir=normalize(rd),sun=normalize(uSunDir);
  float elev=pow(max(dir.y,0.0),0.44),mu=max(dot(dir,sun),0.0);
  vec3 col=mix(uHorizonCol,uZenithCol,elev);
  col+=uSunCol*(0.75*(1.0+mu*mu))*pow(1.0-elev,2.0)*0.05;
  col+=uSunCol*pow(mu,8.0)*0.10;
  return col;
}
vec3 skyColor(vec3 rd,float discOn){
  vec3 dir=normalize(rd),sun=normalize(uSunDir),col=fogSky(dir);
  float up=dir.y,mu=max(dot(dir,sun),0.0),cover=clamp(uCloudCover,0.0,1.0);
  vec2 cuv=dir.xz/max(up,0.12)*0.42+vec2(uTime*0.010,uTime*0.004);
  float dens=smoothstep(0.76-cover*0.48,0.95-cover*0.22,fbm2(cuv*1.55));
  float cf=dens*smoothstep(0.03,0.22,up);
  float silver=pow(mu,2.2);
  vec3 cloudCol=mix(uZenithCol*0.28,uSunCol,0.22+0.78*silver);
  cloudCol=mix(cloudCol,uHorizonCol,clamp(1.0-up,0.0,1.0)*0.55);
  col=mix(col,cloudCol,cf*0.92);
  float occ=1.0-cf*0.82,sunUp=smoothstep(-0.02,0.03,sun.y);
  col+=uSunCol*discOn*occ*sunUp*(pow(mu,220.0)*0.65+smoothstep(0.99945,0.99985,mu)*5.5);
  return col;
}`;

const GLSL_SHADOW_FN = `
float shadowFactor(vec3 wp,vec3 N,vec3 L){
  if(uShadowOn<0.5)return 1.0;
  float graze=clamp(1.0-dot(N,L),0.0,1.0);
  vec4 lc=uLightVP*vec4(wp+N*(uShadowBias.x*graze),1.0);
  if(lc.w<=0.0)return 1.0;
  vec3 sc=lc.xyz/lc.w*0.5+0.5;
  if(sc.x<0.0||sc.y<0.0||sc.x>1.0||sc.y>1.0||sc.z<0.0||sc.z>1.0)return 1.0;
  float z=sc.z-(uShadowBias.y+uShadowBias.z*graze);
  vec2 texel=1.0/vec2(textureSize(uShadowMap,0));
  float vis=0.0;
  for(int y=-1;y<=1;y++){
    for(int x=-1;x<=1;x++){
      float w=(x==0?2.0:1.0)*(y==0?2.0:1.0);
      vis+=step(z,texture(uShadowMap,sc.xy+vec2(float(x),float(y))*texel).r)*w;
    }
  }
  return vis*0.0625;
}`;

const GLSL_WIND_FN = `
vec3 deformObj(vec3 p,float amp,float time,vec4 hit){
  if(amp!=0.0){
    float k=amp*clamp(p.y,0.0,1.25);
    p.z+=sin(time*2.2+p.x*1.1+p.y*4.0)*k*0.45;
    p.x+=cos(time*1.7+p.y*5.0)*k*0.2;
  }
  if(hit.z>0.001){
    float d=length(p.xy-hit.xy);
    float w=exp(-d*1.35)*sin(d*9.0-hit.w*26.0)*hit.z*smoothstep(0.0,0.18,p.y);
    p.z+=w;
  }
  return p;
}`;

PROG.shadow = mkProg(`#version 300 es

// 2. Main lit geometry
PROG.lit = mkProg(`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec2 aUv;
layout(location=3) in vec4 aCol;

uniform vec4 uNetHit;

out vec2 vUv;

  vec4 w=uModel*vec4(deformObj(aPos,uWindAmp,uTime,uNetHit),1.0);

precision highp float;
in vec3 vWorld,vN;
in vec2 vUv;
in vec4 vCol;
uniform vec3 uCamPos,uSunDir,uSunCol,uSkyCol,uGroundCol,uRimCol,uZenithCol,uHorizonCol,uShadowBias,uTint;
uniform float uRimPower,uRimStrength,uFogNear,uFogFar,uAlbedoBlend,uRoughness,uSpecStrength,uAlphaCut,uEmit,uShadowOn,uCloudCover,uTime;
uniform sampler2D uAlbedo;
uniform highp sampler2D uShadowMap;
uniform mat4 uLightVP;

uniform vec3 uPointCol[4];

  float face=smoothstep(0.0,0.08,ndl);
  vec3 col=albedo*mix(uGroundCol,uSkyCol,clamp(N.y*0.5+0.5,0.0,1.0));
  col+=albedo*uSunCol*diff*vis;

    float d=length(toL),att=clamp(1.0-d/max(uPoints[i].w,0.001),0.0,1.0);

// 3. Instanced Crowd Shader (72 animated cheering spectators in 1 draw call)
PROG.crowd = mkProg(`#version 300 es
precision highp float;
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec4 aCol;     // rgb = local tint, a = partId (0=legs,1=shirt,2=head,3=arms)
layout(location=3) in vec4 iSeat;    // xyz = seat pos, w = yaw
layout(location=4) in vec4 iStyle;   // rgb = shirt col, w = seed
uniform mat4 uViewProj;

void main(){

  vec3 p=aPos,n=aNrm;

        lc = Math.max(lc, cov(z - (NET - SVC), 0.032, txZ), cov(z - (NET + SVC), 0.032, txZ));
      }
      if (z >= NET - SVC - 0.03 && z <= NET + SVC + 0.03) lc = Math.max(lc, cov(x, 0.032, txX));
      if ((z >= 0 && z <= 0.34) || (z >= L - 0.34 && z <= L)) lc = Math.max(lc, cov(x, 0.032, txX));
      if (lc > 0) {
        r = lerp(r, 246, lc); gr = lerp(gr, 242, lc); b = lerp(b, 228, lc);
      }
      const idx = (py * S + px) * 4;
      d[idx] = r; d[idx + 1] = gr; d[idx + 2] = b; d[idx + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  // Subtle baseline scuffs
  g.fillStyle = "rgba(12,38,36,0.055)";
  for (let i = 0; i < 36; i++) {
    const sx = (ihash(i, 11) - 0.5) * 7.2, sz = (i & 1) ? (0.4 + ihash(i, 17) * 2.0) : (L - 0.4 - ihash(i, 19) * 2.0);
    const cx = ((sx - x0) / spanX) * S, cy = (1 - (sz - z0) / spanZ) * S;
    g.beginPath(); g.ellipse(cx, cy, 4 + ihash(i, 23) * 9, 2 + ihash(i, 29) * 4, ihash(i, 31) * 3, 0, TAU); g.fill();
  }
  // Baseline court stencil (horizontally flipped to read cleanly left-to-right from -Z camera)
  g.save();
  g.font = "900 34px 'Trebuchet MS','Arial Black',sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(255,248,236,0.52)";
  const cyNear = (1 - (-2.2 - z0) / spanZ) * S, cyFar = (1 - (L + 2.2 - z0) / spanZ) * S;
  g.save(); g.translate(S / 2, cyNear); g.scale(-1, 1); g.fillText("LAGOON OPEN", 0, 0); g.restore();
  g.save(); g.translate(S / 2, cyFar); g.scale(-1, -1); g.fillText("LAGOON OPEN", 0, 0); g.restore();
  g.restore();
  return uploadTex(c, gl.CLAMP_TO_EDGE, gl.CLAMP_TO_EDGE, true, true);
}

function mkPierTex() {
  const S = 512, c = document.createElement("canvas");
  c.width = S; c.height = S;
  const g = c.getContext("2d"), img = g.createImageData(S, S), d = img.data;
  for (let py = 0; py < S; py++) {
    const v = py / S;
    for (let px = 0; px < S; px++) {
      const plank = px >> 6, localX = px & 63;
      const t = ihash(plank, 3);
      let r = lerp(164, 200, t), gr = lerp(104, 136, t), b = lerp(60, 86, t);
      const wob = Math.sin(v * TAU * 2 + plank) * 1.4;
      const grain = Math.sin((v * 24 + wob) * TAU * 0.5 + localX * 0.35) * 9 + (ihash(px, py) - 0.5) * 6;
      const weather = 0.92 + 0.08 * vnoise2(px / 48, py / 48);
      r = (r + grain) * weather; gr = (gr + grain * 0.8) * weather; b = (b + grain * 0.6) * weather;
      const butt = ((0.17 + plank * 0.37) % 1);
      if (localX < 3 || Math.abs(v - butt) < 0.004) { r *= 0.46; gr *= 0.44; b *= 0.42; }
      const nx = localX - 32;
      if (Math.abs(nx) < 18 && (Math.hypot(nx - 14, (v - 0.07) * S) < 2.6 || Math.hypot(nx + 14, (v - 0.07) * S) < 2.6 ||
          Math.hypot(nx - 14, (v - butt - 0.03) * S) < 2.6 || Math.hypot(nx + 14, (v - butt - 0.03) * S) < 2.6)) {
        r *= 0.32; gr *= 0.32; b *= 0.34;
      }
      const idx = (py * S + px) * 4;
      d[idx] = clamp(r, 0, 255); d[idx + 1] = clamp(gr, 0, 255); d[idx + 2] = clamp(b, 0, 255); d[idx + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return uploadTex(c, gl.REPEAT, gl.REPEAT, true, true);
}

function mkNetTex() {
  const S = 256, c = document.createElement("canvas");
  c.width = S; c.height = S;
  const g = c.getContext("2d");
  g.clearRect(0, 0, S, S);
  const cell = 32;
  g.strokeStyle = "rgba(242,238,230,0.92)";
  g.lineWidth = 4.5;
  for (let i = 0; i <= S; i += cell) {
    g.beginPath(); g.moveTo(i, 0); g.lineTo(i, S); g.stroke();
    g.beginPath(); g.moveTo(0, i); g.lineTo(S, i); g.stroke();
  }
  return uploadTex(c, gl.REPEAT, gl.REPEAT, true, true);
}

function mkBallTex() {
  const W2 = 256, H2 = 128, c = document.createElement("canvas");
  c.width = W2; c.height = H2;
  const g = c.getContext("2d"), img = g.createImageData(W2, H2), d = img.data;
  const seam = [];
  for (let i = 0; i < 160; i++) {
    const phi = (i / 160) * TAU, th = Math.PI * 0.5 + Math.sin(2 * phi) * 0.62;
    seam.push([Math.sin(th) * Math.cos(phi), Math.cos(th), Math.sin(th) * Math.sin(phi)]);
  }
  for (let py = 0; py < H2; py++) {
    const v = (py + 0.5) / H2, lat = (v - 0.5) * Math.PI, cl = Math.cos(lat), sy = Math.sin(lat);
    for (let px = 0; px < W2; px++) {
      const u = (px + 0.5) / W2, lon = (u - 0.5) * TAU;
      const sx = cl * Math.cos(lon), sz = cl * Math.sin(lon);
      let best = 9;
      for (let i = 0; i < 160; i++) {
        const s = seam[i], dot = clamp(sx * s[0] + sy * s[1] + sz * s[2], -1, 1);
        const ang = Math.acos(dot);
        if (ang < best) best = ang;
      }
      const fuzz = (ihash(px, py) - 0.5) * 18 + (vnoise2(px * 0.25, py * 0.25) - 0.5) * 16;
      let r = 228 + fuzz, gr = 246 + fuzz * 0.8, b = 52 + fuzz * 0.6;
      const sm = 1 - smoothstep(0.055, 0.082, best);
      const edge = smoothstep(0.055, 0.075, best) * (1 - smoothstep(0.075, 0.11, best));
      r = lerp(r * (1 - edge * 0.22), 250, sm);
      gr = lerp(gr * (1 - edge * 0.22), 248, sm);
      b = lerp(b * (1 - edge * 0.22), 240, sm);
      const idx = (py * W2 + px) * 4;
      d[idx] = clamp(r, 0, 255); d[idx + 1] = clamp(gr, 0, 255); d[idx + 2] = clamp(b, 0, 255); d[idx + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return uploadTex(c, gl.REPEAT, gl.CLAMP_TO_EDGE, true, false);
}

// =========================================================================
// 5. PROCEDURAL 3D GEOMETRY & INSTANCED ENVIRONMENT
// =========================================================================
class MeshBuilder {
  constructor() { this.p = []; this.n = []; this.u = []; this.c = []; this.i = []; this.v = 0; }
  vert(x, y, z, nx, ny, nz, u, v, col) {
    this.p.push(x, y, z); this.n.push(nx, ny, nz); this.u.push(u, v);
    this.c.push(col[0], col[1], col[2], col.length > 3 ? col[3] : 1);
    return this.v++;
  }
  tri(a, b, c) { this.i.push(a, b, c); }
  quad(a, b, c, d) { this.i.push(a, b, c, a, c, d); }
  addBox(cx, cy, cz, hx, hy, hz, col, uvScale = 0) {
    const F = [
      [[1,0,0],[0,1,0],[0,0,1]], [[-1,0,0],[0,1,0],[0,0,-1]],
      [[0,1,0],[0,0,-1],[1,0,0]], [[0,-1,0],[0,0,1],[1,0,0]],
      [[0,0,1],[0,1,0],[-1,0,0]], [[0,0,-1],[0,1,0],[1,0,0]]
    ];
    for (const [N, U, V] of F) {
      const b = this.v;
      const sx = N[0]*hx, sy = N[1]*hy, sz = N[2]*hz;
      const ux = U[0]*hx, uy = U[1]*hy, uz = U[2]*hz;
      const vx = V[0]*hx, vy = V[1]*hy, vz = V[2]*hz;
      const pts = [[-1,-1],[1,-1],[1,1],[-1,1]];
      for (let k = 0; k < 4; k++) {
        const px = cx + sx + ux*pts[k][0] + vx*pts[k][1];
        const py = cy + sy + uy*pts[k][0] + vy*pts[k][1];
        const pz = cz + sz + uz*pts[k][0] + vz*pts[k][1];
        const tu = uvScale ? px / uvScale : (pts[k][0] * 0.5 + 0.5);
        const tv = uvScale ? pz / uvScale : (pts[k][1] * 0.5 + 0.5);
        this.vert(px, py, pz, N[0], N[1], N[2], tu, tv, col);
      }
      this.quad(b, b + 1, b + 2, b + 3);
    }
  }
  addCyl(cx, cy, cz, r0, r1, y0, y1, seg, col, caps = true) {
    const b = this.v, dy = y1 - y0, dr = r0 - r1, nl = Math.hypot(dy, dr) || 1;
    const nr = dy / nl, ny = dr / nl;
    for (let i = 0; i <= seg; i++) {
      const a = (i / seg) * TAU, ca = Math.cos(a), sa = Math.sin(a);
      this.vert(cx + ca * r0, cy + y0, cz + sa * r0, ca * nr, ny, sa * nr, i / seg, 0, col);
      this.vert(cx + ca * r1, cy + y1, cz + sa * r1, ca * nr, ny, sa * nr, i / seg, 1, col);
    }
    for (let i = 0; i < seg; i++) { const k = b + i * 2; this.quad(k, k + 2, k + 3, k + 1); }
    if (caps && r1 > 1e-4) {
      const tc = this.vert(cx, cy + y1, cz, 0, 1, 0, 0.5, 0.5, col);
      for (let i = 0; i <= seg; i++) {
        const a = (i / seg) * TAU;
        this.vert(cx + Math.cos(a) * r1, cy + y1, cz + Math.sin(a) * r1, 0, 1, 0, 0.5, 0.5, col);
      }
      for (let i = 0; i < seg; i++) this.tri(tc, tc + 1 + i + 1, tc + 1 + i);
    }
    if (caps && r0 > 1e-4) {
      const bc = this.vert(cx, cy + y0, cz, 0, -1, 0, 0.5, 0.5, col);
      for (let i = 0; i <= seg; i++) {
        const a = (i / seg) * TAU;
        this.vert(cx + Math.cos(a) * r0, cy + y0, cz + Math.sin(a) * r0, 0, -1, 0, 0.5, 0.5, col);
      }
      for (let i = 0; i < seg; i++) this.tri(bc, bc + 1 + i, bc + 1 + i + 1);
    }
  }
  addSphere(cx, cy, cz, rx, ry, rz, segU, segV, col) {
    const b = this.v;
    for (let j = 0; j <= segV; j++) {
      const th = (j / segV) * Math.PI, st = Math.sin(th), ct = Math.cos(th);
      for (let i = 0; i <= segU; i++) {
        const ph = (i / segU) * TAU, cp = Math.cos(ph), sp = Math.sin(ph);
        const nx = st * cp, ny = ct, nz = st * sp;
        this.vert(cx + nx * rx, cy + ny * ry, cz + nz * rz, nx, ny, nz, i / segU, 1 - j / segV, col);
      }
    }
    const row = segU + 1;
    for (let j = 0; j < segV; j++) for (let i = 0; i < segU; i++) {
      const a = b + j * row + i;
      this.quad(a, a + 1, a + row + 1, a + row);
    }
  }
  addCapsuleDown(r, len, seg, col) {
    this.addCyl(0, 0, 0, r, r, -len, 0, seg, col, false);
    this.addSphere(0, 0, 0, r, r, r, seg, 6, col);
    this.addSphere(0, -len, 0, r, r, r, seg, 6, col);
  }
  addTorus(cx, cy, cz, rx, ry, tube, maj, min, col, planeXY = true) {
    const b = this.v;
    for (let i = 0; i <= maj; i++) {
      const t = (i / maj) * TAU, ct = Math.cos(t), st = Math.sin(t);
      const ex = ct * rx, ey = st * ry;
      let ox = ry * ct, oy = rx * st, ol = Math.hypot(ox, oy) || 1; ox /= ol; oy /= ol;
      for (let j = 0; j <= min; j++) {
        const a = (j / min) * TAU, ca = Math.cos(a), sa = Math.sin(a);
        if (planeXY) {
          const nx = ca * ox, ny = ca * oy, nz = sa;
          this.vert(cx + ex + nx * tube, cy + ey + ny * tube, cz + nz * tube, nx, ny, nz, i / maj, j / min, col);
        } else {
          const nx = ca * ox, ny = sa, nz = ca * oy;
          this.vert(cx + ex + nx * tube, cy + ny * tube, cz + ey + nz * tube, nx, ny, nz, i / maj, j / min, col);
        }
      }
    }
    const row = min + 1;
    for (let i = 0; i < maj; i++) for (let j = 0; j < min; j++) {
      const a = b + i * row + j;
      this.quad(a, a + row, a + row + 1, a + 1);
    }
  }
  build() {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const bind = (loc, arr, sz) => {
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(arr), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, sz, gl.FLOAT, false, 0, 0);
    };
    bind(0, this.p, 3); bind(1, this.n, 3); bind(2, this.u, 2); bind(3, this.c, 4);
    const ib = gl.createBuffer(), use32 = this.v > 65535;
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, use32 ? new Uint32Array(this.i) : new Uint16Array(this.i), gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao, count: this.i.length, type: use32 ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT };
  }
}

function buildNetMesh() {
  const b = new MeshBuilder(), nx = 44, ny = 8;
  const netTop = x => { const ax = Math.abs(x) / POST_X; return NETH + (POST_H - NETH) * ax * ax; };
  for (let j = 0; j <= ny; j++) {
    const ty = j / ny;
    for (let i = 0; i <= nx; i++) {
      const tx = i / nx, x = lerp(-POST_X, POST_X, tx), y = ty * (netTop(x) - 0.05);
      b.vert(x, y, 0, 0, 0, -1, tx * 28, ty * 4.5, WHITE);

  const row = nx + 1;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {

}

function buildNetTapeMesh() {

function buildOceanMesh() {

function buildIslandsMesh() {
  const b = new MeshBuilder();
  const defs = [
    [-58, 92, 26, 13, 18, [0.16, 0.24, 0.20]],
    [-22, 108, 16, 7.5, 12, [0.18, 0.25, 0.22]],
    [48, 98, 22, 10.5, 16, [0.15, 0.22, 0.19]],
    [82, 74, 18, 8, 14, [0.17, 0.24, 0.20]],
    [-86, 56, 20, 9, 15, [0.16, 0.23, 0.20]]
  ];
  for (const [cx, cz, rx, h, rz, col] of defs) {
    const segU = 18, segV = 6, base = b.v;
    const sand = [0.68, 0.56, 0.36];
    for (let j = 0; j <= segV; j++) {
      const t = j / segV, r = 1 - t * 0.96;
      const y = -1.6 + Math.pow(t, 0.85) * h;
      const c = t < 0.22 ? sand : [col[0] * (0.8 + t * 0.4), col[1] * (0.8 + t * 0.4), col[2] * (0.8 + t * 0.4)];
      for (let i = 0; i <= segU; i++) {
        const a = (i / segU) * TAU, cr = r * (0.82 + 0.18 * Math.sin(a * 3 + cx) + 0.1 * Math.cos(a * 5 + cz));
        const px = cx + Math.cos(a) * rx * cr, pz = cz + Math.sin(a) * rz * cr;
        const ny = 0.55 + 0.45 * t, nx = Math.cos(a) * (1 - t * 0.5), nz = Math.sin(a) * (1 - t * 0.5);
        const nl = Math.hypot(nx, ny, nz) || 1;
        b.vert(px, y, pz, nx / nl, ny / nl, nz / nl, i / segU, t, c);
      }
    }
    const row = segU + 1;
    for (let j = 0; j < segV; j++) for (let i = 0; i < segU; i++) {
      const a = base + j * row + i; b.quad(a, a + 1, a + row + 1, a + row);
    }
  }
  return b.build();
}

function buildPalmMesh() {
  const b = new MeshBuilder();
  // Segmented curved trunk
  const segs = 9, H2 = 5.4, bark = [0.36, 0.22, 0.12];
  let px = 0, py = 0.65, pz = 0;
  for (let i = 0; i < segs; i++) {
    const t0 = i / segs, t1 = (i + 1) / segs;
    const x0 = Math.sin(t0 * 1.4) * 0.72, y0 = 0.65 + t0 * H2;
    const x1 = Math.sin(t1 * 1.4) * 0.72, y1 = 0.65 + t1 * H2;
    const r0 = lerp(0.20, 0.09, t0), r1 = lerp(0.20, 0.09, t1);
    const col = (i & 1) ? bark : [0.30, 0.18, 0.10];
    const base = b.v, N = 7;
    for (let k = 0; k <= N; k++) {
      const a = (k / N) * TAU, ca = Math.cos(a), sa = Math.sin(a);
      b.vert(x0 + ca * r0, y0, sa * r0, ca, 0.15, sa, k / N, 0, col);
      b.vert(x1 + ca * r1, y1, sa * r1, ca, 0.15, sa, k / N, 1, col);
    }
    for (let k = 0; k < N; k++) { const m = base + k * 2; b.quad(m, m + 2, m + 3, m + 1); }
    px = x1; py = y1;
  }
  // Coconuts
  for (let i = 0; i < 3; i++) {
    const a = (i / 3) * TAU;
    b.addSphere(px + Math.cos(a) * 0.18, py - 0.12, pz + Math.sin(a) * 0.18, 0.12, 0.14, 0.12, 6, 5, [0.24, 0.15, 0.07]);
  }
  // 8 arching fronds
  const leafA = [0.14, 0.44, 0.18], leafB = [0.24, 0.56, 0.20];
  for (let f = 0; f < 8; f++) {
    const yaw = (f / 8) * TAU + (f & 1) * 0.18, len = 2.6 + (f & 1) * 0.45, wid = 0.46;
    const cy = Math.cos(yaw), sy = Math.sin(yaw), base = b.v, S = 7;
    const col = (f & 1) ? leafA : leafB;
    for (let i = 0; i <= S; i++) {
      const t = i / S, u = 1 - t;
      const ly = 2 * u * t * (len * 0.52) + t * t * (-len * 0.34);
      const lz = 2 * u * t * (len * 0.42) + t * t * len;
      const hw = wid * Math.pow(Math.sin(t * Math.PI), 0.6) * (0.88 + 0.12 * Math.sin(t * 20));
      const cam = hw * 0.25;
      const pts = [[-hw, ly, lz, -0.35, 0.9, 0], [0, ly + cam, lz, 0, 1, 0], [hw, ly, lz, 0.35, 0.9, 0]];
      for (const q of pts) {
        const rx = q[0] * cy + q[2] * sy, rz = -q[0] * sy + q[2] * cy;
        const nx = q[3] * cy + q[5] * sy, nz = -q[3] * sy + q[5] * cy;
        b.vert(px + rx, py + q[1], pz + rz, nx, q[4], nz, 0.5, t, col);
      }
    }
    for (let i = 0; i < S; i++) {
      const k = base + i * 3;
      b.quad(k, k + 3, k + 4, k + 1); b.quad(k + 1, k + 4, k + 5, k + 2);
      b.quad(k + 1, k + 4, k + 3, k); b.quad(k + 2, k + 5, k + 4, k + 1);
    }
  }
  return b.build();
}

  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(b.i), gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return { vao, count: b.i.length, instances: idx };

}

  const cols = [[1,0.38,0.22],[1,0.84,0.22],[0.26,0.92,0.84],[1,0.96,0.88],[1,0.45,0.75]];
  for (let i = 0; i < count; i++) {
    const c = cols[i % cols.length], a = Math.random() * TAU, s = rand(1.5, 6.5);
    spawnPart(x + rand(-1.5, 1.5), y + rand(0, 1.5), z + rand(-1.5, 1.5), Math.cos(a) * s, rand(3.5, 8.5), Math.sin(a) * s,
      c[0], c[1], c[2], rand(0.11, 0.19), rand(1.2, 2.2), 3.4, 2.4);

function updateParticles(dt) {
  let out = 0;
  for (let i = 0; i < parts.n; i++) {
    const nl = parts.life[i] - dt;
    if (nl <= 0) {
      const last = --parts.n;
      if (i < last) {
        parts.x[i]=parts.x[last]; parts.y[i]=parts.y[last]; parts.z[i]=parts.z[last];
        parts.vx[i]=parts.vx[last]; parts.vy[i]=parts.vy[last]; parts.vz[i]=parts.vz[last];
        parts.r[i]=parts.r[last]; parts.g[i]=parts.g[last]; parts.b[i]=parts.b[last];
        parts.sz[i]=parts.sz[last]; parts.life[i]=parts.life[last]; parts.maxL[i]=parts.maxL[last];
        parts.grav[i]=parts.grav[last]; parts.emit[i]=parts.emit[last];
      }
      i--; continue;
    }
    parts.life[i] = nl;
    parts.vy[i] -= parts.grav[i] * dt;
    parts.x[i] += parts.vx[i] * dt; parts.y[i] += parts.vy[i] * dt; parts.z[i] += parts.vz[i] * dt;
    if (parts.y[i] < 0.03) { parts.y[i] = 0.03; parts.vy[i] *= -0.3; parts.vx[i] *= 0.7; parts.vz[i] *= 0.7; }
    const k = nl / parts.maxL[i], k3 = out * 3, k4 = out * 4, k2 = out * 2;
    parts.iPos[k3] = parts.x[i]; parts.iPos[k3 + 1] = parts.y[i]; parts.iPos[k3 + 2] = parts.z[i];
    parts.iCol[k4] = parts.r[i]; parts.iCol[k4 + 1] = parts.g[i]; parts.iCol[k4 + 2] = parts.b[i]; parts.iCol[k4 + 3] = k;
    parts.iExt[k2] = parts.sz[i] * (0.45 + 0.55 * k); parts.iExt[k2 + 1] = parts.emit[i];
    out++;
  }
}

// =========================================================================
// 7. 3D ARTICULATED CHARACTER RIG & PROCEDURAL ANIMATION
// =========================================================================
const BONE_MATS = [Array.from({ length: 18 }, M4), Array.from({ length: 18 }, M4)];
const TMP_M = M4(), TMP_M2 = M4(), TMP_N = M3(), TMP_V = new Float32Array(3);

// Bone indices: 0=root, 1=pelvis, 2=chest, 3=head, 4=uArmL, 5=lArmL, 6=uArmR, 7=lArmR, 8=racket,
//               9=uLegL, 10=lLegL, 11=uLegR, 12=lLegR, 13=tailL, 14=tailR
function updateCharacterRig(p, slot, dt, isNear) {
  const M = BONE_MATS[slot];
  const yaw = isNear ? 0 : Math.PI;
  const spd = Math.hypot(p.vx, p.vz);
  const runAmp = clamp(spd / 5.2, 0, 1);
  p.run += dt * (2.5 + 8.5 * runAmp);
  p.splitT = Math.max(0, p.splitT - dt);
  p.swingT = Math.max(0, p.swingT - dt);
  p.tossArm = Math.max(0, p.tossArm - dt * 1.4);
  p.lungeT = Math.max(0, p.lungeT - dt);
  p.emoteT = Math.max(0, p.emoteT - dt);

  const s = Math.sin(p.run), split = p.splitT > 0 ? Math.sin((1 - p.splitT / 0.24) * Math.PI) : 0;
  let rootY = 0.88 - 0.05 * (1 - runAmp) + Math.abs(s) * 0.03 * runAmp + split * 0.09;
  let spineRx = (0.14 + clamp((isNear ? p.vz : -p.vz) * 0.04, -0.1, 0.24));
  let spineRy = 0, spineRz = clamp((isNear ? -p.vx : p.vx) * 0.04, -0.18, 0.18);
  let pelvRy = 0;

  // Base locomotion arms & legs
  let uArmL_rx = -0.32 - s * 0.45 * runAmp, uArmL_rz = -0.45 - split * 0.15, lArmL_rx = -0.82;
  let uArmR_rx = -0.38 + s * 0.40 * runAmp, uArmR_ry = -0.20, uArmR_rz = 0.58 + split * 0.15;
  let lArmR_rx = -0.95, rack_rx = -1.15, rack_rz = 0.0;
  let uLegL_rx = -0.36 + s * 0.62 * runAmp, uLegL_rz = -0.08 - split * 0.12, lLegL_rx = 0.52 + Math.max(0, -s) * 0.65 * runAmp - split * 0.22;
  let uLegR_rx = -0.36 - s * 0.62 * runAmp, uLegR_rz = 0.08 + split * 0.12, lLegR_rx = 0.52 + Math.max(0, s) * 0.65 * runAmp - split * 0.22;

  // Serve toss trophy pose
  if (p.tossArm > 0) {
    const k = smoothstep(0, 1, p.tossArm);
    uArmL_rz = lerp(uArmL_rz, -2.55, k); uArmL_rx = lerp(uArmL_rx, 0.18, k); lArmL_rx = lerp(lArmL_rx, -0.15, k);
    uArmR_rx = lerp(uArmR_rx, 0.62, k); uArmR_rz = lerp(uArmR_rz, 1.85, k); lArmR_rx = lerp(lArmR_rx, -1.60, k);
    spineRy = lerp(spineRy, -0.32, k); pelvRy = lerp(pelvRy, -0.20, k);
  }

  // Active swing animation overlay
  if (p.swingT > 0) {
    const dur = p.swingDur || 0.36;
    const rawU = 1 - p.swingT / dur;
    const u = rawU < 0.45 ? (rawU / 0.45) * (rawU / 0.45) * 0.48 : 0.48 + ((rawU - 0.45) / 0.55) * 0.52;
    const k1 = smoothstep(0, 0.48, u), k2 = smoothstep(0.48, 1.0, u);
    const st = p.swingType || "fh";
    if (st === "fh") {
      spineRy = lerp(lerp(-0.42, 0.12, k1), 0.52, k2);
      pelvRy = spineRy * 0.65;
      uArmR_rx = lerp(lerp(0.28, -0.65, k1), -1.02, k2);
      uArmR_ry = lerp(lerp(-0.62, -0.16, k1), 0.38, k2);
      uArmR_rz = lerp(lerp(1.22, 0.92, k1), 0.48, k2);
      lArmR_rx = lerp(lerp(-1.65, -0.42, k1), -0.35, k2);
      rack_rx = lerp(lerp(-0.70, -1.42, k1), -1.78, k2);
    } else if (st === "bh") {
      spineRy = lerp(lerp(0.42, -0.08, k1), -0.50, k2);
      pelvRy = spineRy * 0.65;
      uArmR_rx = lerp(lerp(-0.18, -0.55, k1), -0.88, k2);
      uArmR_ry = lerp(lerp(0.45, -0.35, k1), -0.55, k2);
      uArmR_rz = lerp(lerp(-0.35, 0.25, k1), 0.78, k2);
      lArmR_rx = lerp(lerp(-1.18, -0.32, k1), -0.28, k2);
      rack_rx = lerp(lerp(-1.05, -1.35, k1), -1.68, k2);
      rack_rz = lerp(0.4, -0.2, k2);
    } else if (st === "slice") {
      spineRx = lerp(0.08, 0.42, u);
      uArmR_rx = lerp(lerp(-1.05, 0.18, k1), 0.68, k2);
      uArmR_rz = lerp(lerp(0.90, 0.55, k1), 0.28, k2);
      lArmR_rx = lerp(-0.72, -1.15, u);
      rack_rx = lerp(lerp(-1.72, -0.70, k1), 0.15, k2);
      rack_rz = lerp(-0.40, 0.55, u);
    } else if (st === "smash" || st === "serve") {
      rootY += Math.sin(clamp(rawU / 0.72, 0, 1) * Math.PI) * (st === "smash" ? 0.22 : 0.12);
      spineRx = lerp(lerp(0.32, -0.14, k1), 0.22, k2);
      spineRy = lerp(lerp(-0.42, 0.22, k1), 0.52, k2);
      uArmR_rx = lerp(lerp(0.55, -1.32, k1), -0.70, k2);
      uArmR_rz = lerp(lerp(2.22, 0.28, k1), -0.22, k2);
      lArmR_rx = lerp(lerp(-1.85, -0.12, k1), -0.35, k2);
      rack_rx = lerp(lerp(-0.55, -1.55, k1), -1.92, k2);
    }
  }

  // Lunge stretch
  if (p.lungeT > 0) {
    const lk = Math.min(1, p.lungeT * 4), dir = p.lungeDir || 1;
    spineRx = lerp(spineRx, 0.40, lk); spineRz = lerp(spineRz, -0.32 * dir, lk);
    rootY -= 0.12 * lk;
  }

  // Victory jump / Slump
  if (p.emoteT > 0) {
    if (p.emote === "win") {
      const eu = 1 - p.emoteT / 1.4;
      rootY += Math.abs(Math.sin(eu * Math.PI * 2)) * 0.24;
      uArmL_rz = -2.55; uArmR_rz = 2.55; uArmR_rx = -0.2 + Math.sin(eu * TAU * 3) * 0.25;
      lArmL_rx = -0.35; lArmR_rx = -0.35;
    } else {
      spineRx = 0.48; uArmL_rz = -0.22; uArmR_rz = 0.22; lArmL_rx = -0.4; lArmR_rx = -0.4;
    }
  }

  // Head tracks the ball
  let headRy = 0, headRx = -0.10;
  if (ball.visible) {
    const dx = ball.x - p.x, dz = ball.z - p.z;
    const lx = isNear ? dx : -dx, lz = isNear ? dz : -dz;
    headRy = clamp(Math.atan2(lx, Math.max(1.0, lz)) * 0.55, -0.65, 0.65);
    headRx = clamp(-Math.atan2(ball.y - 1.55, Math.hypot(lx, lz) + 0.5) * 0.6, -0.55, 0.35);
  }

  // Spring headband tails
  const tailTarget = clamp(-spd * 0.18 + Math.sin(game.now * 3.4 + slot * 2) * 0.12, -0.85, 0.35);
  p.tailAng = lerp(p.tailAng || 0, tailTarget, clamp(dt * 9, 0, 1));

  // Compose hierarchy (facing +Z, character's RIGHT arm is -X, LEFT arm is +X!)
  eulerYXZ(M[0], 0, yaw, 0, p.x, 0, p.z);                                          // 0 root
  eulerYXZ(TMP_M, 0.08, pelvRy, 0, 0, rootY, 0);          m4Mul(M[1], M[0], TMP_M); // 1 pelvis
  eulerYXZ(TMP_M, spineRx, spineRy, spineRz, 0, 0.13, 0); m4Mul(M[2], M[1], TMP_M); // 2 chest
  eulerYXZ(TMP_M, headRx, headRy, 0, 0, 0.43, 0);         m4Mul(M[3], M[2], TMP_M); // 3 head
  eulerYXZ(TMP_M, uArmL_rx, -0.14, -uArmL_rz, 0.195, 0.34, 0); m4Mul(M[4], M[2], TMP_M); // 4 uArmL (toss)
  eulerYXZ(TMP_M, lArmL_rx, 0, 0, 0, -0.26, 0);           m4Mul(M[5], M[4], TMP_M); // 5 lArmL
  eulerYXZ(TMP_M, uArmR_rx, -uArmR_ry, -uArmR_rz, -0.195, 0.34, 0); m4Mul(M[6], M[2], TMP_M); // 6 uArmR (racket!)
  eulerYXZ(TMP_M, lArmR_rx, 0, 0, 0, -0.26, 0);           m4Mul(M[7], M[6], TMP_M); // 7 lArmR
  eulerYXZ(TMP_M, rack_rx, 0, -rack_rz, 0, -0.26, 0.02);  m4Mul(M[8], M[7], TMP_M); // 8 racket
  eulerYXZ(TMP_M, uLegL_rx, 0, -uLegL_rz, 0.10, -0.05, 0); m4Mul(M[9], M[1], TMP_M);  // 9 uLegL
  eulerYXZ(TMP_M, lLegL_rx, 0, 0, 0, -0.41, 0);           m4Mul(M[10], M[9], TMP_M);  // 10 lLegL
  eulerYXZ(TMP_M, uLegR_rx, 0, -uLegR_rz, -0.10, -0.05, 0); m4Mul(M[11], M[1], TMP_M);// 11 uLegR
  eulerYXZ(TMP_M, lLegR_rx, 0, 0, 0, -0.41, 0);           m4Mul(M[12], M[11], TMP_M); // 12 lLegR
  eulerYXZ(TMP_M, 0.35 + p.tailAng, -0.25, -0.2, -0.055, 0.04, -0.12); m4Mul(M[13], M[3], TMP_M);
  eulerYXZ(TMP_M, 0.35 + p.tailAng * 0.85, 0.25, 0.2, 0.055, 0.04, -0.12); m4Mul(M[14], M[3], TMP_M);

  // Extract racket tip & push to player's 3D swing trail ribbon
  if (isNear) {
    xform(M[8], 0, 0.68, 0, p.rackTip);
    xform(M[8], 0, 0.44, 0, p.rackMid);
    if (p.swingT > 0.04) {
      p.swingTrail.push([p.rackTip[0], p.rackTip[1], p.rackTip[2], p.rackMid[0], p.rackMid[1], p.rackMid[2]]);
      if (p.swingTrail.length > 15) p.swingTrail.shift();
    } else if (p.swingTrail.length) {
      p.swingTrail.shift();
    }
  }
}

function uploadRibbon(rib, pts, width, colStart, colEnd, isSwing) {
  const n = Math.min(pts.length, rib.maxPts);
  rib.count = n;
  if (n < 2) return;
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), q = pts[i], k = i * 2;
    let ax, ay, az, bx, by, bz;
    if (isSwing) {
      ax = q[0]; ay = q[1]; az = q[2];
      bx = q[3]; by = q[4]; bz = q[5];
    } else {
      const prev = pts[Math.max(0, i - 1)], next = pts[Math.min(n - 1, i + 1)];
      let tx = next.x - prev.x, ty = next.y - prev.y, tz = next.z - prev.z;
      const vx = cam.ex - q.x, vy = cam.ey - q.y, vz = cam.ez - q.z;
      let sx = ty * vz - tz * vy, sy = tz * vx - tx * vz, sz = tx * vy - ty * vx;
      const sl = Math.hypot(sx, sy, sz) || 1;
      const hw = width * (0.15 + 0.85 * t);
      sx = (sx / sl) * hw; sy = (sy / sl) * hw; sz = (sz / sl) * hw;
      ax = q.x - sx; ay = q.y - sy; az = q.z - sz;
      bx = q.x + sx; by = q.y + sy; bz = q.z + sz;
    }
    rib.pos[k * 3] = ax; rib.pos[k * 3 + 1] = ay; rib.pos[k * 3 + 2] = az;
    rib.pos[(k + 1) * 3] = bx; rib.pos[(k + 1) * 3 + 1] = by; rib.pos[(k + 1) * 3 + 2] = bz;
    rib.uv[k * 2] = 0; rib.uv[k * 2 + 1] = t;
    rib.uv[(k + 1) * 2] = 1; rib.uv[(k + 1) * 2 + 1] = t;
    const r = lerp(colEnd[0], colStart[0], t), g = lerp(colEnd[1], colStart[1], t), b = lerp(colEnd[2], colStart[2], t);
    const a = t * t * (isSwing ? 0.65 : 0.88);
    rib.col[k * 4] = r; rib.col[k * 4 + 1] = g; rib.col[k * 4 + 2] = b; rib.col[k * 4 + 3] = a;
    rib.col[(k + 1) * 4] = r; rib.col[(k + 1) * 4 + 1] = g; rib.col[(k + 1) * 4 + 2] = b; rib.col[(k + 1) * 4 + 3] = a;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER, rib.bPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, rib.pos.subarray(0, n * 6));
  gl.bindBuffer(gl.ARRAY_BUFFER, rib.bUv);  gl.bufferSubData(gl.ARRAY_BUFFER, 0, rib.uv.subarray(0, n * 4));
  gl.bindBuffer(gl.ARRAY_BUFFER, rib.bCol); gl.bufferSubData(gl.ARRAY_BUFFER, 0, rib.col.subarray(0, n * 8));
}

function setCommonLightUniforms(u, pr) {
  gl.uniform3f(u.uCamPos, cam.ex, cam.ey, cam.ez);
  gl.uniform3fv(u.uSunDir, pr.sunDir);
  gl.uniform3fv(u.uSunCol, pr.sunCol);
  if (u.uSkyCol) gl.uniform3fv(u.uSkyCol, pr.sky);
  if (u.uGroundCol) gl.uniform3fv(u.uGroundCol, pr.ground);
  if (u.uRimCol) gl.uniform3fv(u.uRimCol, pr.rim);
  if (u.uRimPower) gl.uniform1f(u.uRimPower, pr.rimPower);
  if (u.uRimStrength) gl.uniform1f(u.uRimStrength, pr.rimStrength);
  gl.uniform3fv(u.uZenithCol, pr.zenith);
  gl.uniform3fv(u.uHorizonCol, pr.horizon);
  if (u.uFogNear) gl.uniform1f(u.uFogNear, pr.fogNear);
  if (u.uFogFar) gl.uniform1f(u.uFogFar, pr.fogFar);
  if (u.uCloudCover) gl.uniform1f(u.uCloudCover, pr.cloud);
  if (u.uTime) gl.uniform1f(u.uTime, game.now);
  if (u.uShadowOn) gl.uniform1f(u.uShadowOn, 1.0);
  if (u.uShadowBias) gl.uniform3fv(u.uShadowBias, SHADOW_BIAS);
  if (u.uLightVP) gl.uniformMatrix4fv(u.uLightVP, false, mLVP);
  if (u.uShadowMap) { gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fbo.shadowTex); gl.uniform1i(u.uShadowMap, 1); }
  if (u.uPointCount) {
    gl.uniform1i(u.uPointCount, pr.pointCount);
    for (let i = 0; i < 4; i++) {
      flatPoints.set(pr.points[i], i * 4);
      flatPointCols.set(pr.pointCol[i], i * 3);
    }
    gl.uniform4fv(u.uPoints, flatPoints);
    gl.uniform3fv(u.uPointCol, flatPointCols);
  }
}

function drawDynamicProps(prog, pr, isShadow) {
  const t = game.now;
  // 4 swaying palms
  for (let i = 0; i < palmPos.length; i++) {
    const [px, pz, ry] = palmPos[i];
    const sw = Math.sin(t * 1.15 + i * 1.7) * 0.045;
    eulerYXZ(mObj, sw, ry, sw * 0.7, px, 0, pz);
    drawMeshLit(prog, MESH.palm, mObj, WHITE, TEX.white, 0, 0.78, 0.14, 0, 0, 0, isShadow);
  }
  // 4 glowing pier lanterns
  if (!isShadow) {
    const lCol = [1.0, 0.74, 0.34];
    for (const [lx, lz] of [[-8.6, -1.5], [8.6, -1.5], [-8.6, 25.2], [8.6, 25.2]]) {
      eulerYXZ(mObj, 0, 0, 0, lx - Math.sign(lx) * 0.42, 3.04, lz);
      m4Scale(mObj, mObj, 0.13, 0.17, 0.13);
      drawMeshLit(prog, MESH.sphere, mObj, lCol, TEX.white, 0, 0.2, 0.2, 0, pr.lanternGlow, 0, false);
    }
  }
  // Sailboats on the lagoon
  if (!isShadow) {
    for (const bt of boats) {
      const bx = bt.x + Math.sin(t * 0.08 * bt.sp + bt.z) * 14 * bt.dir;
      const bob = Math.sin(t * 1.4 + bt.x) * 0.12, roll = Math.sin(t * 1.1 + bt.z) * 0.07;
      eulerYXZ(mObj, 0, bt.dir > 0 ? Math.PI * 0.42 : -Math.PI * 0.58, roll, bx, -1.42 + bob, bt.z);
      m4Scale(mObj, mObj, bt.s, bt.s, bt.s);
      drawMeshLit(prog, MESH.sailboat, mObj, WHITE, TEX.white, 0, 0.65, 0.22, 0, 0, 0, false);
    }
    // Circling seagulls
    for (const g of gulls) {
      const a = t * g.sp + g.ph, gx = Math.cos(a) * g.r, gz = g.cz + Math.sin(a) * g.r * 0.55;
      const gy = g.h + Math.sin(t * 0.9 + g.ph) * 0.7, yaw = Math.atan2(-Math.sin(a) * g.r, Math.cos(a) * g.r * 0.55);
      const flap = Math.sin(t * 11 + g.ph) * 0.55;
      eulerYXZ(mObj, 0, yaw, 0, gx, gy, gz);
      m4Scale(mObj, mObj, 0.12, 0.08, 0.34);
      drawMeshLit(prog, MESH.sphere, mObj, [0.96, 0.95, 0.92], TEX.white, 0, 0.8, 0.1, 0, 0, 0, false);
      eulerYXZ(mObj, 0, yaw, flap, gx, gy, gz);
      drawMeshLit(prog, MESH.seagullWing, mObj, [0.96, 0.95, 0.92], TEX.white, 0, 0.8, 0.1, 0, 0, 0, false);
      eulerYXZ(mObj, 0, yaw + Math.PI, flap, gx, gy, gz);
      drawMeshLit(prog, MESH.seagullWing, mObj, [0.96, 0.95, 0.92], TEX.white, 0, 0.8, 0.1, 0, 0, 0, false);
    }
  }
  // Training Target Rings
  if (game.mode === "training" && !isShadow) {
    for (const rg of training.rings) {
      if (!rg.active) continue;
      const pulse = 1 + Math.sin(t * 6 + rg.seed) * 0.06;
      eulerYXZ(mObj, 0, Math.sin(t * 1.8 + rg.seed) * 0.18, 0, rg.x, rg.y, rg.z);
      m4Scale(mObj, mObj, rg.r * pulse, rg.r * pulse, rg.r * pulse);
      const col = rg.gold ? [1.0, 0.86, 0.20] : [0.22, 0.94, 0.96];
      drawMeshLit(prog, MESH.torus, mObj, col, TEX.white, 0, 0.2, 0.8, 0, rg.gold ? 2.4 : 1.5, 0, false);
    }
  }
}

function drawCourtRing(x, y, z, radius, col, alpha, inner = 0.72, additive = 0) {
  m4Trans(mObj, x, y, z);
  m4Scale(mObj, mObj, radius, 1, radius);
  const u = PROG.vfx.u;
  gl.uniformMatrix4fv(u.uModel, false, mObj);
  gl.uniform1f(u.uBillboard, 0);
  gl.uniform1f(u.uShape, 1);
  gl.uniform1f(u.uAdditive, additive);
  gl.uniform1f(u.uSoft, 0.09);
  gl.uniform1f(u.uRingInner, inner);
  gl.uniform1f(u.uEmissive, additive ? 2.6 : 1.2);
  gl.bindVertexArray(ringVfx);
  gl.vertexAttrib4f(2, col[0], col[1], col[2], alpha);
  gl.drawArrays(gl.TRIANGLES, 0, 6);
}

function renderFrame() {
  const pr = curPreset;
  const q = QUALITY_TIERS[qualIdx];

  // Camera matrices
  const aspect = fbW / fbH;
  const fov = (aspect < 1 ? 56 : 45) * DEG - cam.zoomPunch * 0.09;
  m4Persp(mProj, fov, aspect, 0.3, 320);
  const shX = (Math.random() - 0.5) * cam.shake * 0.24, shY = (Math.random() - 0.5) * cam.shake * 0.18;
  m4LookAt(mView, cam.ex + shX, cam.ey + shY, cam.ez, cam.tx, cam.ty, cam.tz, 0, 1, 0);
  m4Mul(mVP, mProj, mView);
  m4Invert(mInvVP, mVP);

  // Light VP for shadow map
  const sd = pr.sunDir;
  const upX = 0, upY = Math.abs(sd[1]) > 0.90 ? 0 : 1, upZ = Math.abs(sd[1]) > 0.90 ? -1 : 0;
  m4LookAt(mLView, sd[0] * 50, 1 + sd[1] * 50, 12 + sd[2] * 50, 0, 1, 12, upX, upY, upZ);
  m4Ortho(mLProj, -24, 24, -24, 24, 5, 105);
  m4Mul(mLVP, mLProj, mLView);

  // Ball model matrix (visual radius slightly larger than 4cm for sharp 3D readability)
  const bRad = ball.rocket ? 0.115 : 0.095;
  eulerYXZ(mBall, ball.rotX, ball.rotY, ball.rotZ, ball.x, ball.y, ball.z);
  m4Scale(mBall, mBall, bRad, bRad, bRad);

  const oppStyle = CAST[game.opp];

  // ---- PASS 1: SHADOW MAP ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.shadow);
  gl.viewport(0, 0, fbo.shadowSize, fbo.shadowSize);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.depthFunc(gl.LESS);
  gl.disable(gl.BLEND); gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK);
  gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(1.6, 2.2);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.useProgram(PROG.shadow.p);
  gl.uniformMatrix4fv(PROG.shadow.u.uLightVP, false, mLVP);
  gl.uniform1f(PROG.shadow.u.uTime, game.now);
  gl.uniform1i(PROG.shadow.u.uAlbedo, 0);
  drawMeshLit(PROG.shadow, MESH.pier, mIdent, null, TEX.white, 0, 0, 0, 0, 0, 0, true);
  drawMeshLit(PROG.shadow, MESH.pierDetails, mIdent, null, TEX.white, 0, 0, 0, 0, 0, 0, true);
  drawCharacter(PROG.shadow, 0, YOU_STYLE, true);
  if (game.mode !== "training") drawCharacter(PROG.shadow, 1, oppStyle, true);
  if (ball.visible) drawMeshLit(PROG.shadow, MESH.sphere, mBall, null, TEX.white, 0, 0, 0, 0, 0, 0, true);
  drawDynamicProps(PROG.shadow, pr, true);
  gl.disable(gl.CULL_FACE);
  m4Trans(mObj, 0, 0, NET);
  drawMeshLit(PROG.shadow, MESH.net, mObj, null, TEX.net, 1, 0, 0, 0.45, 0, 0.025, true);
  drawMeshLit(PROG.shadow, MESH.netTape, mObj, null, TEX.white, 0, 0, 0, 0, 0, 0.025, true);
  gl.disable(gl.POLYGON_OFFSET_FILL);

  // ---- PASS 2: SCENE (OPAQUE + CROWD + OCEAN + SKY + VFX) ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.hasMsaa ? fbo.msaa : fbo.scene);
  gl.viewport(0, 0, fbW, fbH);
  gl.enable(gl.DEPTH_TEST); gl.depthMask(true); gl.depthFunc(gl.LEQUAL);
  gl.enable(gl.CULL_FACE); gl.cullFace(gl.BACK); gl.disable(gl.BLEND);
  gl.clearDepth(1.0); gl.clear(gl.DEPTH_BUFFER_BIT);

  // Opaque lit geometry
  gl.useProgram(PROG.lit.p);
  gl.uniformMatrix4fv(PROG.lit.u.uViewProj, false, mVP);
  gl.uniform1i(PROG.lit.u.uAlbedo, 0);
  setCommonLightUniforms(PROG.lit.u, pr);

  drawMeshLit(PROG.lit, MESH.court, mIdent, WHITE, TEX.court, 1, 0.80, 0.16, 0, 0, 0, false);
  drawMeshLit(PROG.lit, MESH.pier, mIdent, WHITE, TEX.pier, 1, 0.72, 0.18, 0, 0, 0, false);
  drawMeshLit(PROG.lit, MESH.pierDetails, mIdent, WHITE, TEX.white, 0, 0.74, 0.18, 0, 0, 0, false);
  drawMeshLit(PROG.lit, MESH.islands, mIdent, WHITE, TEX.white, 0, 0.94, 0.03, 0, 0, 0, false);
  drawDynamicProps(PROG.lit, pr, false);
  drawCharacter(PROG.lit, 0, YOU_STYLE, false);
  if (game.mode !== "training") drawCharacter(PROG.lit, 1, oppStyle, false);
  if (ball.visible) {
    const bEmit = ball.rocket ? 1.8 : ball.crit ? 0.85 : 0.08;
    const bTint = ball.rocket ? [1.0, 0.96, 0.65] : WHITE;
    drawMeshLit(PROG.lit, MESH.sphere, mBall, bTint, TEX.ball, 1, 0.45, 0.32, 0, bEmit, 0, false);
  }
  // Net (double-sided alpha-cutout weave + top tape)
  gl.disable(gl.CULL_FACE);
  m4Trans(mObj, 0, 0, NET);
  drawMeshLit(PROG.lit, MESH.net, mObj, WHITE, TEX.net, 1, 0.90, 0.04, 0.42, 0, 0.025, false);
  drawMeshLit(PROG.lit, MESH.netTape, mObj, WHITE, TEX.white, 0, 0.80, 0.10, 0, 0, 0.025, false);
  gl.enable(gl.CULL_FACE);

  // Instanced cheering spectators (1 draw call for all 72!)
  gl.useProgram(PROG.crowd.p);
  gl.uniformMatrix4fv(PROG.crowd.u.uViewProj, false, mVP);
  gl.uniform1f(PROG.crowd.u.uCheer, crowd.cheer);
  gl.uniform1f(PROG.crowd.u.uHop, crowd.hop);
  setCommonLightUniforms(PROG.crowd.u, pr);
  gl.bindVertexArray(MESH.crowd.vao);
  gl.drawElementsInstanced(gl.TRIANGLES, MESH.crowd.count, gl.UNSIGNED_SHORT, 0, MESH.crowd.instances);

  // Ocean water
  gl.useProgram(PROG.ocean.p);
  gl.uniformMatrix4fv(PROG.ocean.u.uModel, false, mIdent);
  gl.uniformMatrix4fv(PROG.ocean.u.uViewProj, false, mVP);
  setCommonLightUniforms(PROG.ocean.u, pr);
  gl.bindVertexArray(MESH.ocean.vao);
  gl.drawElements(gl.TRIANGLES, MESH.ocean.count, MESH.ocean.type, 0);

  // Sky (fullscreen triangle at z = 1.0, fills untouched pixels only)
  gl.depthMask(false); gl.disable(gl.CULL_FACE);
  gl.useProgram(PROG.sky.p);
  gl.uniformMatrix4fv(PROG.sky.u.uInvViewProj, false, mInvVP);
  gl.uniform3f(PROG.sky.u.uCamPos, cam.ex, cam.ey, cam.ez);
  gl.uniform3fv(PROG.sky.u.uSunDir, pr.sunDir);
  gl.uniform3fv(PROG.sky.u.uZenithCol, pr.zenith);
  gl.uniform3fv(PROG.sky.u.uHorizonCol, pr.horizon);
  gl.uniform3fv(PROG.sky.u.uSunCol, pr.sunCol);
  gl.uniform1f(PROG.sky.u.uCloudCover, pr.cloud);
  gl.uniform1f(PROG.sky.u.uTime, game.now);
  gl.bindVertexArray(emptyVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // ---- VFX PASS (Court marks, timing ring, ball/swing ribbons, particles) ----
  gl.enable(gl.BLEND);
  gl.useProgram(PROG.vfx.p);
  gl.uniformMatrix4fv(PROG.vfx.u.uViewProj, false, mVP);
  gl.uniform3f(PROG.vfx.u.uCamRight, mView[0], mView[4], mView[8]);
  gl.uniform3f(PROG.vfx.u.uCamUp, mView[1], mView[5], mView[9]);

  // Alpha-blended court rings
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  // Bounce marks
  for (let i = 0; i < marks.length; i++) {
    const m = marks[i], k = m.age / 1.5;
    const col = m.out ? [1.0, 0.30, 0.18] : [0.98, 0.96, 0.88];
    drawCourtRing(m.x, 0.025, m.z, 0.18 + k * 0.55, col, (1 - k) * 0.88, 0.72, 0);
  }
  // Diegetic incoming bounce target & player timing ring!
  if (ball.visible && ball.live && ball.lastHitter === 1 && game.phase === "rally") {
    const tPos = you.aimTarget;
    if (tPos && ball.bounceCount === 0 && tPos.z < NET) {
      const pulse = 0.34 + Math.sin(game.now * 14) * 0.05;
      drawCourtRing(tPos.x, 0.024, tPos.z, pulse, [1.0, 0.86, 0.25], 0.72, 0.74, 0);
    }
    const dz = ball.z - you.z, dx = Math.abs(ball.x - you.x);
    if (dz > -1.1 && dz < 3.6 && dx < 2.6) {
      const inSweet = Math.abs(dz - 0.26) < 0.42;
      const rCol = inSweet ? [1.0, 0.90, 0.26] : dz < 1.85 ? [0.35, 0.94, 0.88] : [1.0, 1.0, 1.0];
      const rad = clamp(0.45 + Math.abs(dz - 0.26) * 0.24, 0.45, 1.25);
      drawCourtRing(you.x, 0.026, you.z + 0.25, rad, rCol, inSweet ? 0.92 : 0.42, 0.80, inSweet ? 1 : 0);
    }
  }
  // Serve apex golden flash ring around toss
  if (game.phase === "toss" && ball.visible) {
    const dtA = Math.abs(game.tossT - TOSS_VY / G);
    if (dtA < 0.16) {
      const k = 1 - dtA / 0.16;
      drawCourtRing(ball.x, 0.026, ball.z, 0.25 + k * 0.45, [1.0, 0.90, 0.28], k * 0.85, 0.72, 1);
    }
  }

  // Additive trails & GPU particles
  gl.blendFunc(gl.ONE, gl.ONE);
  if (trail.length >= 2) {
    let c0 = [1.0, 0.92, 0.30], c1 = [1.0, 0.50, 0.12], rw = 0.095, em = 2.4;
    if (ball.rocket) { c0 = [1.0, 0.98, 0.80]; c1 = [0.22, 0.78, 1.0]; rw = 0.17; em = 3.8; }
    else if (ball.shotTag === "slice") { c0 = [0.65, 0.98, 1.0]; c1 = [0.16, 0.56, 0.96]; rw = 0.10; em = 2.6; }
    else if (ball.shotTag === "smash") { c0 = [1.0, 0.95, 0.45]; c1 = [1.0, 0.22, 0.14]; rw = 0.16; em = 3.5; }
    else if (ball.shotTag === "lob") { c0 = [0.62, 1.0, 0.76]; c1 = [0.20, 0.72, 0.65]; rw = 0.085; em = 2.0; }
    else if (ball.crit) { c0 = [1.0, 0.94, 0.42]; c1 = [1.0, 0.32, 0.12]; rw = 0.14; em = 3.2; }
    uploadRibbon(ballRib, trail, rw, c0, c1, false);
    gl.uniformMatrix4fv(PROG.vfx.u.uModel, false, mIdent);
    gl.uniform1f(PROG.vfx.u.uBillboard, 0); gl.uniform1f(PROG.vfx.u.uShape, 0);
    gl.uniform1f(PROG.vfx.u.uAdditive, 1); gl.uniform1f(PROG.vfx.u.uSoft, 0.20); gl.uniform1f(PROG.vfx.u.uEmissive, em);
    gl.bindVertexArray(ballRib.vao);
    gl.drawElements(gl.TRIANGLES, (ballRib.count - 1) * 6, gl.UNSIGNED_SHORT, 0);
  }
  if (you.swingTrail.length >= 2) {
    const sCol = you.swingType === "slice" ? [0.42, 0.92, 1.0] : you.swingType === "smash" || you.swingType === "serve" ? [1.0, 0.88, 0.30] : [1.0, 0.52, 0.25];
    uploadRibbon(swingRib, you.swingTrail, 0.1, sCol, [sCol[0] * 0.4, sCol[1] * 0.4, sCol[2] * 0.4], true);
    gl.uniformMatrix4fv(PROG.vfx.u.uModel, false, mIdent);
    gl.uniform1f(PROG.vfx.u.uBillboard, 0); gl.uniform1f(PROG.vfx.u.uShape, 0);
    gl.uniform1f(PROG.vfx.u.uAdditive, 1); gl.uniform1f(PROG.vfx.u.uSoft, 0.18); gl.uniform1f(PROG.vfx.u.uEmissive, 2.2);
    gl.bindVertexArray(swingRib.vao);
    gl.drawElements(gl.TRIANGLES, (swingRib.count - 1) * 6, gl.UNSIGNED_SHORT, 0);
  }
  if (parts.n > 0) {
    gl.bindBuffer(gl.ARRAY_BUFFER, parts.bPos); gl.bufferSubData(gl.ARRAY_BUFFER, 0, parts.iPos.subarray(0, parts.n * 3));
    gl.bindBuffer(gl.ARRAY_BUFFER, parts.bCol); gl.bufferSubData(gl.ARRAY_BUFFER, 0, parts.iCol.subarray(0, parts.n * 4));
    gl.bindBuffer(gl.ARRAY_BUFFER, parts.bExt); gl.bufferSubData(gl.ARRAY_BUFFER, 0, parts.iExt.subarray(0, parts.n * 2));
    gl.uniform1f(PROG.vfx.u.uBillboard, 1); gl.uniform1f(PROG.vfx.u.uShape, 2);
    gl.uniform1f(PROG.vfx.u.uAdditive, 1); gl.uniform1f(PROG.vfx.u.uSoft, 0.14); gl.uniform1f(PROG.vfx.u.uEmissive, 1.0);
    gl.bindVertexArray(parts.vao);
    gl.drawArraysInstanced(gl.TRIANGLES, 0, 6, parts.n);
  }

  // Resolve MSAA -> single-sample scene texture
  if (fbo.hasMsaa) {
    gl.bindFramebuffer(gl.READ_FRAMEBUFFER, fbo.msaa);
    gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER, fbo.scene);
    gl.blitFramebuffer(0, 0, fbW, fbH, 0, 0, fbW, fbH, gl.COLOR_BUFFER_BIT, gl.NEAREST);
  }

  // ---- PASS 3: BLOOM EXTRACT ----
  gl.disable(gl.DEPTH_TEST); gl.disable(gl.BLEND); gl.depthMask(false);
  if (q.bloom) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo.bloom);
    gl.viewport(0, 0, fbo.bw, fbo.bh);
    gl.useProgram(PROG.extract.p);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbo.sceneTex);
    gl.uniform1i(PROG.extract.u.uScene, 0);
    gl.uniform1f(PROG.extract.u.uThreshold, pr.bloom.threshold);
    gl.uniform1f(PROG.extract.u.uKnee, pr.bloom.knee);
    gl.bindVertexArray(emptyVao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // ---- PASS 4: ACES FILMIC COMPOSITE ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, fbW, fbH);
  gl.useProgram(PROG.post.p);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fbo.sceneTex); gl.uniform1i(PROG.post.u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fbo.bloomTex); gl.uniform1i(PROG.post.u.uBloom, 1);
  // Project sun position to screen UV for subtle lens flare
  const sx = cam.ex + sd[0] * 100, sy = cam.ey + sd[1] * 100, sz = cam.ez + sd[2] * 100;
  const cx = mVP[0]*sx + mVP[4]*sy + mVP[8]*sz + mVP[12];
  const cy = mVP[1]*sx + mVP[5]*sy + mVP[9]*sz + mVP[13];
  const cw = mVP[3]*sx + mVP[7]*sy + mVP[11]*sz + mVP[15];

function initAudio() {

      sfxNodes.ambGain.connect(sfxNodes.master);

      const sr = AC.sampleRate, len = sr * 2;
      const bw = AC.createBuffer(1, len, sr), bp = AC.createBuffer(1, len, sr), bb = AC.createBuffer(1, len, sr);
      const dw = bw.getChannelData(0), dp = bp.getChannelData(0), db = bb.getChannelData(0);

        dp[i] = b0 + b1 + b2 + w*0.1848; mp = Math.max(mp, Math.abs(dp[i]));

// 11. 240Hz MAGNUS PHYSICS, NET CORD, TRAJECTORY & ROCKET SERVE SOLVER

function cordY(x) { return NETH + (POST_H - NETH) * Math.pow(Math.min(Math.abs(x), POST_X) / POST_X, 2); }

function physStep(b, dt, simOnly = false) {
  const px = b.x, py = b.y, pz = b.z;
  let ax = 0, ay = -G, az = 0;

    const v = Math.hypot(b.vx, b.vy, b.vz), drag = -DRAG_K * v, w = b.w;
    ax = drag * b.vx + MAGNUS_K * (w.y * b.vz - w.z * b.vy);
    ay = -G + drag * b.vy + MAGNUS_K * (w.z * b.vx - w.x * b.vz);
    az = drag * b.vz + MAGNUS_K * (w.x * b.vy - w.y * b.vx);
    const dec = 1 - SPIN_DECAY * dt;
    w.x *= dec; w.y *= dec; w.z *= dec; b.spin = w.x;
  }
  b.vx += ax * dt; b.vy += ay * dt; b.vz += az * dt;
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
  if (!simOnly) {
    b.rotX += (b.w.x * 0.06 + b.vz * 0.4) * dt;
    b.rotY += (b.w.y * 0.06) * dt;
    b.rotZ += (b.w.z * 0.06 - b.vx * 0.4) * dt;
  }

  let ev = null;
  // Net crossing
  if (!b.netted && pz !== b.z && (pz - NET) * (b.z - NET) <= 0) {
    const u = (NET - pz) / (b.z - pz);
    const cx = px + (b.x - px) * u, cy = py + (b.y - py) * u;
    if (Math.abs(cx) <= POST_X + R) {
      const gap = cy - cordY(cx);
      if (gap <= R + 0.08) {
        const dir = Math.sign(b.vz) || 1;
        if (!simOnly) { netHit[0] = cx; netHit[1] = clamp(cy, 0.1, 1.0); netHit[2] = clamp(Math.hypot(b.vx, b.vz) * 0.012, 0.08, 0.26); netHit[3] = 0; }

          b.vy += 0.55; b.vz *= 0.84; b.netted = true; b.touched = "cord"; ev = "net";
        } else if (gap > -R * 0.55 && b.vy < 1.8) {
          // Dramatic net-cord dribble over!
          b.x = cx; b.z = NET + dir * 0.08; b.y = cordY(cx) + R + 0.025;
          b.vz = dir * (simOnly ? 1.1 : rand(0.8, 1.65)); b.vy = simOnly ? 0.5 : rand(0.35, 0.85);
          b.vx *= 0.25; b.w.x *= 0.1; b.w.y *= 0.1; b.w.z *= 0.1;
          b.netted = true; b.touched = "cord"; ev = "net";
        } else {
          // Into the mesh
          b.x = cx; b.z = NET - dir * 0.06;

}

function solveFlight(bx, by, bz, tx, tz, T, w0) {
  let vx = (tx - bx) / T, vz = (tz - bz) / T, vy = (R - by + 0.5 * G * T * T) / T;
  const steps = Math.max(24, Math.min(90, Math.round(T * 60))), dt = T / steps;
  let minGap = 99;
  for (let it = 0; it < 5; it++) {
    let x = bx, y = by, z = bz, cvx = vx, cvy = vy, cvz = vz, wx = w0.x, wy = w0.y, wz = w0.z;
    minGap = 99;
    for (let s = 0; s < steps; s++) {
      const pz = z, v = Math.hypot(cvx, cvy, cvz), dg = -DRAG_K * v;
      cvx += (dg * cvx + MAGNUS_K * (wy * cvz - wz * cvy)) * dt;
      cvy += (-G + dg * cvy + MAGNUS_K * (wz * cvx - wx * cvz)) * dt;
      cvz += (dg * cvz + MAGNUS_K * (wx * cvy - wy * cvx)) * dt;
      x += cvx * dt; y += cvy * dt; z += cvz * dt;
      const dec = 1 - SPIN_DECAY * dt; wx *= dec; wy *= dec; wz *= dec;

        const u = (NET - pz) / (z - pz), nx = x - cvx * dt * (1 - u), ny = y - cvy * dt * (1 - u);
        minGap = ny - cordY(nx);

function launchShot(tx, tz, spec) {

  let sol = null;
  if (spec.T) {
    let T = spec.T;
    for (let k = 0; k < 6; k++) {
      sol = solveFlight(ball.x, ball.y, ball.z, tx, tz, T, w0);
      if (sol.gap >= (spec.clear ?? 0.2)) break;
      T *= 1.07;
    }
  } else {
    let lo = 0.34, hi = 1.60;
    for (let k = 0; k < 8; k++) {
      const T = (lo + hi) * 0.5;
      sol = solveFlight(ball.x, ball.y, ball.z, tx, tz, T, w0);
      const mph = Math.hypot(sol.vx, sol.vy, sol.vz) * MPH;
      if (sol.gap < (spec.clear ?? 0.2)) lo = T;
      else if (mph > spec.mph) lo = T; else hi = T;

    netted: false, touched: null, bounceCount: 0, visible: true, live: true, tossing: false,
    rocket: !!spec.rocket, crit: !!spec.crit, shotTag: spec.tag || "drive",
    mph: Math.hypot(sol.vx, sol.vy, sol.vz) * MPH

}

function predictBall(near, forVolley = false) {
  const s = { ...ball, w: { ...ball.w } };
  let bounces = 0, firstBounce = null;
  const h = 1 / 120;
  for (let i = 0; i < 600; i++) {
    const ev = physStep(s, h, true);
    if (ev === "bounce" && ((s.z < NET) === near)) {
      bounces++;
      if (!firstBounce) firstBounce = { x: s.x, z: s.z };
    }
    if (near && forVolley && bounces === 0 && s.z <= you.homeZ + 0.4 && s.z > 0 && s.y >= 0.45 && s.y <= 2.15) {
      return { x: s.x, z: s.z, bx: s.x, bz: s.z, volley: true };
    }
    if (near) {
      if (bounces >= 1 && ((s.vy < 0 && s.y < 1.30) || s.z < -1.5)) return { x: s.x, z: s.z, bx: firstBounce.x, bz: firstBounce.z };
      if (bounces === 0 && s.z < -2.6) return { x: s.x, z: -1.5, bx: s.x, bz: -1.2 };
    } else {
      if (bounces >= 1 && ((s.vy < 0 && s.y < 1.30) || s.z > L + 1.5)) return { x: s.x, z: s.z, bx: firstBounce.x, bz: firstBounce.z };

}

  curPreset = PRESETS[key] || PRESETS.golden;
  $("skyLbl").textContent = "Sky: " + (skyOverride === "auto" ? "Auto" : curPreset.label.split(" ")[0]);
}

function setupPoint() {
  const d = deuceSide(), o = CAST[game.opp];
  Object.assign(ball, { visible: false, live: false, serve: false, netted: false, touched: null, tossing: false, lastHitter: -1, bounceCount: 0, rocket: false, crit: false });
  trail.length = 0; game.rally = 0; game.strokes = 0; game.lobArmed = false;
  cpu.speed = o.speed; cpu.pending = null; cpu.recover = 0;
  you.homeX = 0; you.homeZ = -0.8; you.aimTarget = null;
  if (game.server === 0) {
    placePlayer(you, d ? 0.75 : -0.75, -0.4); placePlayer(cpu, d ? -2.3 : 2.3, L + 0.8);
    game.phase = "serveReady";
  } else {
    placePlayer(cpu, d ? -0.75 : 0.75, L + 0.4); placePlayer(you, d ? 2.2 : -2.2, -0.85);
    game.phase = "cpuServe"; game.timer = 1.35; game.tossed = false;
  }
  updateHUD(); setHint(); updateTelemetry(0, false);
}

function callScore() {
  const [a, b] = game.pts, N = ["Love", "15", "30", "40"];
  if (a >= 3 && b >= 3) return a === b ? "Deuce" : "Advantage " + (a > b ? "You" : CAST[game.opp].name);
  const s = game.server, ps = game.pts[s], pr = game.pts[1 - s];
  return ps === pr ? N[ps] + " all" : N[ps] + "–" + N[pr];
}

function pointTo(w, reason) {
  ball.live = false; game.faults = 0;
  const o = CAST[game.opp];
  if (w === 0 && game.strokes === 1 && game.server === 0) { reason = "ACE!"; game.stats.aces++; career.aces++; }
  else if (w === 0 && ball.touched === "cord") reason = "Net cord!";
  if (w === 0 && (reason === "Winner!" || reason === "ACE!" || reason === "Net cord!")) game.stats.winners++;

  game.pts[w]++;
  const a = game.pts[w], b = game.pts[1 - w];
  let sub, isGame = false, isMatch = false;
  if (a >= 4 && a - b >= 2) {
    isGame = true;
    game.games[w]++; game.pts = [0, 0]; game.server = 1 - game.server;
    sub = w === 0 ? "Game, You!" : `Game, ${o.name}`;
    if (game.games[w] >= 3) {
      isMatch = true; game.winner = w;
      sub = w === 0 ? "Game, Set & Match!" : `${o.name} takes the match`;
      const delta = skillDelta(w === 0, o, { gamesFor: game.games[0], gamesAgainst: game.games[1], aces: game.stats.aces, streakBefore: career.streak });
      game.lastSkillDelta = delta;
      career.skill = clamp(career.skill + delta, 0, 2000);
      if (w === 0) { career.wins++; career.streak++; career.bestStreak = Math.max(career.bestStreak, career.streak); career.crowns[o.id] = true; }
      else { career.losses++; career.streak = 0; }
      saveCareer();
      game.slowMo = 0.75;
    }
  } else sub = callScore();

  if (w === 0) {
    you.emote = "win"; you.emoteT = 1.4; cpu.emote = "lose"; cpu.emoteT = 1.4;
    crowd.cheer = isMatch || isGame || reason === "ACE!" ? 1.0 : 0.55; crowd.hop = 0;
    wiiRumblePattern(isGame ? [85, 55, 85] : [65]);
    if (isMatch) burstConfetti(you.x, 1.5, you.z + 2, 95);
    else if (isGame || reason === "ACE!") burstConfetti(you.x, 1.8, you.z + 1.5, 45);
  } else {
    cpu.emote = "win"; cpu.emoteT = 1.4; you.emote = "lose"; you.emoteT = 1.4;
    crowd.cheer = 0.25;
  }

  showMsg(reason, sub, isMatch ? 2400 : 1750);
  sfx.point(w === 0, isGame, isMatch);
  game.phase = "pointOver"; game.timer = isMatch ? 2.5 : 1.85;
  updateHUD(); setHint();
}

function fault() {
  game.faults++; ball.live = false;
  if (game.faults >= 2) { pointTo(1 - game.server, "Double fault"); return; }
  showMsg("Fault", "Second serve", 1150);
  sfx.crowdGasp();
  game.phase = "between"; game.timer = 1.25; setHint();
}

function onBounce() {
  const b = ball;
  sfx.bounce(Math.hypot(b.vx, b.vy, b.vz), b.x);
  burstDust(b.x, b.z, 8, [0.96, 0.94, 0.84]);
  if (!b.live) return;
  if (game.mode === "training") {
    b.bounceCount++;
    if (b.lastHitter === 1 && b.bounceCount >= 2) {
      training.combo = 0; b.live = false; updateTrainHUD();
      feedback("Missed ball", "combo reset");
    }
    if (b.lastHitter === 0 && b.bounceCount >= 1) {
      marks.push({ x: b.x, z: b.z, out: !inCourt(b.x, b.z, false), age: 0 });
      b.live = false;
    }
    return;
  }
  const near = b.z < NET, hitter = b.lastHitter, recv = 1 - hitter, recvNear = recv === 0;
  if (b.serve) {
    const ok = serveIn(b.x, b.z);
    if (b.netted && ok) {
      marks.push({ x: b.x, z: b.z, out: false, age: 0 }); b.live = false;
      showMsg("Let", "Take that serve again", 1100); sfx.crowdGasp();
      game.phase = "between"; game.timer = 1.2; return;
    }
    marks.push({ x: b.x, z: b.z, out: !ok, age: 0 });
    if (!ok) { fault(); return; }
    b.serve = false; b.bounceCount = 1; return;
  }
  if (near !== recvNear) { marks.push({ x: b.x, z: b.z, out: true, age: 0 }); pointTo(recv, b.netted ? "Into the net" : "Fell short"); return; }
  b.bounceCount++;
  if (b.bounceCount === 1) {
    const ok = inCourt(b.x, b.z, near);
    marks.push({ x: b.x, z: b.z, out: !ok, age: 0 });
    if (!ok) pointTo(recv, "Out!");
  } else {
    pointTo(hitter, hitter === 0 ? "Winner!" : "Too quick");
  }
}
