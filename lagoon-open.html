function triggerImpactJuice(isCrit, isRocket, col) {
  if (isRocket) { game.hitstop = 0.055; cam.shake = 0.95; cam.zoomPunch = 1.0; burstSparks(ball.x, ball.y, ball.z, [1.0, 0.94, 0.55], 38, 7.5, 0.11, 3.8); }
  else if (isCrit) { game.hitstop = 0.038; cam.shake = 0.50; cam.zoomPunch = 0.55; burstSparks(ball.x, ball.y, ball.z, col, 26, 6.0, 0.09, 3.2); }
  else { cam.shake = Math.max(cam.shake, 0.16); burstSparks(ball.x, ball.y, ball.z, col, 12, 3.8, 0.07, 2.2); }
}

function humanSwing(power, intent = "drive") {
  initAudio();
  if (game.paused || game.now - game.lastSwing < 0.28) return;
  const ph = game.phase;
  if (ph === "title" || ph === "matchOver" || ph === "trainOver") return;
  game.lastSwing = game.now;

  if (ph === "serveReady") {
    Object.assign(ball, { x: you.x + 0.20, y: 1.55, z: you.z + 0.35, vx: 0, vy: TOSS_VY, vz: 0, w: { x: 0, y: 0, z: 0 }, spin: 0,
      visible: true, live: false, tossing: true, netted: false, rocket: false, crit: false });
    you.tossArm = 1.0; game.phase = "toss"; game.tossT = 0; setHint(); return;
  }
  if (ph === "toss") { serveHit(power, intent); return; }
  if (ph !== "rally" && ph !== "training") return;

  const b = ball;
  const useLob = (intent === "lob" || (game.lobArmed && intent !== "slice"));
  game.lobArmed = false; updateTelemetry();
  if (!b.live || b.lastHitter !== 1 || (b.serve && b.bounceCount === 0 && b.z > NET)) {
    you.swingT = you.swingDur = 0.32; you.swingType = "fh";
    feedback("Swing", "wait for the ball"); return;
  }

  const dz = b.z - you.z, dx = b.x - you.x;
  const isSmash = b.y >= 2.0 && b.z > NET - 4.2 && Math.abs(dx) < 2.25 && dz <= WIN.smash.early && dz >= WIN.smash.late;
  const isVolley = !isSmash && b.bounceCount === 0 && you.z > NET - SVC - 0.6 && dz <= WIN.volley.early && dz >= WIN.volley.late && b.y >= WIN.volley.yLo && b.y <= WIN.volley.yHi;
  const shotKey = isSmash ? "smash" : isVolley ? "volley" : useLob ? "lob" : intent === "slice" ? "slice" : "drive";
  const win = isSmash ? WIN.smash : isVolley ? WIN.volley : useLob ? WIN.lob : WIN.ground;
  const volleyOk = b.bounceCount >= 1 || isVolley || isSmash || b.z > 4.2;

  if (b.z > NET - 0.25 || dz > win.early || dz < win.late || Math.abs(dx) > win.x || b.y > win.yHi || !volleyOk) {
    you.swingT = you.swingDur = 0.32; you.swingType = dx >= 0 ? "fh" : "bh";
    if (b.vz < 0 && dz > win.early && dz < 9.5) feedback("Too early", "let it come to you");
    else if (dz < win.late) feedback("Too late", "swing sooner");
    return;
  }

  const span = dz >= win.sweet ? (win.early - win.sweet) : (win.sweet - win.late);
  const tau = clamp((dz - win.sweet) / span, -1, 1); // +1 early cross, 0 sweet, -1 late line
  const side = Math.sign(dx) || 1;
  const oppX = game.mode === "training" ? 0 : cpu.x;
  const open = -Math.sign(oppX || side);
  const bias = clamp(0.55 * open + 0.35 * nudge.x, -1, 1);
  const steered = -side * tau * (0.38 + 0.62 * Math.abs(tau));
  const aim = clamp(steered + bias * (1 - Math.abs(tau)), -1, 1);
  const sh = SHOT[shotKey];
  const depth = tau > 0 ? lerp(sh.depthSweet, sh.depthEarly, tau) : lerp(sh.depthSweet, sh.depthLate, -tau);
  const miss = 0.06 + 0.16 * Math.abs(tau) * (1.05 - 0.28 * power);
  const tx = aim * (HW - 0.26) + rand(-miss, miss);
  const tz = NET + depth + rand(-miss, miss);

  const cross = clamp(tau, 0, 1), line = clamp(-tau, 0, 1), mid = 1 - cross - line;
  const wantMph = sh.T ? 0 : (sh.mphSweet * mid + sh.mphCross * cross + sh.mphLine * line) * (0.78 + 0.22 * power);
  const isCrit = isSmash || (Math.abs(tau) < 0.26 && power >= 0.65);

  const fore = dx <= 0; // screen-right (-X) is right-handed forehand!
  you.swingDur = isSmash ? 0.44 : shotKey === "slice" ? 0.36 : 0.38;
  you.swingT = you.swingDur;
  you.swingType = isSmash ? "smash" : shotKey === "slice" ? "slice" : fore ? "fh" : "bh";
  if (Math.abs(dx) > 1.35) { you.lungeT = 0.32; you.lungeDir = -side; }

  const mph = launchShot(tx, tz, {
    mph: wantMph, T: sh.T, top: sh.top * (0.75 + 0.35 * power), side: sh.side * aim, clear: sh.clear,
    crit: isCrit, tag: shotKey
  });
  b.lastHitter = 0; b.serve = false;
  game.rally++; game.strokes++;
  if (game.rally > game.stats.longestRally) game.stats.longestRally = game.rally;
  if (game.rally > career.longestRally) { career.longestRally = game.rally; saveCareer(); }
  if (game.rally >= 7 && game.rally % 4 === 3) { sfx.crowdGasp(); crowd.cheer = Math.max(crowd.cheer, 0.35); }

  sfx.hit(power, isSmash ? "smash" : shotKey, b.x);
  wiiRumble(isSmash ? 125 : isCrit ? 75 : shotKey === "volley" ? 32 : 55);
  const sparkCol = shotKey === "slice" ? [0.45, 0.96, 1.0] : isSmash ? [1.0, 0.86, 0.28] : [1.0, 0.68, 0.24];
  triggerImpactJuice(isCrit, false, sparkCol);

  const label = isSmash ? "SMASH!" : isVolley ? "VOLLEY!" : useLob ? "LOB!" : Math.abs(tau) < 0.26 ? (isCrit ? "PERFECT!" : "Clean") : tau > 0 ? "Early · Cross" : "Late · Line";
  const detail = `${Math.round(mph)} MPH · ${shotKey === "slice" ? "slice" : shotKey === "lob" ? "high arc" : fore ? "forehand" : "backhand"}`;
  feedback(label, detail, isCrit || isSmash);
  updateTelemetry(mph, false);

  if (game.mode === "match") {
    cpu.splitT = 0.24;
    cpu.pending = predictBall(false);
    cpu.react = CAST[game.opp].react;
    if (Math.abs(tx) > 3.2) cpu.recover = 0.34;
  }
}

function serveHit(power, intent) {
  const dtA = Math.abs(game.tossT - TOSS_VY / G);
  const isRocket = dtA <= 0.075 && power >= 0.56 && intent !== "slice";
  const isSlice = intent === "slice";
  const tq = isRocket ? 1 : clamp(1 - Math.max(0, dtA - 0.075) / 0.32, 0, 1);
  const targetMph = isRocket ? (126 + 8 * (1 - dtA / 0.075) + 4 * clamp((power - 0.56) / 0.44, 0, 1))
    : dtA > 0.36 ? (64 + 14 * power)
    : (78 + 34 * tq * (0.55 + 0.45 * power));

  const s = boxSign(), e = 1 - tq;
  const tx = s * rand(0.75, 3.25) + e * rand(-1, 1) * 2.1;
  const tz = NET + SVC * (0.48 + 0.42 * power) + e * rand(-1, 1.15) * 2.6;

  you.swingDur = 0.42; you.swingT = 0.42; you.swingType = "serve";
  const mph = launchShot(tx, tz, {
    mph: targetMph, top: isSlice ? -85 : isRocket ? 115 : 80, side: isSlice ? -210 * s : 55 * s,
    clear: isRocket ? 0.14 : 0.20, rocket: isRocket, crit: isRocket || tq > 0.82, tag: isSlice ? "slice" : "drive"
  });
  Object.assign(ball, { serve: true, lastHitter: 0 });
  game.phase = "rally"; game.strokes = 1; game.rally = 1; setHint();

  const rMph = Math.round(mph);
  if (rMph > game.stats.fastestServe) game.stats.fastestServe = rMph;
  if (rMph > career.fastestServe) { career.fastestServe = rMph; saveCareer(); }

  sfx.hit(isRocket ? 1.0 : power, isRocket ? "rocket" : isSlice ? "slice" : "drive", ball.x);
  wiiRumble(isRocket ? 130 : 70);
  triggerImpactJuice(tq > 0.8, isRocket, isRocket ? [1.0, 0.96, 0.65] : [1.0, 0.80, 0.30]);
  feedback(isRocket ? "ROCKET SERVE!" : tq > 0.78 ? "Clean Serve" : tq > 0.42 ? "Off the toss" : "Mistimed", `${rMph} MPH${isSlice ? " · slice" : ""}`, isRocket);
  updateTelemetry(mph, isRocket);

  cpu.splitT = 0.24;
  cpu.pending = predictBall(false);
  cpu.react = isRocket ? CAST[game.opp].react * 1.15 : 0.14;
}

function cpuServe() {
  const o = CAST[game.opp], s = boxSign();
  let tx = s * rand(0.7, 3.45), tz = NET - rand(3.5, 6.0);
  if (Math.random() < o.err * 0.7) { if (Math.random() < 0.6) tz = NET - rand(6.6, 7.6); else tx = s * rand(4.3, 5.0); }
  cpu.swingDur = 0.40; cpu.swingT = 0.40; cpu.swingType = "serve";
  const mph = launchShot(tx, tz, { mph: [80, 95, 106][o.tier], top: 75, side: 40 * s, clear: 0.20, tag: "drive" });
  Object.assign(ball, { serve: true, lastHitter: 1 });
  game.phase = "rally"; game.strokes = 1; game.rally = 1; setHint();
  sfx.hit(0.75, "drive", ball.x);
  updateTelemetry(mph, false);
  you.splitT = 0.24;
  aimYou();
}

function aimYou() {
  const tryVolley = you.homeZ > NET - SVC - 0.5;
  const t = predictBall(true, tryVolley);
  you.aimTarget = { x: t.bx, z: t.bz };
  const autoX = clamp(t.x - 0.50, -6.2, 6.2);
  const autoZ = clamp(t.z, -1.65, NET - 1.1);
  you.tx = lerp(you.homeX, autoX, 0.82);
  you.tz = lerp(you.homeZ, autoZ, 0.82);
}

function cpuTry() {
  const b = ball;
  if (game.mode !== "match" || !b.live || b.lastHitter !== 0) return;
  const o = CAST[game.opp];
  const atNet = cpu.z < NET + 5.2 && b.bounceCount === 0 && b.z > NET + 0.4 && b.y < 2.25;
  if (!atNet && (b.serve || b.bounceCount !== 1)) return;
  const effReach = cpu.recover > 0 && Math.abs(b.x - cpu.x) > 1.2 ? o.reach * 0.58 : o.reach;
  if (Math.abs(b.x - cpu.x) < effReach && Math.abs(b.z - cpu.z) < 0.72 && b.y < 2.65) {
    let tx, tz, tag = "drive", top = o.top, T = rand(o.t[0], o.t[1]), clear = 0.26;
    if (o.id === "sunny") {
      tx = you.x * 0.62 + rand(-1.4, 1.4);
      tz = Math.random() < o.short ? rand(5.4, 7.6) : rand(1.4, 5.2);
    } else if (o.id === "reef") {
      if (you.z > NET - 4.4 && Math.random() < 0.42) { tag = "lob"; T = 1.62; clear = 2.85; top = 40; tx = rand(-3.0, 3.0); tz = rand(0.9, 2.8); }
      else if (Math.random() < 0.36) { tag = "slice"; top = -155; clear = 0.22; tx = -Math.sign(you.x || 1) * rand(2.0, 3.7); tz = rand(3.2, 6.5); }
      else { tx = -Math.sign(you.x || 1) * rand(2.1, 3.75); tz = rand(1.2, 5.4); }
    } else {
      // Mako — aggressive net-rusher & heavy topspin striker
      if (atNet) { tag = "volley"; T = rand(0.58, 0.78); top = 30; tx = -Math.sign(you.x || 1) * rand(2.4, 3.85); tz = rand(3.5, 7.2); }
      else if (you.z > NET - 4.2 && Math.random() < 0.32) { tag = "lob"; T = 1.56; clear = 2.9; top = 50; tx = rand(-3.1, 3.1); tz = rand(0.8, 2.5); }
      else { tx = -Math.sign(you.x || 1) * rand(2.2, 3.85); tz = rand(0.9, 4.6); }
    }
    if (Math.random() < o.err) {
      if (Math.random() < 0.45) tz = rand(-1.6, -0.35);
      else if (Math.random() < 0.75) tx = (Math.random() < 0.5 ? -1 : 1) * rand(4.35, 5.15);
      else clear = 0; // authentic net error
    }
    cpu.swingDur = 0.36; cpu.swingT = 0.36;
    cpu.swingType = tag === "slice" ? "slice" : (b.x - cpu.x <= 0 ? "fh" : "bh");
    const mph = launchShot(tx, tz, { T, top, side: rand(-120, 120), clear, tag });
    b.lastHitter = 1; game.rally++; game.strokes++;
    sfx.hit(0.68, tag, b.x);
    updateTelemetry(mph, false);
    you.splitT = 0.24;
    aimYou();
    cpu.tx = 0; cpu.tz = o.rush > 0.5 && Math.random() < 0.4 ? NET + 3.4 : L + 0.75;
    cpu.pending = null;
  }
}

// Target Rings Training Mode
function spawnRing(slot) {
  training.spawned++;
  const gold = training.spawned % 5 === 0;
  const spots = [
    [-3.4, 1.05, L - 1.3], [3.4, 1.05, L - 1.3],
    [-2.1, 1.0, NET + 4.0], [2.1, 1.0, NET + 4.0],
    [0.0, 1.25, L - 2.6]
  ];
  const sp = spots[(training.spawned + slot) % spots.length];
  training.rings[slot] = {
    active: true, gold, baseX: sp[0], x: sp[0], y: sp[1], z: sp[2],
    r: gold ? 0.55 : 0.78, seed: Math.random() * 10
  };
}
function startTraining() {
  initAudio();
  game.mode = "training"; game.phase = "training"; game.paused = false;
  Object.assign(training, { score: 0, combo: 0, comboT: 0, time: 60, feedT: 0.9, rings: [], spawned: 0 });
  for (let i = 0; i < 3; i++) spawnRing(i);
  placePlayer(you, 0, -0.4); you.homeX = 0; you.homeZ = -0.5;
  ball.visible = false; ball.live = false; trail.length = 0;
  $("overlay").hidden = true; $("score").hidden = true; $("trainHud").hidden = false;
  snapGameplayCam();
  updateTrainHUD(); setHint();
  showMsg("Target Rings!", "Hit glowing targets · 60 seconds", 1600);
}
function feedTrainingBall() {
  Object.assign(ball, { x: rand(-1.0, 1.0), y: 1.35, z: L - 0.4, visible: true, live: true, serve: false, lastHitter: 1 });
  const tx = rand(-2.5, 2.5), tz = rand(0.4, 3.2);
  launchShot(tx, tz, { T: 1.15, top: 65, side: 0, clear: 0.35, tag: "drive" });
  sfx.hit(0.45, "drive", ball.x);
  aimYou();
}
function checkRingHit(px, py, pz) {
  if (game.mode !== "training" || !ball.live || ball.lastHitter !== 0) return;
  for (let i = 0; i < training.rings.length; i++) {
    const rg = training.rings[i];
    if (!rg.active) continue;
    if ((pz - rg.z) * (ball.z - rg.z) <= 0 && ball.z !== pz) {
      const u = (rg.z - pz) / (ball.z - pz);
      const hx = px + (ball.x - px) * u, hy = py + (ball.y - py) * u;
      if (Math.hypot(hx - rg.x, hy - rg.y) <= rg.r + 0.25) {
        training.combo++; training.comboT = 3.2;
        const mul = Math.min(5, 1 + 0.25 * (training.combo - 1));
        const pts = Math.round((rg.gold ? 250 : 100) * mul);
        training.score += pts;
        training.time = Math.min(60, training.time + (rg.gold ? 1.2 : 0.5));
        burstSparks(rg.x, rg.y, rg.z, rg.gold ? [1.0, 0.88, 0.22] : [0.22, 0.96, 0.98], 34, 6.5, 0.10, 3.6);
        sfx.ring(training.combo, rg.gold);
        wiiRumble(rg.gold ? 95 : 42);
        crowd.cheer = Math.min(1, crowd.cheer + 0.35); crowd.hop = 0;
        feedback(rg.gold ? `GOLD TARGET! +${pts}` : `TARGET! +${pts}`, `×${mul.toFixed(2)} combo`, rg.gold);
        spawnRing(i);
        updateTrainHUD();
      }
    }
  }
}

const nudge = { x: 0, z: 0 };
const keys = new Set();

function movePlayer(p, dt) {
  p.prevVx = p.vx; p.prevVz = p.vz;
  const dx = p.tx - p.x, dz = p.tz - p.z, d = Math.hypot(dx, dz);
  const step = Math.min(d, p.speed * dt);
  if (d > 0.01) { p.vx = (dx / d) * (step / Math.max(dt, 1e-4)); p.vz = (dz / d) * (step / Math.max(dt, 1e-4)); p.x += (dx / d) * step; p.z += (dz / d) * step; }
  else { p.vx *= 0.8; p.vz *= 0.8; }
  // Court sneaker squeak on hard cut
  p.squeakCd = Math.max(0, p.squeakCd - dt);
  const sp = Math.hypot(p.vx, p.vz), psp = Math.hypot(p.prevVx, p.prevVz);
  if (p.squeakCd <= 0 && sp > 2.4 && psp > 2.4) {
    const dot = (p.vx * p.prevVx + p.vz * p.prevVz) / (sp * psp);
    if (dot < 0.25) { sfx.squeak(p.x); burstDust(p.x, p.z, 5); p.squeakCd = 0.45; }
  }
}

function updateNudge(dt) {
  let nx = 0, nz = 0;
  // Looking from -Z toward +Z: screen-left is +X, screen-right is -X
  if (keys.has("KeyA") || keys.has("ArrowLeft") || wii.dpL) nx += 1;
  if (keys.has("KeyD") || keys.has("ArrowRight") || wii.dpR) nx -= 1;
  if (keys.has("KeyW") || keys.has("ArrowUp") || wii.dpU) nz += 1;
  if (keys.has("KeyS") || keys.has("ArrowDown") || wii.dpD) nz -= 1;
  nudge.x = lerp(nudge.x, nx, clamp(dt * 12, 0, 1));
  nudge.z = lerp(nudge.z, nz, clamp(dt * 12, 0, 1));
  if (game.phase === "rally" || game.phase === "training") {
    you.homeX = clamp(you.homeX + nudge.x * 2.6 * dt, -5.2, 5.2);
    you.homeZ = clamp(you.homeZ + nudge.z * 2.8 * dt, -1.45, NET - 1.2);
    if (!ball.live || ball.lastHitter !== 1) {
      you.tx = lerp(you.tx, you.homeX, clamp(dt * 4, 0, 1));
      you.tz = lerp(you.tz, you.homeZ, clamp(dt * 4, 0, 1));
    }
  }
}

function updateCamera(dt) {
  cam.shake = Math.max(0, cam.shake - dt * 3.4);
  cam.zoomPunch = Math.max(0, cam.zoomPunch - dt * 2.4);
  const ph = game.phase;
  if (ph === "title" || ph === "matchOver" || ph === "trainOver") {
    cam.orbitA += dt * 0.14;
    const tx = Math.sin(cam.orbitA) * 14.5, tz = NET - Math.cos(cam.orbitA) * 21.5;
    cam.ex = lerp(cam.ex, tx, clamp(dt * 2, 0, 1));
    cam.ey = lerp(cam.ey, 6.2 + Math.sin(cam.orbitA * 1.5) * 0.8, clamp(dt * 2, 0, 1));
    cam.ez = lerp(cam.ez, tz, clamp(dt * 2, 0, 1));
    cam.tx = lerp(cam.tx, 0, clamp(dt * 2, 0, 1));
    cam.ty = lerp(cam.ty, 1.0, clamp(dt * 2, 0, 1));
    cam.tz = lerp(cam.tz, NET, clamp(dt * 2, 0, 1));
    return;
  }
  const serving = ph === "serveReady" || ph === "toss";
  const wantEx = serving ? you.x * 0.52 : clamp(you.x * 0.40 + (ball.visible ? ball.x * 0.14 : 0), -4.2, 4.2);
  const wantEy = serving ? 4.75 : 5.35 - cam.zoomPunch * 0.35;
  const wantEz = serving ? -9.2 : -10.0 + clamp((you.z + 0.8) * 0.25, -0.4, 2.0);
  const wantTx = ball.visible ? clamp(ball.x * 0.22, -2.5, 2.5) : you.x * 0.2;
  const wantTy = ball.visible ? clamp(0.75 + ball.y * 0.12, 0.75, 1.7) : 0.95;
  const wantTz = serving ? NET + 0.6 : NET - 0.3;
  const k = clamp(dt * 4.5, 0, 1);
  cam.ex = lerp(cam.ex, wantEx, k); cam.ey = lerp(cam.ey, wantEy, k); cam.ez = lerp(cam.ez, wantEz, k);
  cam.tx = lerp(cam.tx, wantTx, k); cam.ty = lerp(cam.ty, wantTy, k); cam.tz = lerp(cam.tz, wantTz, k);
}
function snapGameplayCam() {
  cam.ex = you.x * 0.5; cam.ey = 4.9; cam.ez = -9.6;
  cam.tx = 0; cam.ty = 0.95; cam.tz = NET;
}

function update(rawDt) {
  if (game.paused) return;
  if (game.hitstop > 0) { game.hitstop -= rawDt; cam.shake = Math.max(0, cam.shake - rawDt * 1.8); return; }
  let dt = rawDt;
  if (game.slowMo > 0) { game.slowMo -= rawDt; dt *= 0.38; }

  // Ambient seagull cry timer
  sfxNodes.gullT -= dt;
  if (sfxNodes.gullT <= 0) { sfx.gull(); sfxNodes.gullT = rand(9, 17); }

  // Net hit ripple decay
  if (netHit[2] > 0.001) { netHit[3] += dt; netHit[2] *= Math.exp(-dt * 4.2); }
  crowd.cheer = Math.max(0, crowd.cheer - dt * 0.35);
  crowd.hop += dt * 11;

  updateNudge(dt);
  const ph = game.phase;
  if (ph === "pointOver" || ph === "between") {
    game.timer -= rawDt;
    if (game.timer <= 0) {
      if (ph === "pointOver" && game.winner >= 0) { game.phase = "matchOver"; ball.visible = false; showEnd(); }
      else setupPoint();
    }
  }
  if (ph === "cpuServe") {
    game.timer -= dt;
    if (!game.tossed && game.timer < 0.56) {
      game.tossed = true;
      Object.assign(ball, { x: cpu.x + 0.18, y: 1.6, z: cpu.z - 0.35, vx: 0, vy: 5.2, vz: 0, w: { x: 0, y: 0, z: 0 }, spin: 0, visible: true, live: false, tossing: true, netted: false });
      cpu.tossArm = 1.0;
    }
    if (game.tossed && ball.vy < 0.15) cpuServe();
  }
  if (ph === "toss") {
    game.tossT += dt;
    const meter = $("serveMeter");
    meter.hidden = false;
    const pct = clamp(game.tossT / (TOSS_VY / G * 1.15), 0, 1);
    const yPct = clamp((ball.y - 1.1) / 2.1, 0, 1) * 100;
    $("servePin").style.bottom = yPct + "%";
    if (ball.y < 1.05 && ball.vy < 0) {
      ball.visible = false; meter.hidden = true; game.phase = "serveReady";
      feedback("Missed the toss", "swing to toss again"); setHint();
    }
  } else {
    $("serveMeter").hidden = true;
  }

  // Training loop
  if (ph === "training") {
    training.time = Math.max(0, training.time - dt);
    if (training.comboT > 0) { training.comboT -= dt; if (training.comboT <= 0) training.combo = 0; }
    for (const rg of training.rings) {
      if (rg.active && rg.gold) rg.x = rg.baseX + Math.sin(game.now * 1.5 + rg.seed) * 1.45;
    }
    training.feedT -= dt;
    if (training.feedT <= 0 && (!ball.live || ball.z > NET + 2)) {
      feedTrainingBall(); training.feedT = 2.05;
    }
    updateTrainHUD();
    if (training.time <= 0) {
      game.phase = "trainOver"; ball.visible = false;
      if (training.score > career.trainingBest) { career.trainingBest = training.score; saveCareer(); }
      showTrainEnd();
    }
  }

  // Fixed 240Hz physics sub-stepping
  const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
  for (let i = 0; i < n; i++) {
    if (ball.visible) {
      const px = ball.x, py = ball.y, pz = ball.z;
      const ev = physStep(ball, h, false);
      checkRingHit(px, py, pz);
      if (ev === "bounce") onBounce();
      else if (ev === "net" && ball.live) { sfx.net(ball.x); burstSparks(ball.x, ball.y, NET, [1, 0.96, 0.85], 12, 3.2, 0.06, 2.0); }
    }
    cpuTry();
  }

  // CPU reaction & net rush logic
  if (game.mode === "match") {
    cpu.recover = Math.max(0, cpu.recover - dt);
    if (cpu.pending && cpu.react > 0) {
      cpu.react -= dt;
      if (cpu.react <= 0) {
        const t = cpu.pending, o = CAST[game.opp];
        const doRush = t.bz < o.rushZ && Math.random() < o.rush;
        if (doRush) { cpu.tx = clamp(t.x, -4.8, 4.8); cpu.tz = NET + 2.4; }
        else { cpu.tx = clamp(t.x + (t.x > cpu.x ? -0.45 : 0.45), -6.5, 6.5); cpu.tz = clamp(t.z, NET + 1.8, L + 2.8); }
        cpu.pending = null;
      }
    }
  }

  movePlayer(you, dt);
  if (game.mode === "match") movePlayer(cpu, dt);
  updateCharacterRig(you, 0, dt, true);
  if (game.mode === "match") updateCharacterRig(cpu, 1, dt, false);

  if (ball.visible && ball.live) {
    trail.push({ x: ball.x, y: ball.y, z: ball.z });
    if (trail.length > 24) trail.shift();
  } else if (trail.length) trail.shift();

  for (let i = marks.length - 1; i >= 0; i--) { marks[i].age += dt; if (marks[i].age > 1.5) marks.splice(i, 1); }
  updateParticles(dt);
  updateCamera(dt);
}

let touchy = false;
const samples = [];
let clickDownT = 0, clickBtn = 0, clickStartY = 0;

cv.addEventListener("contextmenu", e => e.preventDefault());
cv.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") touchy = true;
  const t = performance.now();
  samples.push({ x: e.clientX, y: e.clientY, t });
  while (samples.length && t - samples[0].t > 85) samples.shift();
  if (samples.length < 3) return;
  const a = samples[0], b = samples[samples.length - 1], dtm = b.t - a.t;
  if (dtm < 12) return;
  const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
  const v = (d / dtm) / Math.min(W, H) * 1000;
  const thr = touchy ? 2.0 : 2.6;
  if (v > thr && game.now - game.lastSwing > 0.28) {
    const up = -dy / (d || 1);
    const intent = (up > 0.86 && v < thr + 1.5) ? "lob" : up < -0.42 ? "slice" : "drive";
    clickDownT = 0;
    humanSwing(clamp((v - thr) / 4.8, 0.18, 1), intent);
    samples.length = 0;
  }
});
cv.addEventListener("pointerdown", e => {
  if (e.pointerType === "touch") touchy = true;
  samples.length = 0; initAudio();
  if (e.pointerType === "mouse") { clickDownT = performance.now(); clickBtn = e.button; clickStartY = e.clientY; }
});
cv.addEventListener("pointerup", e => {
  if (e.pointerType !== "mouse" || !clickDownT) return;
  const held = performance.now() - clickDownT; clickDownT = 0;
  const pwr = held < 140 ? 0.65 : clamp((held - 80) / 260, 0.45, 1.0);
  const dragUp = clickStartY - e.clientY > 28;
  const intent = (clickBtn === 2 || e.shiftKey) ? "slice" : (e.altKey || dragUp) ? "lob" : "drive";
  humanSwing(pwr, intent);
});

window.addEventListener("keydown", e => {
  keys.add(e.code);
  if (e.code === "Escape" || e.code === "KeyP") {
    if (game.phase !== "title" && game.phase !== "matchOver" && game.phase !== "trainOver") {
      e.preventDefault();
      if (game.paused) { game.paused = false; $("overlay").hidden = true; } else showPause();
    }
    return;
  }
  if (e.code === "Enter" && !$("overlay").hidden) { e.preventDefault(); if (game.paused) { game.paused = false; $("overlay").hidden = true; } else startMatch(); return; }
  if (!$("overlay").hidden) return;
  if (e.code === "Space") { e.preventDefault(); humanSwing(0.76, e.shiftKey ? "slice" : "drive"); }
  else if (e.code === "KeyX" || e.code === "ShiftLeft" || e.code === "ShiftRight") { e.preventDefault(); humanSwing(0.72, "slice"); }
  else if (e.code === "KeyC") { e.preventDefault(); humanSwing(0.70, "lob"); }
});

  state: "idle", peak: 0, startT: 0, sumX: 0, sumY: 0, sumZ: 0, sumN: 0,
  aWas: false, pWas: false, bHeld: false, dpL: false, dpR: false, dpU: false, dpD: false
};
const setReporting = d => d.sendReport(0x12, new Uint8Array([0x04, 0x31]));

async function armWii(d) {
  try { if (!d.opened) await d.open(); } catch (e) { wii.lastErr = e; return; }
  if (!wii.armed.has(d)) { d.addEventListener("inputreport", onWii); wii.armed.add(d); }
  try { await d.sendReport(0x15, new Uint8Array([0x00])); } catch (e) { wii.lastErr = e; }
  try { await setReporting(d); } catch (e) { wii.lastErr = e; }
}
async function connectWii(interactive = true) {
  if (wii.dev) return;
  if (!("hid" in navigator)) { if (interactive) showMsg("Wii Remote", "Needs Chrome or Edge on desktop", 2600); return; }
  let devs;
  try {
    devs = (await navigator.hid.getDevices()).filter(isWii);
    if (!devs.length && interactive) await navigator.hid.requestDevice({ filters: WII_IDS });
    devs = (await navigator.hid.getDevices()).filter(isWii);
  } catch (e) { showMsg("Device Picker", e.message || String(e), 3500); return; }
  if (!devs.length) return;
  $("wiiLbl").textContent = "Searching…";
  wii.lastErr = null;
  const id = ++wii.searchId;
  await Promise.all(devs.map(armWii));
  setTimeout(() => {
    if (wii.dev || id !== wii.searchId) return;
    $("wiiLbl").textContent = "Wii Remote";
    if (interactive) showMsg("No remote answered", wii.lastErr ? String(wii.lastErr.message || wii.lastErr) : "Press a button on the synced remote & retry", 4200);
  }, 2000);
}
function adoptWii(d) {
  wii.dev = d; wii.reports = 0; wii.state = "idle";
  $("wiiLed").classList.add("on"); $("wiiLbl").textContent = "Wii Ready";
  d.sendReport(0x11, new Uint8Array([0x10])).catch(() => {});
  showMsg("Wii Remote Connected", "Swing like a real racket!", 1800); setHint(); wiiRumble(140);
}
if (navigator.hid && navigator.hid.addEventListener) {
  navigator.hid.addEventListener("disconnect", e => {
    wii.armed.delete(e.device);
    if (e.device === wii.dev) { wii.dev = null; $("wiiLed").classList.remove("on"); $("wiiLbl").textContent = "Wii Remote"; setHint(); }
  });
  navigator.hid.addEventListener("connect", e => { if (isWii(e.device) && !wii.dev) armWii(e.device); });
}
function onWii(e) {
  if (!wii.dev) adoptWii(e.device);
  if (e.device !== wii.dev) return;
  const dv = e.data;
  if (e.reportId === 0x20) { setReporting(wii.dev).catch(() => {}); return; }
  if (e.reportId !== 0x31 && e.reportId !== 0x30) return;
  const b0 = dv.getUint8(0), b1 = dv.getUint8(1);
  wii.dpL = !!(b0 & 0x01); wii.dpR = !!(b0 & 0x02); wii.dpD = !!(b0 & 0x04); wii.dpU = !!(b0 & 0x08);
  const a = !!(b1 & 0x08), pauseBtn = !!(b1 & 0x80) || !!(b0 & 0x10);
  wii.bHeld = !!(b1 & 0x04);
  if (a && !wii.aWas) {
    if (!$("overlay").hidden) { if (game.paused) { game.paused = false; $("overlay").hidden = true; } else startMatch(); }
    else if (game.phase === "serveReady") humanSwing(0, "drive");
    else if (game.phase === "rally" || game.phase === "training") { game.lobArmed = !game.lobArmed; updateTelemetry(); }
  }
  if (pauseBtn && !wii.pWas && game.phase !== "title" && game.phase !== "matchOver" && game.phase !== "trainOver") {
    if (game.paused) { game.paused = false; $("overlay").hidden = true; } else showPause();
  }
  wii.aWas = a; wii.pWas = pauseBtn;
  if (e.reportId !== 0x31 || dv.byteLength < 5) return;

  const now = performance.now(), dt = wii.lastT ? clamp((now - wii.lastT) / 1000, 0.002, 0.05) : 0.01;
  wii.lastT = now; wii.reports++;
  const rx = (dv.getUint8(2) - 0x80) / 25, ry = (dv.getUint8(3) - 0x80) / 25, rz = (dv.getUint8(4) - 0x80) / 25;
  const tau = wii.state === "armed" ? 2.0 : 0.18, alpha = 1 - Math.exp(-dt / tau);
  wii.g.x += (rx - wii.g.x) * alpha; wii.g.y += (ry - wii.g.y) * alpha; wii.g.z += (rz - wii.g.z) * alpha;
  if (wii.reports < 15) return;
  const lx = rx - wii.g.x, ly = ry - wii.g.y, lz = rz - wii.g.z, mag = Math.hypot(lx, ly, lz);

  if (wii.state === "cool") {
    if (mag < 1.0 && game.now - game.lastSwing > 0.30) wii.state = "idle";
    return;
  }
  if (wii.state === "idle" && mag > 1.70 && game.now - game.lastSwing > 0.30) {
    wii.state = "armed"; wii.peak = mag; wii.startT = now; wii.sumX = lx; wii.sumY = ly; wii.sumZ = lz; wii.sumN = 1;
  } else if (wii.state === "armed") {
    if (mag > wii.peak) wii.peak = mag;
    if (mag >= wii.peak * 0.7) { wii.sumX += lx; wii.sumY += ly; wii.sumZ += lz; wii.sumN++; }
    if (now - wii.startT > 75) {
      if (wii.peak >= 1.85) {
        const gln = Math.hypot(wii.g.x, wii.g.y, wii.g.z) || 1;
        const up = ((wii.sumX * wii.g.x + wii.sumY * wii.g.y + wii.sumZ * wii.g.z) / (wii.sumN * gln));
        const intent = wii.bHeld || up < -0.55 ? "slice" : "drive";
        humanSwing(clamp((wii.peak - 1.55) / 3.1, 0.15, 1), intent);
        wii.state = "cool";
      } else wii.state = "idle";
    }
  }
}
function wiiRumble(ms) {
  const d = wii.dev; if (!d) return;
  d.sendReport(0x11, new Uint8Array([0x11])).then(() => setTimeout(() => d.sendReport(0x11, new Uint8Array([0x10])).catch(() => {}), ms)).catch(() => {});
}
function wiiRumblePattern(arr) {
  if (!wii.dev) return;
  let t = 0;
  arr.forEach((ms, i) => { if (i % 2 === 0) setTimeout(() => wiiRumble(ms), t); t += ms; });
}

// Top-right toolbar buttons
$("wiiBtn").onclick = () => { initAudio(); connectWii(true); };
$("sndBtn").onclick = () => {
  initAudio(); muted = !muted;
  $("sndLbl").textContent = muted ? "Muted" : "Sound";
  $("sndBtn").setAttribute("aria-pressed", !muted);
  if (AC && sfxNodes.master) sfxNodes.master.gain.setTargetAtTime(muted ? 0 : 0.85, AC.currentTime, 0.05);
  if (AC && sfxNodes.ambGain) sfxNodes.ambGain.gain.setTargetAtTime(muted ? 0.0001 : 0.75, AC.currentTime, 0.15);
};
const SKY_CYCLE = ["auto", "golden", "noon", "twilight"];
$("skyBtn").onclick = () => {
  sfx.ui(); skyOverride = SKY_CYCLE[(SKY_CYCLE.indexOf(skyOverride) + 1) % SKY_CYCLE.length];
  updateActivePreset();
};
$("qualBtn").onclick = () => {
  sfx.ui(); qualIdx = (qualIdx + 1) % QUALITY_TIERS.length;
  $("qualLbl").textContent = QUALITY_TIERS[qualIdx].name;
  resize();
};
$("menuBtn").onclick = () => {
  sfx.ui();
  if (game.phase === "title") return;
  if (game.paused) { game.paused = false; $("overlay").hidden = true; } else showPause();
};

// =========================================================================
// 17. ANIMATION LOOP, FPS MONITOR & BOOT
// =========================================================================
let lastTs = 0, fpsFrames = 0, fpsAcc = 0, slowStreak = 0;
function frame(ts) {
  const t = ts * 0.001, dt = Math.min(0.05, lastTs ? t - lastTs : 0.016);
  lastTs = t; game.now = t;
  update(dt);
  renderFrame();
  // Lightweight FPS tracker & auto-stepdown if consistently < 35fps on Ultra
  fpsFrames++; fpsAcc += dt;
  if (fpsAcc >= 0.75) {
    const fps = Math.round(fpsFrames / fpsAcc);
    $("fpsTag").textContent = `${fps} FPS`;
    $("fpsTag").hidden = false;
    if (fps < 34 && qualIdx < 2) {
      slowStreak++;
      if (slowStreak >= 3) { qualIdx++; $("qualLbl").textContent = QUALITY_TIERS[qualIdx].name; resize(); slowStreak = 0; }
    } else slowStreak = 0;
    fpsFrames = 0; fpsAcc = 0;
  }
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
updateActivePreset();
resize();
updateHUD();
showTitle();
// Pre-pose characters for the live orbiting title backdrop
updateCharacterRig(you, 0, 0.016, true);
updateCharacterRig(cpu, 1, 0.016, false);
requestAnimationFrame(frame);
connectWii(false);

})();
</script>
