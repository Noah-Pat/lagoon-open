  initAudio(); sfx.ui();
  game.mode = "net"; game.paused = false;
  Object.assign(game, { pts: [0, 0], games: [0, 0], server: 0, faults: 0, winner: -1, hitstop: 0, slowMo: 0, stats: { aces: 0, winners: 0, fastestServe: 0, longestRally: 0 } });
  net.presetKey = skyOverride === "auto" ? "golden" : skyOverride;
  net.evq.length = 0; net.rnx = net.rnz = net.gnx = net.gnz = 0;
  updateActivePreset();
  $("overlay").hidden = true; $("score").hidden = false; $("trainHud").hidden = true;
  setupPoint(); snapGameplayCam();
  showMsg(`vs ${net.peerName}`, "First to 3 games · You serve first", 1600);
  netSend({ t: "start", name: net.myName || "Host", pk: presetKeyOf(curPreset) });
}

// ---------- GUEST ----------
function netGuestSwing(power, intent) {
  if (game.now - game.lastSwing < 0.2) return;
  if (game.phase === "title" || game.phase === "matchOver") return;
  game.lastSwing = game.now;
  if (game.lobArmed && intent !== "slice") intent = "lob";
  game.lobArmed = false; updateTelemetry();
  netSend({ t: "sw", p: r3(power), i: intent });
}
function netGuestStart(m) {
  initAudio();
  game.mode = "net"; game.paused = false;
  net.peerName = String(m.name || net.peerName || "Host").slice(0, 14);
  net.presetKey = PRESETS[m.pk] ? m.pk : "golden";
  Object.assign(game, { pts: [0, 0], games: [0, 0], server: 1, faults: 0, winner: -1, hitstop: 0, slowMo: 0, phase: "serveReady" });
  net.prevPhase = null; net.hudKey = ""; marks.length = 0; trail.length = 0;
  for (const p of [you, cpu]) { p.netX = undefined; p.swingTrail.length = 0; }
  updateActivePreset();
  $("overlay").hidden = true; $("score").hidden = false; $("trainHud").hidden = true;
  updateHUD(); setHint(); snapGameplayCam();
  showMsg(`vs ${net.peerName}`, `First to 3 games · ${net.peerName} serves first`, 1600);
}
function netUnpack(p, a) {
  const nx = -a[0], nz = L - a[1];
  if (p.netX === undefined) { p.x = p.tx = nx; p.z = p.tz = nz; }
  p.netX = nx; p.netZ = nz; p.vx = -a[2]; p.vz = -a[3];
  p.swingT = a[4]; p.swingDur = a[5]; p.swingType = a[6]; p.splitT = a[7]; p.tossArm = a[8];
  p.lungeT = a[9]; p.lungeDir = a[10]; p.emoteT = a[11]; p.emote = a[12];
  p.aimTarget = a[13] == null ? null : { x: -a[13], z: L - a[14] };
}
function netApplySnapshot(s) {
  if (game.mode !== "net") return;
  game.phase = s.ph; game.pts = [s.pts[1], s.pts[0]]; game.games = [s.gm[1], s.gm[0]];
  game.server = 1 - s.sv; game.faults = s.fl; game.rally = s.ra; game.tossT = s.tt; game.winner = s.wn >= 0 ? 1 - s.wn : -1;
  const b = s.b;
  Object.assign(ball, {
    x: -b[0], y: b[1], z: L - b[2], vx: -b[3], vy: b[4], vz: -b[5], w: { x: -b[6], y: b[7], z: -b[8] },
    visible: !!b[9], live: !!b[10], rocket: !!b[11], crit: !!b[12], shotTag: b[13],
    lastHitter: b[14] >= 0 ? 1 - b[14] : -1, bounceCount: b[15], serve: !!b[16]
  });
  netUnpack(cpu, s.p0); netUnpack(you, s.p1);
  crowd.cheer = s.cr;
  netHit[0] = -s.nh[0]; netHit[1] = s.nh[1]; netHit[2] = s.nh[2]; netHit[3] = s.nh[3];
  marks.length = 0;
  for (const m of s.mk) marks.push({ x: -m[0], z: L - m[1], out: !!m[2], age: m[3] });
  if (s.pk !== net.presetKey && PRESETS[s.pk]) { net.presetKey = s.pk; updateActivePreset(); }
  for (const e of s.ev || []) netApplyEvent(e);
  const hk = game.pts.join() + "|" + game.games.join() + "|" + game.server;
  if (hk !== net.hudKey) { net.hudKey = hk; updateHUD(); }
  if (s.ph !== net.prevPhase) {
    net.prevPhase = s.ph; setHint(); updateTelemetry();
    if (s.ph === "matchOver") { ball.visible = false; showNetEnd(); }
  }
}
function netApplyEvent(e) {
  const a = e.a || [];
  switch (e.k) {
    case "fx": {
      const b = a.slice();
      if (e.f === "dust") { b[0] = -b[0]; b[1] = L - b[1]; burstDust(...b); }
      else { b[0] = -b[0]; b[2] = L - b[2]; (e.f === "sparks" ? burstSparks : burstConfetti)(...b); }
      break;
    }
    case "sfx": {
      const f = sfx[e.n]; if (!f) break;
      const b = a.slice(), pi = SFX_PAN_IDX[e.n];
      if (pi !== undefined) b[pi] = -(b[pi] || 0);
      if (e.n === "point") b[0] = !b[0];
      f(...b); break;
    }
    case "msg": showMsg(a[0], a[1], a[2]); break;
    case "pt": {
      const [w, reason, isGame, isMatch, pts, sv] = a;
      const [big, sub] = pointText(1 - w, reason, isGame, isMatch, [pts[1], pts[0]], 1 - sv, oppName());
      showMsg(big, sub, isMatch ? 2400 : 1750); break;
    }
    case "fb": feedback(a[0], a[1], a[2]); break;
    case "tel": updateTelemetry(a[0], a[1]); break;
    case "juice": applyJuiceCam(a[0], a[1]); break;
    case "rum": wiiRumble(a[0]); break;
    case "rumP": wiiRumblePattern(a[0]); break;
  }
}
function netGuestTick(dt) {
  // Court nudge → host (sent on change, plus a 4 Hz keep-alive)
  const [nx, nz] = readNudgeInput();
  nudge.x = lerp(nudge.x, nx, clamp(dt * 12, 0, 1)); nudge.z = lerp(nudge.z, nz, clamp(dt * 12, 0, 1));
  const now = performance.now();
  if (nx !== net.sentNx || nz !== net.sentNz || now - net.lastNudgeT > 250) {
    net.sentNx = nx; net.sentNz = nz; net.lastNudgeT = now;
    netSend({ t: "nud", x: nx, z: nz });
  }
  // Smooth both players toward the latest snapshot
  const k = clamp(dt * 16, 0, 1);
  for (const p of [you, cpu]) if (p.netX !== undefined) { p.x += (p.netX - p.x) * k; p.z += (p.netZ - p.z) * k; }
  // Dead-reckon the ball between snapshots with the same 240 Hz physics
  if (ball.visible) {
    const n = Math.max(1, Math.ceil(dt * 240)), h = dt / n;
    for (let i = 0; i < n; i++) physStep(ball, h, false);
  }
  if (netHit[2] > 0.001) { netHit[3] += dt; netHit[2] *= Math.exp(-dt * 4.2); }
  crowd.hop += dt * 11;
  sfxNodes.gullT -= dt;
  if (sfxNodes.gullT <= 0) { sfx.gull(); sfxNodes.gullT = rand(9, 17); }
  const meter = $("serveMeter");
  if (game.phase === "toss" && game.server === 0 && ball.visible) {
    meter.hidden = false;
    $("servePin").style.bottom = clamp((ball.y - 1.1) / 2.1, 0, 1) * 100 + "%";
  } else meter.hidden = true;
  updateCharacterRig(you, 0, dt, true);
  updateCharacterRig(cpu, 1, dt, false);
  if (ball.visible && ball.live) { trail.push({ x: ball.x, y: ball.y, z: ball.z }); if (trail.length > 24) trail.shift(); }
  else if (trail.length) trail.shift();
  updateParticles(dt);
  updateCamera(dt);
}

// ---------- CONNECTION & LOBBY ----------
function netClose() {
  const ws = net.ws;
  net.ws = null; net.connected = false; net.peer = false; net.role = null; net.count = 0;
  if (ws) { ws.onclose = null; ws.onerror = null; ws.onmessage = null; try { ws.close(); } catch {} }
}
function netLeave() { netClose(); net.err = ""; showTitle(); }
function netPeerLost(why) {
  const wasPlaying = game.mode === "net";
  net.peer = false;
  if (wasPlaying) { showTitle(); showMsg("LAN match ended", why, 3400); }
  lanRefresh();
}
function netConnect(role, addrRaw) {
  netClose();
  const nameEl = $("lanName");
  net.myName = ((nameEl && nameEl.value) || net.myName || (role === "host" ? "Host" : "Buddy")).trim().slice(0, 14) || "Player";
  try { localStorage.setItem("lagoon-name", net.myName); } catch {}
  let host = String(addrRaw || "").trim().replace(/^(wss?|https?):\/\//i, "").replace(/\/.*$/, "");
  if (!host) host = "localhost";
  if (!/:\d+$/.test(host) && !host.startsWith("[")) host += ":" + NET_PORT;
  if (role === "guest") { net.addr = String(addrRaw || "").trim(); try { localStorage.setItem("lagoon-addr", net.addr); } catch {} }
  net.role = role; net.err = ""; net.target = host;
  let ws;
  try { ws = new WebSocket("ws://" + host + "/"); }
  catch (e) { net.role = null; net.err = `That address doesn't look right (${escHtml(host)}).`; lanRefresh(); return; }
  net.ws = ws;
  lanRefresh();
  ws.onopen = () => { net.connected = true; netSend({ t: "hello", role, name: net.myName }); lanRefresh(); };
  ws.onerror = () => {
    net.err = role === "host"
      ? `Couldn't reach the server on this computer. Start it first — Mac: <b>python3 lagoon-server.py</b> in Terminal (or <b>Start-Lagoon-Server.command</b>), Windows: <b>Start-Lagoon-Server.bat</b> — then press Host again.`
      : `Couldn't reach <b>${escHtml(host)}</b>. Check the address, that the host's server window is open, and that Windows Firewall allowed it.`;
  };
  ws.onclose = () => {
    const was = net.peer;
    netClose(); if (!net.err) net.err = "Disconnected from the server.";
    if (was) netPeerLost("Connection to the server was lost."); else lanRefresh();
  };
  ws.onmessage = ev => { let m; try { m = JSON.parse(ev.data); } catch { return; } netOnMessage(m); };
}
function netOnMessage(m) {
  switch (m.t) {
    case "sys":
      net.ips = Array.isArray(m.ips) ? m.ips : []; net.count = m.count | 0;
      if (net.count >= 2) netSend({ t: "hello", role: net.role, name: net.myName });
      else if (net.peer) netPeerLost(`${net.peerName || "Your buddy"} left the game.`);
      lanRefresh(); break;
    case "hello":
      if (m.role === net.role) { net.err = `Someone else is already connected as ${m.role}. One PC must Host and the other Join.`; lanRefresh(); return; }
      if (!net.peer) {
        net.peer = true; net.peerName = String(m.name || (m.role === "host" ? "Host" : "Buddy")).slice(0, 14);
        netSend({ t: "hello", role: net.role, name: net.myName });
        sfx.ui(); showMsg(net.role === "host" ? "Buddy joined!" : "Connected!", `${net.peerName} is in the lobby`, 1600);
      }
      lanRefresh(); break;
    case "start": if (net.role === "guest") netGuestStart(m); break;
    case "s": if (net.role === "guest") netApplySnapshot(m); break;
    case "sw": if (net.role === "host") netRemoteSwing(m.p, m.i); break;
    case "nud": if (net.role === "host") { net.rnx = clamp(+m.x || 0, -1, 1); net.rnz = clamp(+m.z || 0, -1, 1); } break;
    case "bye": netPeerLost(`${net.peerName || "Your buddy"} left the match.`); break;
  }
}

function showLan() {
  if (game.mode !== "match") { game.mode = "match"; appliedPreset = null; }
  game.phase = "title"; game.paused = false;
  const served = location.protocol.startsWith("http") && String(location.port) === String(NET_PORT);
  const joinVal = net.addr || (served ? location.hostname : "");
  $("card").innerHTML = `
    <div class="top-meta">
      <div class="eyebrow">LAN Multiplayer · Tennis</div>
      <div class="skill-pill"><span id="lanPill">Offline</span></div>
    </div>
    <h1>Play a Buddy</h1>
    <p class="lede">One computer hosts: start the LAN server that sits next to this game file (Mac: run <b>python3 lagoon-server.py</b> in Terminal or open <b>Start-Lagoon-Server.command</b> · Windows: double-click <b>Start-Lagoon-Server.bat</b>), then press <b>Host Game</b>. Your buddy opens this same game, types the address shown below and presses <b>Join Game</b>.</p>
    <label class="field">Your name<input id="lanName" maxlength="14" autocomplete="off" spellcheck="false" value="${escHtml(net.myName)}" placeholder="Player"></label>
    <div class="lan-grid">
      <div class="lan-box"><b>Host</b><span class="note">This PC runs the server and plays the near court.</span><button class="play alt" id="hostBtn" type="button">Host Game</button></div>
      <div class="lan-box"><b>Join</b><input id="lanAddr" autocomplete="off" spellcheck="false" placeholder="192.168.1.23" value="${escHtml(joinVal)}" aria-label="Host LAN address"><button class="play alt" id="joinBtn" type="button">Join Game</button></div>
    </div>
    <div class="lan-status" id="lanStatus" aria-live="polite"></div>
    <div class="row">
      <button class="play" id="lanStart" type="button" hidden>Start Match</button>
      <button class="play ghost" id="lanBack" type="button">Back</button>
    </div>`;
  $("hostBtn").onclick = () => { sfx.ui(); netConnect("host", "localhost"); };
  $("joinBtn").onclick = () => { sfx.ui(); netConnect("guest", $("lanAddr").value); };
  $("lanAddr").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); netConnect("guest", $("lanAddr").value); } };
  $("lanStart").onclick = startNetMatch;
  $("lanBack").onclick = () => { sfx.ui(); showTitle(); };
  $("overlay").hidden = false; $("hint").hidden = true;
  lanRefresh();
}
function lanRefresh() {
  const st = $("lanStatus"); if (!st) return;
  const pill = $("lanPill"), startBtn = $("lanStart");
  let html = "", cls = "";
  if (net.ws && !net.connected) html = `Connecting to <b>${escHtml(net.target || "")}</b>…`;
  else if (net.connected && net.role === "host") {
    const ips = net.ips.length ? net.ips.map(ip => `<span class="ip">${escHtml(ip)}</span>`).join(" or ") : "<i>no LAN address found</i>";
    html = net.peer
      ? `<b>${escHtml(net.peerName)}</b> joined! Press <b>Start Match</b> when you're both ready.`
      : `Server online. Tell your buddy to join with:<br>${ips}<br><span class="note">Waiting for them to connect…</span>`;
    cls = "ok";
  } else if (net.connected && net.role === "guest") {
    html = net.peer ? `Connected to <b>${escHtml(net.peerName)}</b>. Waiting for the host to start the match…` : `Connected to the server. Waiting for the host to press <b>Host Game</b>…`;
    cls = "ok";
  } else html = net.err || `Not connected. Hosting needs the LAN server (<b>lagoon-server.py</b>) running on this computer — it uses port ${NET_PORT}.`;
  if (net.err && !net.connected) cls = "err";
  st.innerHTML = html; st.className = "lan-status " + cls;
  if (pill) pill.textContent = net.connected ? (net.peer ? "Linked" : net.role === "host" ? "Hosting" : "Joined") : "Offline";
  if (startBtn) startBtn.hidden = !(net.role === "host" && net.peer);
}
function showNetMenu() {
  $("card").innerHTML = `
    <div class="eyebrow">LAN Match · still live</div>
    <h1>Timeout?</h1>
    <p class="lede">The rally keeps going for ${escHtml(oppName())} while this menu is open — LAN matches can't be paused.</p>
    <div class="row">
      <button class="play" id="resumeBtn" type="button">Back to Court</button>
      <button class="play ghost" id="leaveBtn" type="button">Leave LAN Match</button>
    </div>`;
  $("resumeBtn").onclick = () => { sfx.ui(); $("overlay").hidden = true; };
  $("leaveBtn").onclick = () => { sfx.ui(); netSend({ t: "bye" }); netLeave(); };
  $("overlay").hidden = false;
}
function showNetEnd() {
  const w = game.winner, isHost = net.role === "host";
  $("card").innerHTML = `
    <div class="top-meta"><div class="eyebrow">LAN Match · ${w === 0 ? "Pier Champion" : "Runner-up"}</div></div>
    <div class="final-row">
      <h1>${w === 0 ? "You Win!" : `${escHtml(oppName())} Wins`}</h1>
      <div class="final">${game.games[0]}–${game.games[1]}</div>
    </div>
    <p class="lede">${isHost ? "Fancy another? Start a rematch for both of you." : `Waiting for ${escHtml(oppName())} to start a rematch…`}</p>
    <div class="row">
      ${isHost ? `<button class="play" id="rematchBtn" type="button">Rematch</button>` : ""}
      <button class="play ghost" id="leaveBtn" type="button">Leave LAN</button>
    </div>`;
  if (isHost) $("rematchBtn").onclick = () => { if (net.peer) startNetMatch(); else showLan(); };
  $("leaveBtn").onclick = () => { sfx.ui(); netSend({ t: "bye" }); netLeave(); };
  $("overlay").hidden = false; $("hint").hidden = true;
}

// =========================================================================
// 18. ANIMATION LOOP, FPS MONITOR & BOOT
// =========================================================================
let lastTs = 0, fpsFrames = 0, fpsAcc = 0, slowStreak = 0;
function frame(ts) {
  const t = ts * 0.001, dt = Math.min(0.05, lastTs ? t - lastTs : 0.016);
  lastTs = t; game.now = t;
  pollGamepads();
  update(dt);
  netHostSend();
  renderFrame();
  // Lightweight FPS tracker & auto-stepdown if consistently < 35fps on Ultra
  fpsFrames++; fpsAcc += dt;
  if (fpsAcc >= 0.75) {
    const fps = Math.round(fpsFrames / fpsAcc);
    $("fpsTag").textContent = `${fps} FPS`;
    $("fpsTag").hidden = false;
    if (fps < 34 && qualIdx < 2) {
      slowStreak++;
      if (slowStreak >= 3) { qualIdx++; $("qualLbl").textContent = QUALITY_TIERS[qualIdx].name; resize(); slowStreak = 0; }
    } else slowStreak = 0;
    fpsFrames = 0; fpsAcc = 0;
  }
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
updateActivePreset();
resize();
updateHUD();
showTitle();
// Pre-pose characters for the live orbiting title backdrop
updateCharacterRig(you, 0, 0.016, true);
updateCharacterRig(cpu, 1, 0.016, false);
requestAnimationFrame(frame);
connectWii(false);

})();
</script>
