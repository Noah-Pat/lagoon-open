<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Lagoon Open 3D — Wii Pier Tennis (three.js)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@400;600;700;800&display=swap">
<style>
:root{
  --ink:#fff8ec;
  --ink-dim:rgba(255,248,236,.74);
  --glass:rgba(12,34,44,.76);
  --glass-hi:rgba(22,56,70,.88);
  --glass-edge:rgba(255,248,236,.18);
  --coral:#ff6b4a;
  --coral-dk:#bd4026;
  --sun:#ffd23f;
  --lagoon:#38b2a0;
  --cyan:#5ce1e6;
  --deep:#091f28;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--deep);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#stage{position:relative;height:100%;width:100%;overflow:hidden}
#court{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

.chip{background:var(--glass);border:1px solid var(--glass-edge);border-radius:16px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 28px rgba(0,0,0,.28)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:var(--glass);border:1px solid var(--glass-edge);border-radius:999px;padding:7px 13px;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:7px;transition:background .15s,transform .1s}
.btn:hover{background:var(--glass-hi)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.seg button:focus-visible,.play:focus-visible,.opp-card:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.led{width:8px;height:8px;border-radius:50%;background:rgba(255,248,236,.28);flex:none}
.led.on{background:#5cf29a;box-shadow:0 0 10px #5cf29a}

/* Scoreboard */
#score{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));padding:9px 11px;display:grid;grid-template-columns:12px auto 34px 46px;align-items:center;row-gap:4px;column-gap:7px;font-variant-numeric:tabular-nums;pointer-events:none;min-width:196px}
#score .nm{font-weight:800;font-size:13.5px;padding-right:6px;display:flex;align-items:center;gap:6px}
#score .tag{font-size:9px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,210,63,.18);color:var(--sun);padding:2px 5px;border-radius:5px;font-weight:800}
#score .g{font-family:var(--display);font-size:21px;text-align:center;color:var(--sun);line-height:1}
#score .p{font-family:var(--display);font-size:20px;text-align:center;background:rgba(255,248,236,.12);border-radius:8px;padding:2px 0;line-height:1.05}
#score .dot{width:8px;height:8px;border-radius:50%;background:transparent;justify-self:center;transition:background .2s,box-shadow .2s}
#score .dot.on{background:var(--sun);box-shadow:0 0 10px var(--sun)}
#score .hdr{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);text-align:center;font-weight:700}
#scoreBadge{grid-column:1/-1;margin-top:2px;text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:linear-gradient(90deg,var(--coral),#ff944a);color:#fff}

/* Training HUD */
#trainHud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));padding:10px 14px;display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums;pointer-events:none}
#trainHud .blk{display:flex;flex-direction:column;align-items:center;min-width:54px}
#trainHud .lbl{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-weight:700}
#trainHud .val{font-family:var(--display);font-size:24px;line-height:1.05;color:var(--ink)}
#trainHud .val.sun{color:var(--sun)}
#trainHud .val.cyan{color:var(--cyan)}
#trainHud .val.low{color:var(--coral)}

/* Rally / Speed telemetry */
#telemetry{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:none;align-items:center}
.pill{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.05em;display:inline-flex;align-items:center;gap:6px;opacity:0;transform:translateY(-6px);transition:opacity .2s,transform .2s;font-variant-numeric:tabular-nums}
.pill.show{opacity:1;transform:none}
.pill .v{font-family:var(--display);font-size:16px;color:var(--sun);font-weight:400}
.pill.rocket{border-color:rgba(255,210,63,.55);background:rgba(46,24,14,.84)}
.pill.rocket .v{color:#fff08a;text-shadow:0 0 12px rgba(255,190,60,.8)}
#lobBadge{border-color:rgba(92,225,230,.55);color:var(--cyan)}

/* Top-right controls */
#tools{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:56vw}
#fpsTag{font-variant-numeric:tabular-nums;font-size:11px;font-weight:700;padding:7px 10px;border-radius:999px;color:var(--ink-dim);pointer-events:none}

/* Center callouts */
#msg{position:absolute;left:0;right:0;top:19%;text-align:center;pointer-events:none;transition:opacity .22s,transform .22s cubic-bezier(.2,1.2,.3,1);opacity:0;transform:scale(.92) translateY(10px)}
#msg.show{opacity:1;transform:none}
#msg .big{font-family:var(--display);font-size:clamp(36px,7.5vw,70px);line-height:.98;letter-spacing:.02em;text-shadow:0 4px 0 rgba(9,31,40,.72),0 0 36px rgba(255,140,72,.45);text-wrap:balance}
#msg .small{margin-top:8px;font-weight:800;font-size:clamp(14px,2.2vw,19px);color:var(--sun);text-shadow:0 2px 8px rgba(0,0,0,.55)}

/* Shot feedback & serve meter */
#feedback{position:absolute;left:50%;bottom:calc(62px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) scale(.95);padding:7px 15px;font-weight:700;font-size:13.5px;letter-spacing:.02em;opacity:0;transition:opacity .18s,transform .18s;pointer-events:none;white-space:nowrap}
#feedback.show{opacity:1;transform:translateX(-50%) scale(1)}
#feedback b{color:var(--sun);font-family:var(--display);font-weight:400;font-size:17px;letter-spacing:.04em}
#feedback.crit{border-color:rgba(255,210,63,.65);background:rgba(44,24,12,.86)}
#feedback.crit b{color:#fff49c}

#serveMeter{position:absolute;right:calc(22px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);width:14px;height:148px;border-radius:999px;padding:3px;pointer-events:none;display:flex;align-items:flex-end;position:absolute}
#serveMeter .track{position:relative;width:100%;height:100%;border-radius:999px;background:rgba(255,248,236,.12);overflow:hidden}
#serveMeter .sweet{position:absolute;left:0;right:0;top:4%;height:14%;background:linear-gradient(180deg,#fff3a0,var(--sun));box-shadow:0 0 12px var(--sun);border-radius:999px}
#serveMeter .pin{position:absolute;left:-2px;right:-2px;height:7px;border-radius:999px;background:#fff;box-shadow:0 0 10px #fff;bottom:0;transform:translateY(50%)}

#hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:7px 15px;font-size:12.5px;color:var(--ink-dim);text-align:center;max-width:calc(100% - 28px);pointer-events:none}
#hint strong{color:var(--ink)}

/* Menu overlay */
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 42%,rgba(9,31,40,.22),rgba(6,22,30,.76));padding:16px;overflow:auto;z-index:20}
.card{width:min(540px,100%);padding:24px 24px 20px;display:flex;flex-direction:column;gap:14px;border-radius:24px}
.top-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--sun);font-weight:800}
.skill-pill{display:inline-flex;align-items:center;gap:7px;padding:4px 11px;border-radius:999px;background:rgba(255,248,236,.1);border:1px solid rgba(255,248,236,.16);font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
.skill-pill .pro{background:var(--sun);color:var(--deep);font-size:10px;padding:1px 6px;border-radius:999px;letter-spacing:.08em}
h1{font-family:var(--display);font-weight:400;font-size:clamp(42px,8.5vw,60px);line-height:.92;margin:0;color:var(--ink);text-shadow:0 4px 0 var(--coral)}
.lede{margin:0;color:var(--ink-dim);line-height:1.48;font-size:13.5px}

/* Opponent cards */
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.opp-card{text-align:left;padding:11px 11px 10px;border-radius:16px;background:rgba(255,248,236,.06);border:1.5px solid rgba(255,248,236,.12);transition:border-color .15s,background .15s,transform .12s;display:flex;flex-direction:column;gap:4px}
.opp-card:hover{background:rgba(255,248,236,.11);transform:translateY(-1px)}
.opp-card[aria-pressed="true"]{background:rgba(255,248,236,.16);border-color:var(--sun);box-shadow:0 0 0 1px var(--sun) inset,0 8px 20px rgba(0,0,0,.22)}
.opp-top{display:flex;justify-content:space-between;align-items:center;gap:4px}
.opp-nm{font-family:var(--display);font-size:20px;line-height:1;color:var(--ink)}
.opp-crown{font-size:14px;color:var(--sun)}
.opp-tier{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--cyan)}
.opp-desc{font-size:11.5px;color:var(--ink-dim);line-height:1.3}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,248,236,.08);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:700;font-size:12px;color:var(--ink-dim)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--deep)}
.play{border:0;background:linear-gradient(180deg,#ff7d5c,var(--coral));color:#fff;font-family:var(--display);font-size:21px;letter-spacing:.04em;padding:11px 26px;border-radius:999px;box-shadow:0 4px 0 var(--coral-dk);transition:transform .1s,box-shadow .1s}
.play:hover{filter:brightness(1.06)}
.play:active{transform:translateY(2px);box-shadow:0 2px 0 var(--coral-dk)}
.play.alt{background:linear-gradient(180deg,#44c4b2,#2b9687);box-shadow:0 4px 0 #1b665c;font-size:17px;padding:11px 18px}
.play.alt:active{box-shadow:0 2px 0 #1b665c}
.play.ghost{background:rgba(255,248,236,.12);box-shadow:none;border:1px solid var(--glass-edge);font-size:16px;padding:10px 18px}

.controls{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px;margin:0;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.18)}
.controls dt{font-weight:800;color:var(--sun)}
.controls dd{margin:0;color:var(--ink-dim);min-width:0;line-height:1.38}
.note{font-size:11.5px;color:var(--ink-dim);margin:0;line-height:1.45}

/* Post-match stats & skill bar */
.final-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.final{font-family:var(--display);font-size:54px;line-height:1;color:var(--sun);font-variant-numeric:tabular-nums}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat-box{padding:8px 6px;border-radius:12px;background:rgba(255,248,236,.07);text-align:center}
.stat-box .sv{font-family:var(--display);font-size:20px;color:var(--ink);line-height:1.1}
.stat-box .sl{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-dim);font-weight:700;margin-top:2px}
.skill-box{padding:11px 13px;border-radius:14px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;gap:7px}
.skill-head{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700}
.skill-delta{font-family:var(--display);font-size:18px}
.skill-delta.up{color:#66f5a3}
.skill-delta.dn{color:#ff846b}
.skill-bar{height:10px;border-radius:999px;background:rgba(255,248,236,.12);overflow:hidden;position:relative}
.skill-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lagoon),var(--sun),var(--coral));transition:width .8s cubic-bezier(.2,.9,.2,1)}
.skill-mark{position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,248,236,.4)}

/* LAN lobby */
.play.lan{background:linear-gradient(180deg,#6d93ff,#4169dc);box-shadow:0 4px 0 #2a4596;font-size:17px;padding:11px 18px}
.play.lan:active{box-shadow:0 2px 0 #2a4596}
.lan-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lan-box{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:rgba(255,248,236,.06);border:1px solid rgba(255,248,236,.12)}
.lan-box b{font-family:var(--display);font-size:21px;font-weight:400;line-height:1}
.lan-box .play{font-size:16px;padding:9px 14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-weight:800}
.field input,.lan-box input{font:inherit;font-size:15px;font-weight:600;text-transform:none;letter-spacing:0;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--glass-edge);border-radius:10px;padding:9px 11px;outline:none;-webkit-user-select:text;user-select:text;min-width:0}
.field input:focus-visible,.lan-box input:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.lan-status{font-size:13px;line-height:1.5;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.24);border:1px solid transparent}
.lan-status.ok{border-color:rgba(92,242,154,.35)}
.lan-status.err{border-color:rgba(255,107,74,.5);color:#ffc2b4}
.lan-status .ip{font-family:var(--display);font-size:22px;color:var(--cyan);letter-spacing:.02em;-webkit-user-select:text;user-select:text}
@media (max-width:600px){
  .lan-grid{grid-template-columns:1fr}
  .opps{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  #tools .lbl{display:none}
  #score{min-width:160px;padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){#msg,#feedback,.pill,.skill-fill{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="court" aria-label="Lagoon Open 3D Tennis Court"></canvas>

  <div id="score" class="chip" aria-live="polite">
    <span></span><span></span><span class="hdr">Games</span><span class="hdr">Pts</span>
    <span class="dot" id="srv0"></span><span class="nm">You</span><span class="g" id="g0">0</span><span class="p" id="p0">0</span>
    <span class="dot" id="srv1"></span><span class="nm"><span id="oppNameHud">Reef</span><span class="tag" id="oppTierHud">Pro</span></span><span class="g" id="g1">0</span><span class="p" id="p1">0</span>
    <div id="scoreBadge" hidden></div>
  </div>

  <div id="trainHud" class="chip" hidden aria-live="polite">
    <div class="blk"><span class="lbl">Score</span><span class="val sun" id="trScore">0</span></div>
    <div class="blk"><span class="lbl">Combo</span><span class="val cyan" id="trCombo">×1.0</span></div>
    <div class="blk"><span class="lbl">Time</span><span class="val" id="trTime">60.0</span></div>
    <div class="blk"><span class="lbl">Best</span><span class="val" id="trBest">0</span></div>
  </div>

  <div id="telemetry">
    <div id="speedPill" class="chip pill"><span class="v" id="speedVal">0</span><span>MPH</span></div>
    <div id="rallyPill" class="chip pill"><span>RALLY</span><span class="v" id="rallyVal">0</span></div>
    <div id="lobBadge" class="chip pill">LOB ARMED</div>
  </div>

  <div id="tools">
    <div id="fpsTag" class="chip" hidden>60 FPS</div>
    <button class="btn" id="wiiBtn" type="button" title="Connect Wii Remote via WebHID"><span class="led" id="wiiLed"></span><span class="lbl" id="wiiLbl">Wii Remote</span></button>
    <button class="btn" id="skyBtn" type="button" title="Cycle lighting preset"><span class="lbl" id="skyLbl">Sky: Auto</span></button>
    <button class="btn" id="qualBtn" type="button" title="Graphics quality"><span class="lbl" id="qualLbl">Ultra</span></button>
    <button class="btn" id="sndBtn" type="button" aria-pressed="true"><span class="lbl" id="sndLbl">Sound</span></button>
    <button class="btn" id="menuBtn" type="button" title="Pause / Menu (Esc)">Menu</button>
  </div>

  <div id="msg"><div class="big" id="msgBig"></div><div class="small" id="msgSmall"></div></div>
  <div id="feedback" class="chip"></div>
  <div id="serveMeter" class="chip" hidden><div class="track"><div class="sweet"></div><div class="pin" id="servePin"></div></div></div>
  <div id="hint" class="chip"></div>

  <div id="overlay">
    <div class="card chip" id="card"></div>
  </div>
</div>

<script>
// If the three.js modules can't be fetched (offline / blocked CDN), say so instead of showing a blank menu.
setTimeout(() => {
  if (window.__lagoonBooted) return;
  const card = document.getElementById("card");
  if (card) card.innerHTML = `<h1>Loading…</h1><p class="lede">Lagoon Open loads three.js from the jsDelivr CDN. If this message stays, check your internet connection and reload.</p>`;
}, 9000);
</script>

function ihash(i, j) {
  let n = (i * 374761393 + j * 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
function vnoise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(ihash(ix, iy), ihash(ix + 1, iy), ux), lerp(ihash(ix, iy + 1), ihash(ix + 1, iy + 1), ux), uy);
}
function tvnoise(x, y, per) { // tileable value noise
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const w = v => ((v % per) + per) % per;
  const h = (a, b) => ihash(w(a), w(b) + 911);
  return lerp(lerp(h(ix, iy), h(ix + 1, iy), ux), lerp(h(ix, iy + 1), h(ix + 1, iy + 1), ux), uy);
}
function canvasTex(c, wrap, srgb) {
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = wrap;
  if (srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = MAX_ANISO;
  t.needsUpdate = true;
  return t;
}
function heightNormalTex(hgt, S, strength, wrap) {
  const c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"), img = g.createImageData(S, S), d = img.data;
  const at = (x, y) => {
    if (wrap) { x = (x + S) % S; y = (y + S) % S; } else { x = clamp(x, 0, S - 1); y = clamp(y, 0, S - 1); }
    return hgt[y * S + x];
  };
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const nx = (at(x - 1, y) - at(x + 1, y)) * strength;
    const ny = (at(x, y + 1) - at(x, y - 1)) * strength; // canvas rows run opposite to +v
    const il = 1 / Math.hypot(nx, ny, 1), i = (y * S + x) * 4;
    d[i] = (nx * il * 0.5 + 0.5) * 255; d[i + 1] = (ny * il * 0.5 + 0.5) * 255; d[i + 2] = (il * 0.5 + 0.5) * 255; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return canvasTex(c, wrap ? THREE.RepeatWrapping : THREE.ClampToEdgeWrapping, false);
}

function mkCourtTex() {
  const S = 1024, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"), img = g.createImageData(S, S), d = img.data;
  const rc = document.createElement("canvas"); rc.width = rc.height = S;
  const rgx = rc.getContext("2d"), rimg = rgx.createImageData(S, S), rd = rimg.data;
  const hgt = new Float32Array(S * S);
  const x0 = -9.5, z0 = -5.0, spanX = 19.0, spanZ = 33.77;
  const txX = spanX / S, txZ = spanZ / S;
  const cov = (dist, hw, tx) => clamp((hw - Math.abs(dist)) / tx + 0.5, 0, 1);
  for (let py = 0; py < S; py++) {
    const z = z0 + (1 - (py + 0.5) / S) * spanZ;
    for (let px = 0; px < S; px++) {
      const x = x0 + ((px + 0.5) / S) * spanX;
      const inPlay = Math.abs(x) <= DW && z >= 0 && z <= L;
      let r = inPlay ? 36 : 24, gr = inPlay ? 152 : 94, b = inPlay ? 136 : 92;
      const fine = (ihash(px, py) - 0.5) * 8;
      const grain = (vnoise2(x * 1.4, z * 1.4) - 0.5) * 12 + (vnoise2(x * 5.5, z * 5.5) - 0.5) * 9 + fine;
      const warm = 1 + 0.04 * (x / 9.5) + 0.03 * ((z / L) - 0.5);
      r = clamp(r * warm + grain, 0, 255); gr = clamp(gr * warm + grain, 0, 255); b = clamp(b * warm + grain, 0, 255);
      let lc = 0;
      if (z >= -0.04 && z <= L + 0.04) lc = Math.max(lc, cov(Math.abs(x) - DW, 0.035, txX), cov(Math.abs(x) - HW, 0.032, txX));
      if (Math.abs(x) <= DW + 0.04) lc = Math.max(lc, cov(z, 0.048, txZ), cov(z - L, 0.048, txZ));
      if (Math.abs(x) <= HW + 0.03) lc = Math.max(lc, cov(z - (NET - SVC), 0.032, txZ), cov(z - (NET + SVC), 0.032, txZ));
      if (z >= NET - SVC - 0.03 && z <= NET + SVC + 0.03) lc = Math.max(lc, cov(x, 0.032, txX));
      if ((z >= 0 && z <= 0.34) || (z >= L - 0.34 && z <= L)) lc = Math.max(lc, cov(x, 0.032, txX));
      if (lc > 0) { r = lerp(r, 246, lc); gr = lerp(gr, 242, lc); b = lerp(b, 228, lc); }
      const idx = (py * S + px) * 4;
      d[idx] = r; d[idx + 1] = gr; d[idx + 2] = b; d[idx + 3] = 255;
      hgt[py * S + px] = fine * 0.06 + (vnoise2(x * 9, z * 9) - 0.5) * 0.5 + lc * 0.5;
      const rough = clamp(lerp(inPlay ? 0.74 : 0.84, 0.46, lc) + (ihash(px + 7, py + 3) - 0.5) * 0.08, 0, 1) * 255;
      rd[idx] = rd[idx + 1] = rd[idx + 2] = rough; rd[idx + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  rgx.putImageData(rimg, 0, 0);
  g.fillStyle = "rgba(12,38,36,0.055)";
  for (let i = 0; i < 36; i++) {
    const sx = (ihash(i, 11) - 0.5) * 7.2, sz = (i & 1) ? (0.4 + ihash(i, 17) * 2.0) : (L - 0.4 - ihash(i, 19) * 2.0);
    const cx = ((sx - x0) / spanX) * S, cy = (1 - (sz - z0) / spanZ) * S;
    g.beginPath(); g.ellipse(cx, cy, 4 + ihash(i, 23) * 9, 2 + ihash(i, 29) * 4, ihash(i, 31) * 3, 0, TAU); g.fill();
  }
  g.font = "900 34px 'Trebuchet MS','Arial Black',sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(255,248,236,0.52)";
  const cyNear = (1 - (-2.2 - z0) / spanZ) * S, cyFar = (1 - (L + 2.2 - z0) / spanZ) * S;
  g.save(); g.translate(S / 2, cyNear); g.scale(-1, 1); g.fillText("LAGOON OPEN", 0, 0); g.restore();
  g.save(); g.translate(S / 2, cyFar); g.scale(-1, -1); g.fillText("LAGOON OPEN", 0, 0); g.restore();
  return {
    map: canvasTex(c, THREE.ClampToEdgeWrapping, true),
    rough: canvasTex(rc, THREE.ClampToEdgeWrapping, false),
    normal: heightNormalTex(hgt, S, 0.35, false)
  };
}

function mkPierTex() {
  const S = 512, c = document.createElement("canvas"); c.width = c.height = S;
  const g = c.getContext("2d"), img = g.createImageData(S, S), d = img.data;
  const hgt = new Float32Array(S * S);
  for (let py = 0; py < S; py++) {
    const v = py / S;
    for (let px = 0; px < S; px++) {
      const plank = px >> 6, localX = px & 63;
      const t = ihash(plank, 3);
      let r = lerp(164, 200, t), gr = lerp(104, 136, t), b = lerp(60, 86, t);
      const wob = Math.sin(v * TAU * 2 + plank) * 1.4;
      const gs = Math.sin((v * 24 + wob) * TAU * 0.5 + localX * 0.35);
      const grain = gs * 9 + (ihash(px, py) - 0.5) * 6;
      const weather = 0.92 + 0.08 * vnoise2(px / 48, py / 48);
      r = (r + grain) * weather; gr = (gr + grain * 0.8) * weather; b = (b + grain * 0.6) * weather;
      let h = gs * 0.12 + (ihash(px, py) - 0.5) * 0.05 + Math.sin(localX / 63 * Math.PI) * 0.35;
      const butt = ((0.17 + plank * 0.37) % 1);
      if (localX < 3 || Math.abs(v - butt) < 0.004) { r *= 0.46; gr *= 0.44; b *= 0.42; h = -1.2; }
      const nx = localX - 32;
      if (Math.abs(nx) < 18 && (Math.hypot(nx - 14, (v - 0.07) * S) < 2.6 || Math.hypot(nx + 14, (v - 0.07) * S) < 2.6 ||
          Math.hypot(nx - 14, (v - butt - 0.03) * S) < 2.6 || Math.hypot(nx + 14, (v - butt - 0.03) * S) < 2.6)) {
        r *= 0.32; gr *= 0.32; b *= 0.34; h -= 0.4;
      }
      const idx = (py * S + px) * 4;
      d[idx] = clamp(r, 0, 255); d[idx + 1] = clamp(gr, 0, 255); d[idx + 2] = clamp(b, 0, 255); d[idx + 3] = 255;
      hgt[py * S + px] = h;
    }
  }
  g.putImageData(img, 0, 0);
  return { map: canvasTex(c, THREE.RepeatWrapping, true), normal: heightNormalTex(hgt, S, 0.9, true) };
}

function mkNetTex() {

function mkStringTex() {

function mkBallTex() {
  const W2 = 256, H2 = 128, c = document.createElement("canvas"); c.width = W2; c.height = H2;
  const g = c.getContext("2d"), img = g.createImageData(W2, H2), d = img.data;
  const seam = [];
  for (let i = 0; i < 160; i++) {
    const phi = (i / 160) * TAU, th = Math.PI * 0.5 + Math.sin(2 * phi) * 0.62;
    seam.push([Math.sin(th) * Math.cos(phi), Math.cos(th), Math.sin(th) * Math.sin(phi)]);
  }
  for (let py = 0; py < H2; py++) {
    const v = (py + 0.5) / H2, lat = (v - 0.5) * Math.PI, cl = Math.cos(lat), sy = Math.sin(lat);
    for (let px = 0; px < W2; px++) {
      const u = (px + 0.5) / W2, lon = (u - 0.5) * TAU;
      const sx = cl * Math.cos(lon), sz = cl * Math.sin(lon);
      let best = 9;
      for (let i = 0; i < 160; i++) {
        const s = seam[i], ang = Math.acos(clamp(sx * s[0] + sy * s[1] + sz * s[2], -1, 1));
        if (ang < best) best = ang;

      let r = 228 + fuzz, gr = 246 + fuzz * 0.8, b = 52 + fuzz * 0.6;
      const sm = 1 - smoothstep(0.055, 0.082, best);
      const edge = smoothstep(0.055, 0.075, best) * (1 - smoothstep(0.075, 0.11, best));
      r = lerp(r * (1 - edge * 0.22), 250, sm); gr = lerp(gr * (1 - edge * 0.22), 248, sm); b = lerp(b * (1 - edge * 0.22), 240, sm);
      const idx = (py * W2 + px) * 4;

    }

function mkWaterNormals() {

const limbCache = new Map();
function limbGeo(r0, r1, len, bulge = 0.12) {
  const key = `${r0}|${r1}|${len}|${bulge}`;
  if (limbCache.has(key)) return limbCache.get(key);
  const pts = [];
  for (let i = 0; i <= 6; i++) { const a = -Math.PI / 2 + (i / 6) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.max(1e-4, Math.cos(a) * r1), -len + Math.sin(a) * r1)); }
  for (let i = 1; i < 10; i++) { const t = 1 - i / 10; pts.push(new THREE.Vector2(lerp(r0, r1, t) + Math.sin(t * Math.PI) * r0 * bulge, -len * t)); }
  for (let i = 0; i <= 6; i++) { const a = (i / 6) * (Math.PI / 2); pts.push(new THREE.Vector2(Math.max(1e-4, Math.cos(a) * r0), Math.sin(a) * r0)); }
  const g = new THREE.LatheGeometry(pts, 22);
  limbCache.set(key, g);
  return g;
}

function deformNet(t) {
  const apply = (geo, base) => {
    const p = geo.attributes.position.array;
    for (let i = 0; i < p.length; i += 3) {
      let x = base[i], y = base[i + 1], z = base[i + 2];
      const k = 0.025 * clamp(y, 0, 1.25);
      z += Math.sin(t * 2.2 + x * 1.1 + y * 4.0) * k * 0.45;
      x += Math.cos(t * 1.7 + y * 5.0) * k * 0.2;
      if (netHit[2] > 0.001) {
        const d = Math.hypot(x - netHit[0], y - netHit[1]);
        z += Math.exp(-d * 1.35) * Math.sin(d * 9.0 - netHit[3] * 26.0) * netHit[2] * smoothstep(0, 0.18, y);
      }
      p[i] = x; p[i + 1] = y; p[i + 2] = z;
    }
    geo.attributes.position.needsUpdate = true;
  };
  apply(GEO.net, NET_BASE);
  apply(GEO.netTape, TAPE_BASE);
}

    b.rotZ += (b.w.z * 0.06 - b.vx * 0.4) * dt;

  let ev = null;
  // Net crossing
  if (!b.netted && pz !== b.z && (pz - NET) * (b.z - NET) <= 0) {
    const u = (NET - pz) / (b.z - pz);
    const cx = px + (b.x - px) * u, cy = py + (b.y - py) * u;
    if (Math.abs(cx) <= POST_X + R) {
      const gap = cy - cordY(cx);
      if (gap <= R + 0.08) {
        const dir = Math.sign(b.vz) || 1;
        if (!simOnly) { netHit[0] = cx; netHit[1] = clamp(cy, 0.1, 1.0); netHit[2] = clamp(Math.hypot(b.vx, b.vz) * 0.012, 0.08, 0.26); netHit[3] = 0; }
        if (gap > R + 0.01) {

          b.vy += 0.55; b.vz *= 0.84; b.netted = true; b.touched = "cord"; ev = "net";
        } else if (gap > -R * 0.55 && b.vy < 1.8) {
          // Dramatic net-cord dribble over!
          b.x = cx; b.z = NET + dir * 0.08; b.y = cordY(cx) + R + 0.025;
          b.vz = dir * (simOnly ? 1.1 : rand(0.8, 1.65)); b.vy = simOnly ? 0.5 : rand(0.35, 0.85);
          b.vx *= 0.25; b.w.x *= 0.1; b.w.y *= 0.1; b.w.z *= 0.1;
          b.netted = true; b.touched = "cord"; ev = "net";
        } else {
          // Into the mesh
          b.x = cx; b.z = NET - dir * 0.06;
          b.vz = -dir * Math.min(1.2, Math.abs(b.vz) * 0.14);
          b.vx *= 0.25; if (b.vy > 0) b.vy *= 0.25;
          b.netted = true; b.touched = "mesh"; ev = "net";
        }
      }
    }
  }
  // Ground bounce with topspin kick / slice skid
  if (b.y < R && b.vy < 0) {
    const vn = -b.vy;
    b.y = R;
    if (vn < 0.45) { b.vy = 0; }
    else {
      const top = b.w.x * Math.sign(b.vz || 1);
      const e = clamp(REST + clamp(GRIP * R * top / (vn + 3.5), -0.24, 0.28), 0.36, 0.88);
      const Jmax = MU * (1 + e) * vn;
      const slip = b.vz - GRIP * R * b.w.x;
      const J = clamp(slip / (1 + 1 / KI), -Jmax, Jmax);
      b.vz -= J; b.w.x += J / (KI * R); b.vx *= 0.94;

  if (b.y <= R + 1e-3 && b.vy === 0) { const f = Math.max(0, 1 - 1.8 * dt); b.vx *= f; b.vz *= f; }
  return ev;
}

function solveFlight(bx, by, bz, tx, tz, T, w0) {
  let vx = (tx - bx) / T, vz = (tz - bz) / T, vy = (R - by + 0.5 * G * T * T) / T;
  const steps = Math.max(24, Math.min(90, Math.round(T * 60))), dt = T / steps;
  let minGap = 99;
  for (let it = 0; it < 5; it++) {
    let x = bx, y = by, z = bz, cvx = vx, cvy = vy, cvz = vz, wx = w0.x, wy = w0.y, wz = w0.z;
    minGap = 99;
    for (let s = 0; s < steps; s++) {
      const pz = z, v = Math.hypot(cvx, cvy, cvz), dg = -DRAG_K * v;
      cvx += (dg * cvx + MAGNUS_K * (wy * cvz - wz * cvy)) * dt;
      cvy += (-G + dg * cvy + MAGNUS_K * (wz * cvx - wx * cvz)) * dt;
      cvz += (dg * cvz + MAGNUS_K * (wx * cvy - wy * cvx)) * dt;
      x += cvx * dt; y += cvy * dt; z += cvz * dt;
      const dec = 1 - SPIN_DECAY * dt; wx *= dec; wy *= dec; wz *= dec;
      if ((pz - NET) * (z - NET) <= 0 && z !== pz) {
        const u = (NET - pz) / (z - pz), nx = x - cvx * dt * (1 - u), ny = y - cvy * dt * (1 - u);
        minGap = ny - cordY(nx);
      }
    }
    vx += (tx - x) / T; vy += (R - y) / T; vz += (tz - z) / T;
  }
  return { vx, vy, vz, gap: minGap };
}

function launchShot(tx, tz, spec) {
  const dir = Math.sign(tz - ball.z) || 1;
  const w0 = { x: (spec.top || 0) * dir, y: spec.side || 0, z: Math.abs(spec.top || 0) * 0.08 * dir };
  let sol = null;
  if (spec.T) {
    let T = spec.T;
    for (let k = 0; k < 6; k++) {
      sol = solveFlight(ball.x, ball.y, ball.z, tx, tz, T, w0);
      if (sol.gap >= (spec.clear ?? 0.2)) break;
      T *= 1.07;
    }
  } else {
    let lo = 0.34, hi = 1.60;
    for (let k = 0; k < 8; k++) {
      const T = (lo + hi) * 0.5;
      sol = solveFlight(ball.x, ball.y, ball.z, tx, tz, T, w0);
      const mph = Math.hypot(sol.vx, sol.vy, sol.vz) * MPH;
      if (sol.gap < (spec.clear ?? 0.2)) lo = T;
      else if (mph > spec.mph) lo = T; else hi = T;

  }

    vx: sol.vx, vy: sol.vy, vz: sol.vz, w: w0, spin: w0.x,
    netted: false, touched: null, bounceCount: 0, visible: true, live: true, tossing: false,
    rocket: !!spec.rocket, crit: !!spec.crit, shotTag: spec.tag || "drive",
    mph: Math.hypot(sol.vx, sol.vy, sol.vz) * MPH

  return ball.mph;
}

function predictBall(near, forVolley = false) {
  const s = { ...ball, w: { ...ball.w } };
  let bounces = 0, firstBounce = null;
  const h = 1 / 120;
  for (let i = 0; i < 600; i++) {
    const ev = physStep(s, h, true);
    if (ev === "bounce" && ((s.z < NET) === near)) {
      bounces++;
      if (!firstBounce) firstBounce = { x: s.x, z: s.z };
    }
    if (near && forVolley && bounces === 0 && s.z <= you.homeZ + 0.4 && s.z > 0 && s.y >= 0.45 && s.y <= 2.15) {
      return { x: s.x, z: s.z, bx: s.x, bz: s.z, volley: true };
    }
    if (near) {
      if (bounces >= 1 && ((s.vy < 0 && s.y < 1.30) || s.z < -1.5)) return { x: s.x, z: s.z, bx: firstBounce.x, bz: firstBounce.z };
      if (bounces === 0 && s.z < -2.6) return { x: s.x, z: -1.5, bx: s.x, bz: -1.2 };
    } else {
      if (bounces >= 1 && ((s.vy < 0 && s.y < 1.30) || s.z > L + 1.5)) return { x: s.x, z: s.z, bx: firstBounce.x, bz: firstBounce.z };
      if (bounces === 0 && s.z > L + 2.6) return { x: s.x, z: L + 1.5, bx: s.x, bz: L + 1.2 };
    }
  }
  return { x: s.x, z: s.z, bx: firstBounce ? firstBounce.x : s.x, bz: firstBounce ? firstBounce.z : s.z };
}

const deuceSide = () => (game.pts[0] + game.pts[1]) % 2 === 0;
const boxSign = () => { const d = deuceSide(); return game.server === 0 ? (d ? -1 : 1) : (d ? 1 : -1); };
function serveIn(x, z) {
  const s = boxSign(), far = game.server === 0;
  const zOk = far ? (z >= NET && z <= NET + SVC + 0.06) : (z <= NET && z >= NET - SVC - 0.06);
  const xs = x * s;
  return zOk && xs >= -0.05 && xs <= HW + 0.06;
}
function inCourt(x, z, near) {
  if (Math.abs(x) > HW + 0.06) return false;
  return near ? (z >= -0.06 && z < NET) : (z > NET && z <= L + 0.06);
}
function placePlayer(p, x, z) { p.x = p.tx = x; p.z = p.tz = z; p.vx = p.vz = 0; p.swingTrail.length = 0; }

function updateActivePreset() {
  const key = skyOverride === "auto" ? (game.mode === "net" ? net.presetKey : CAST[game.opp].sky) : skyOverride;
  curPreset = PRESETS[key] || PRESETS.golden;
  $("skyLbl").textContent = "Sky: " + (skyOverride === "auto" ? "Auto" : curPreset.label.split(" ")[0]);
}

function setupPoint() {
  const d = deuceSide(), o = CAST[game.opp];
  Object.assign(ball, { visible: false, live: false, serve: false, netted: false, touched: null, tossing: false, lastHitter: -1, bounceCount: 0, rocket: false, crit: false });
  trail.length = 0; game.rally = 0; game.strokes = 0; game.lobArmed = false;
  const isNet = game.mode === "net";
  cpu.speed = isNet ? you.speed : o.speed; cpu.pending = null; cpu.recover = 0;
  you.homeX = 0; you.homeZ = -0.8; you.aimTarget = null;
  if (isNet) { cpu.homeX = 0; cpu.homeZ = L + 0.8; cpu.aimTarget = null; net.lastSwingB = -9; net.lobB = false; net.aimNext = null; }
  if (game.server === 0) {
    placePlayer(you, d ? 0.75 : -0.75, -0.4); placePlayer(cpu, d ? -2.3 : 2.3, L + 0.8);
    game.phase = "serveReady";
  } else if (isNet) {
    // LAN guest serves: same placement as the CPU serve, but the guest controls the toss
    placePlayer(cpu, d ? -0.75 : 0.75, L + 0.4); placePlayer(you, d ? 2.2 : -2.2, -0.85);
    game.phase = "serveReady";
  } else {
    placePlayer(cpu, d ? -0.75 : 0.75, L + 0.4); placePlayer(you, d ? 2.2 : -2.2, -0.85);
    game.phase = "cpuServe"; game.timer = 1.35; game.tossed = false;
  }
  updateHUD(); setHint(); updateTelemetry(0, false);
}

const oppName = () => game.mode === "net" ? (net.peerName || "Buddy") : CAST[game.opp].name;
function callScoreFor(pts, server, oname) {
  const [a, b] = pts, N = ["Love", "15", "30", "40"];
  if (a >= 3 && b >= 3) return a === b ? "Deuce" : "Advantage " + (a > b ? "You" : oname);
  const ps = pts[server], pr = pts[1 - server];
  return ps === pr ? N[ps] + " all" : N[ps] + "–" + N[pr];
}
function callScore() { return callScoreFor(game.pts, game.server, oppName()); }
// Point banner text from the viewer's perspective (viewer is always player 0 in their own frame)
function pointText(w, reason, isGame, isMatch, pts, server, oname) {
  if (reason === "Winner!" || reason === "Too quick") reason = w === 0 ? "Winner!" : "Too quick";
  let sub;
  if (isMatch) sub = w === 0 ? "Game, Set & Match!" : `${oname} takes the match`;
  else if (isGame) sub = w === 0 ? "Game, You!" : `Game, ${oname}`;
  else sub = callScoreFor(pts, server, oname);
  return [reason, sub];
}

function pointTo(w, reason) {
  ball.live = false; game.faults = 0;
  const o = CAST[game.opp], isNet = game.mode === "net";
  const isAce = game.strokes === 1 && w === game.server && (isNet || game.server === 0);
  if (isAce) { reason = "ACE!"; if (w === 0) { game.stats.aces++; if (!isNet) career.aces++; } }
  else if (ball.touched === "cord" && (isNet || w === 0)) reason = "Net cord!";
  if (w === 0 && (reason === "Winner!" || reason === "ACE!" || reason === "Net cord!")) game.stats.winners++;

  game.pts[w]++;
  const a = game.pts[w], b = game.pts[1 - w];
  const callPts = game.pts.slice(), callSv = game.server;
  let isGame = false, isMatch = false;
  if (a >= 4 && a - b >= 2) {
    isGame = true;
    game.games[w]++; game.pts = [0, 0]; game.server = 1 - game.server;
    if (game.games[w] >= 3) {
      isMatch = true; game.winner = w;
      game.slowMo = 0.75;
    }
    if (isMatch && !isNet) {
      const delta = skillDelta(w === 0, o, { gamesFor: game.games[0], gamesAgainst: game.games[1], aces: game.stats.aces, streakBefore: career.streak });
      game.lastSkillDelta = delta;
      career.skill = clamp(career.skill + delta, 0, 2000);
      if (w === 0) { career.wins++; career.streak++; career.bestStreak = Math.max(career.bestStreak, career.streak); career.crowns[o.id] = true; }
      else { career.losses++; career.streak = 0; }
      saveCareer();
    }
  }
  const [big, sub] = pointText(w, reason, isGame, isMatch, callPts, callSv, oppName());
  if (isNet) netEv({ k: "pt", a: [w, reason, isGame, isMatch, callPts, callSv] });

  if (w === 0) {
    you.emote = "win"; you.emoteT = 1.4; cpu.emote = "lose"; cpu.emoteT = 1.4;
    crowd.cheer = isMatch || isGame || reason === "ACE!" ? 1.0 : 0.55; crowd.hop = 0;
    wiiRumblePattern(isGame ? [85, 55, 85] : [65]);
    if (isMatch) burstConfetti(you.x, 1.5, you.z + 2, 95);
    else if (isGame || reason === "ACE!") burstConfetti(you.x, 1.8, you.z + 1.5, 45);
  } else {
    cpu.emote = "win"; cpu.emoteT = 1.4; you.emote = "lose"; you.emoteT = 1.4;
    crowd.cheer = isNet ? (isMatch || isGame || reason === "ACE!" ? 1.0 : 0.55) : 0.25;
    if (isNet) {
      netEv({ k: "rumP", a: [isGame ? [85, 55, 85] : [65]] });
      if (isMatch) burstConfetti(cpu.x, 1.5, cpu.z - 2, 95);
      else if (isGame || reason === "ACE!") burstConfetti(cpu.x, 1.8, cpu.z - 1.5, 45);
    }
  }

  showMsg(big, sub, isMatch ? 2400 : 1750);
  sfx.point(w === 0, isGame, isMatch);
  game.phase = "pointOver"; game.timer = isMatch ? 2.5 : 1.85;
  updateHUD(); setHint();
}

function fault() {
  game.faults++; ball.live = false;
  if (game.faults >= 2) { pointTo(1 - game.server, "Double fault"); return; }
  showMsg("Fault", "Second serve", 1150);
  if (game.mode === "net") netEv({ k: "msg", a: ["Fault", "Second serve", 1150] });
  sfx.crowdGasp();
  game.phase = "between"; game.timer = 1.25; setHint();
}

function onBounce() {
  const b = ball;
  sfx.bounce(Math.hypot(b.vx, b.vy, b.vz), b.x);
  burstDust(b.x, b.z, 8, [0.96, 0.94, 0.84]);
  if (!b.live) return;
  if (game.mode === "training") {
    b.bounceCount++;
    if (b.lastHitter === 1 && b.bounceCount >= 2) {
      training.combo = 0; b.live = false; updateTrainHUD();
      feedback("Missed ball", "combo reset");
    }
    if (b.lastHitter === 0 && b.bounceCount >= 1) {
      marks.push({ x: b.x, z: b.z, out: !inCourt(b.x, b.z, false), age: 0 });
      b.live = false;
    }
    return;
  }
  const near = b.z < NET, hitter = b.lastHitter, recv = 1 - hitter, recvNear = recv === 0;
  if (b.serve) {
    const ok = serveIn(b.x, b.z);
    if (b.netted && ok) {
      marks.push({ x: b.x, z: b.z, out: false, age: 0 }); b.live = false;
      showMsg("Let", "Take that serve again", 1100); sfx.crowdGasp();
      if (game.mode === "net") netEv({ k: "msg", a: ["Let", "Take that serve again", 1100] });
      game.phase = "between"; game.timer = 1.2; return;
    }
    marks.push({ x: b.x, z: b.z, out: !ok, age: 0 });
    if (!ok) { fault(); return; }
    b.serve = false; b.bounceCount = 1; return;
  }
  if (near !== recvNear) { marks.push({ x: b.x, z: b.z, out: true, age: 0 }); pointTo(recv, b.netted ? "Into the net" : "Fell short"); return; }
  b.bounceCount++;
  if (b.bounceCount === 1) {
    const ok = inCourt(b.x, b.z, near);
    marks.push({ x: b.x, z: b.z, out: !ok, age: 0 });
    if (!ok) pointTo(recv, "Out!");
  } else {
    pointTo(hitter, hitter === 0 ? "Winner!" : "Too quick");
  }
}

function applyJuiceCam(isCrit, isRocket) {
  if (isRocket) { cam.shake = 0.95; cam.zoomPunch = 1.0; }
  else if (isCrit) { cam.shake = 0.50; cam.zoomPunch = 0.55; }
  else cam.shake = Math.max(cam.shake, 0.16);
}
function triggerImpactJuice(isCrit, isRocket, col) {
  // Camera punch belongs to whoever hit the ball (the LAN guest gets theirs over the wire)
  if (netCtx === "guest") netEv({ k: "juice", a: [!!isCrit, !!isRocket] });
  else applyJuiceCam(isCrit, isRocket);
  if (isRocket) { game.hitstop = 0.055; burstSparks(ball.x, ball.y, ball.z, [1.0, 0.94, 0.55], 38, 7.5, 0.11, 3.8); }
  else if (isCrit) { game.hitstop = 0.038; burstSparks(ball.x, ball.y, ball.z, col, 26, 6.0, 0.09, 3.2); }
  else burstSparks(ball.x, ball.y, ball.z, col, 12, 3.8, 0.07, 2.2);
}

function humanSwing(power, intent = "drive") {
  initAudio();
  if (net.role === "guest" && game.mode === "net") { netGuestSwing(power, intent); return; }
  if (game.mode === "golf") return;
  if (game.paused || game.now - game.lastSwing < 0.28) return;
  const ph = game.phase;
  if (ph === "title" || ph === "matchOver" || ph === "trainOver") return;
  if ((ph === "serveReady" || ph === "toss") && game.server !== 0) return; // the other LAN player is serving
  game.lastSwing = game.now;

  if (ph === "serveReady") {
    Object.assign(ball, { x: you.x + 0.20, y: 1.55, z: you.z + 0.35, vx: 0, vy: TOSS_VY, vz: 0, w: { x: 0, y: 0, z: 0 }, spin: 0,
      visible: true, live: false, tossing: true, netted: false, rocket: false, crit: false });
    you.tossArm = 1.0; game.phase = "toss"; game.tossT = 0; setHint(); return;
  }
  if (ph === "toss") { serveHit(power, intent); return; }
  if (ph !== "rally" && ph !== "training") return;

  const b = ball;
  const useLob = (intent === "lob" || (game.lobArmed && intent !== "slice"));
  game.lobArmed = false; updateTelemetry();
  if (!b.live || b.lastHitter !== 1 || (b.serve && b.bounceCount === 0 && b.z > NET)) {
    you.swingT = you.swingDur = 0.32; you.swingType = "fh";
    feedback("Swing", "wait for the ball"); return;
  }

  const dz = b.z - you.z, dx = b.x - you.x;
  const isSmash = b.y >= 2.0 && b.z > NET - 4.2 && Math.abs(dx) < 2.25 && dz <= WIN.smash.early && dz >= WIN.smash.late;
  const isVolley = !isSmash && b.bounceCount === 0 && you.z > NET - SVC - 0.6 && dz <= WIN.volley.early && dz >= WIN.volley.late && b.y >= WIN.volley.yLo && b.y <= WIN.volley.yHi;
  const shotKey = isSmash ? "smash" : isVolley ? "volley" : useLob ? "lob" : intent === "slice" ? "slice" : "drive";
  const win = isSmash ? WIN.smash : isVolley ? WIN.volley : useLob ? WIN.lob : WIN.ground;
  const volleyOk = b.bounceCount >= 1 || isVolley || isSmash || b.z > 4.2;

  if (b.z > NET - 0.25 || dz > win.early || dz < win.late || Math.abs(dx) > win.x || b.y > win.yHi || !volleyOk) {
    you.swingT = you.swingDur = 0.32; you.swingType = dx >= 0 ? "fh" : "bh";
    if (b.vz < 0 && dz > win.early && dz < 9.5) feedback("Too early", "let it come to you");
    else if (dz < win.late) feedback("Too late", "swing sooner");
    return;
  }

  const span = dz >= win.sweet ? (win.early - win.sweet) : (win.sweet - win.late);
  const tau = clamp((dz - win.sweet) / span, -1, 1); // +1 early cross, 0 sweet, -1 late line
  const side = Math.sign(dx) || 1;
  const oppX = game.mode === "training" ? 0 : cpu.x;
  const open = -Math.sign(oppX || side);
  const bias = clamp(0.55 * open + 0.35 * nudge.x, -1, 1);
  const steered = -side * tau * (0.38 + 0.62 * Math.abs(tau));
  const aim = clamp(steered + bias * (1 - Math.abs(tau)), -1, 1);
  const sh = SHOT[shotKey];
  const depth = tau > 0 ? lerp(sh.depthSweet, sh.depthEarly, tau) : lerp(sh.depthSweet, sh.depthLate, -tau);
  const miss = 0.06 + 0.16 * Math.abs(tau) * (1.05 - 0.28 * power);
  const tx = aim * (HW - 0.26) + rand(-miss, miss);
  const tz = NET + depth + rand(-miss, miss);

  const cross = clamp(tau, 0, 1), line = clamp(-tau, 0, 1), mid = 1 - cross - line;
  const wantMph = sh.T ? 0 : (sh.mphSweet * mid + sh.mphCross * cross + sh.mphLine * line) * (0.78 + 0.22 * power);
  const isCrit = isSmash || (Math.abs(tau) < 0.26 && power >= 0.65);

  const fore = dx <= 0; // screen-right (-X) is right-handed forehand!
  you.swingDur = isSmash ? 0.44 : shotKey === "slice" ? 0.36 : 0.38;
  you.swingT = you.swingDur;
  you.swingType = isSmash ? "smash" : shotKey === "slice" ? "slice" : fore ? "fh" : "bh";
  if (Math.abs(dx) > 1.35) { you.lungeT = 0.32; you.lungeDir = -side; }

  const mph = launchShot(tx, tz, {
    mph: wantMph, T: sh.T, top: sh.top * (0.75 + 0.35 * power), side: sh.side * aim, clear: sh.clear,
    crit: isCrit, tag: shotKey
  });
  b.lastHitter = 0; b.serve = false;
  game.rally++; game.strokes++;
  if (game.rally > game.stats.longestRally) game.stats.longestRally = game.rally;
  if (game.rally > career.longestRally && netCtx === "local") { career.longestRally = game.rally; saveCareer(); }
  if (game.rally >= 7 && game.rally % 4 === 3) { sfx.crowdGasp(); crowd.cheer = Math.max(crowd.cheer, 0.35); }

  sfx.hit(power, isSmash ? "smash" : shotKey, b.x);
  wiiRumble(isSmash ? 125 : isCrit ? 75 : shotKey === "volley" ? 32 : 55);
  const sparkCol = shotKey === "slice" ? [0.45, 0.96, 1.0] : isSmash ? [1.0, 0.86, 0.28] : [1.0, 0.68, 0.24];
  triggerImpactJuice(isCrit, false, sparkCol);

  const label = isSmash ? "SMASH!" : isVolley ? "VOLLEY!" : useLob ? "LOB!" : Math.abs(tau) < 0.26 ? (isCrit ? "PERFECT!" : "Clean") : tau > 0 ? "Early · Cross" : "Late · Line";
  const detail = `${Math.round(mph)} MPH · ${shotKey === "slice" ? "slice" : shotKey === "lob" ? "high arc" : fore ? "forehand" : "backhand"}`;
  feedback(label, detail, isCrit || isSmash);
  updateTelemetry(mph, false);

  if (game.mode === "match") {
    cpu.splitT = 0.24;
    cpu.pending = predictBall(false);
    cpu.react = CAST[game.opp].react;
    if (Math.abs(tx) > 3.2) cpu.recover = 0.34;
  } else if (game.mode === "net") {
    cpu.splitT = 0.24;
    net.aimNext = netCtx === "guest" ? "host" : "guest"; // the other player auto-runs to the ball
  }
}

function serveHit(power, intent) {
  const dtA = Math.abs(game.tossT - TOSS_VY / G);
  const isRocket = dtA <= 0.075 && power >= 0.56 && intent !== "slice";
  const isSlice = intent === "slice";
  const tq = isRocket ? 1 : clamp(1 - Math.max(0, dtA - 0.075) / 0.32, 0, 1);
  const targetMph = isRocket ? (126 + 8 * (1 - dtA / 0.075) + 4 * clamp((power - 0.56) / 0.44, 0, 1))
    : dtA > 0.36 ? (64 + 14 * power)
    : (78 + 34 * tq * (0.55 + 0.45 * power));

  const s = boxSign(), e = 1 - tq;
  const tx = s * rand(0.75, 3.25) + e * rand(-1, 1) * 2.1;
  const tz = NET + SVC * (0.48 + 0.42 * power) + e * rand(-1, 1.15) * 2.6;

  you.swingDur = 0.42; you.swingT = 0.42; you.swingType = "serve";
  const mph = launchShot(tx, tz, {
    mph: targetMph, top: isSlice ? -85 : isRocket ? 115 : 80, side: isSlice ? -210 * s : 55 * s,
    clear: isRocket ? 0.14 : 0.20, rocket: isRocket, crit: isRocket || tq > 0.82, tag: isSlice ? "slice" : "drive"
  });
  Object.assign(ball, { serve: true, lastHitter: 0 });
  game.phase = "rally"; game.strokes = 1; game.rally = 1; setHint();

  const rMph = Math.round(mph);
  if (netCtx === "local") {
    if (rMph > game.stats.fastestServe) game.stats.fastestServe = rMph;
    if (rMph > career.fastestServe) { career.fastestServe = rMph; saveCareer(); }
  }

  sfx.hit(isRocket ? 1.0 : power, isRocket ? "rocket" : isSlice ? "slice" : "drive", ball.x);
  wiiRumble(isRocket ? 130 : 70);
  triggerImpactJuice(tq > 0.8, isRocket, isRocket ? [1.0, 0.96, 0.65] : [1.0, 0.80, 0.30]);
  feedback(isRocket ? "ROCKET SERVE!" : tq > 0.78 ? "Clean Serve" : tq > 0.42 ? "Off the toss" : "Mistimed", `${rMph} MPH${isSlice ? " · slice" : ""}`, isRocket);
  updateTelemetry(mph, isRocket);

  cpu.splitT = 0.24;
  if (game.mode === "net") { net.aimNext = netCtx === "guest" ? "host" : "guest"; return; }
  cpu.pending = predictBall(false);
  cpu.react = isRocket ? CAST[game.opp].react * 1.15 : 0.14;
}

function cpuServe() {
  const o = CAST[game.opp], s = boxSign();
  let tx = s * rand(0.7, 3.45), tz = NET - rand(3.5, 6.0);
  if (Math.random() < o.err * 0.7) { if (Math.random() < 0.6) tz = NET - rand(6.6, 7.6); else tx = s * rand(4.3, 5.0); }
  cpu.swingDur = 0.40; cpu.swingT = 0.40; cpu.swingType = "serve";
  const mph = launchShot(tx, tz, { mph: [80, 95, 106][o.tier], top: 75, side: 40 * s, clear: 0.20, tag: "drive" });
  Object.assign(ball, { serve: true, lastHitter: 1 });
  game.phase = "rally"; game.strokes = 1; game.rally = 1; setHint();
  sfx.hit(0.75, "drive", ball.x);
  updateTelemetry(mph, false);
  you.splitT = 0.24;
  aimYou();
}

function aimYou() {
  const tryVolley = you.homeZ > NET - SVC - 0.5;
  const t = predictBall(true, tryVolley);
  you.aimTarget = { x: t.bx, z: t.bz };
  const autoX = clamp(t.x - 0.50, -6.2, 6.2);
  const autoZ = clamp(t.z, -1.65, NET - 1.1);
  you.tx = lerp(you.homeX, autoX, 0.82);
  you.tz = lerp(you.homeZ, autoZ, 0.82);
}

function cpuTry() {
  const b = ball;
  if (game.mode !== "match" || !b.live || b.lastHitter !== 0) return;
  const o = CAST[game.opp];
  const atNet = cpu.z < NET + 5.2 && b.bounceCount === 0 && b.z > NET + 0.4 && b.y < 2.25;
  if (!atNet && (b.serve || b.bounceCount !== 1)) return;
  const effReach = cpu.recover > 0 && Math.abs(b.x - cpu.x) > 1.2 ? o.reach * 0.58 : o.reach;
  if (Math.abs(b.x - cpu.x) < effReach && Math.abs(b.z - cpu.z) < 0.72 && b.y < 2.65) {
    let tx, tz, tag = "drive", top = o.top, T = rand(o.t[0], o.t[1]), clear = 0.26;
    if (o.id === "sunny") {
      tx = you.x * 0.62 + rand(-1.4, 1.4);
      tz = Math.random() < o.short ? rand(5.4, 7.6) : rand(1.4, 5.2);
    } else if (o.id === "reef") {
      if (you.z > NET - 4.4 && Math.random() < 0.42) { tag = "lob"; T = 1.62; clear = 2.85; top = 40; tx = rand(-3.0, 3.0); tz = rand(0.9, 2.8); }
      else if (Math.random() < 0.36) { tag = "slice"; top = -155; clear = 0.22; tx = -Math.sign(you.x || 1) * rand(2.0, 3.7); tz = rand(3.2, 6.5); }
      else { tx = -Math.sign(you.x || 1) * rand(2.1, 3.75); tz = rand(1.2, 5.4); }
    } else {
      // Mako — aggressive net-rusher & heavy topspin striker
      if (atNet) { tag = "volley"; T = rand(0.58, 0.78); top = 30; tx = -Math.sign(you.x || 1) * rand(2.4, 3.85); tz = rand(3.5, 7.2); }
      else if (you.z > NET - 4.2 && Math.random() < 0.32) { tag = "lob"; T = 1.56; clear = 2.9; top = 50; tx = rand(-3.1, 3.1); tz = rand(0.8, 2.5); }
      else { tx = -Math.sign(you.x || 1) * rand(2.2, 3.85); tz = rand(0.9, 4.6); }
    }
    if (Math.random() < o.err) {
      if (Math.random() < 0.45) tz = rand(-1.6, -0.35);
      else if (Math.random() < 0.75) tx = (Math.random() < 0.5 ? -1 : 1) * rand(4.35, 5.15);
      else clear = 0; // authentic net error
    }
    cpu.swingDur = 0.36; cpu.swingT = 0.36;
    cpu.swingType = tag === "slice" ? "slice" : (b.x - cpu.x <= 0 ? "fh" : "bh");
    const mph = launchShot(tx, tz, { T, top, side: rand(-120, 120), clear, tag });
    b.lastHitter = 1; game.rally++; game.strokes++;
    sfx.hit(0.68, tag, b.x);
    updateTelemetry(mph, false);
    you.splitT = 0.24;
    aimYou();
    cpu.tx = 0; cpu.tz = o.rush > 0.5 && Math.random() < 0.4 ? NET + 3.4 : L + 0.75;
    cpu.pending = null;
  }
}

// Target Rings Training Mode
function spawnRing(slot) {
  training.spawned++;
  const gold = training.spawned % 5 === 0;
  const spots = [
    [-3.4, 1.05, L - 1.3], [3.4, 1.05, L - 1.3],
    [-2.1, 1.0, NET + 4.0], [2.1, 1.0, NET + 4.0],
    [0.0, 1.25, L - 2.6]
  ];
  const sp = spots[(training.spawned + slot) % spots.length];
  training.rings[slot] = {
    active: true, gold, baseX: sp[0], x: sp[0], y: sp[1], z: sp[2],
    r: gold ? 0.55 : 0.78, seed: Math.random() * 10
  };
}
function startTraining() {
  initAudio();
  game.mode = "training"; game.phase = "training"; game.paused = false;
  Object.assign(training, { score: 0, combo: 0, comboT: 0, time: 60, feedT: 0.9, rings: [], spawned: 0 });
  for (let i = 0; i < 3; i++) spawnRing(i);
  placePlayer(you, 0, -0.4); you.homeX = 0; you.homeZ = -0.5;
  ball.visible = false; ball.live = false; trail.length = 0;
  $("overlay").hidden = true; $("score").hidden = true; $("trainHud").hidden = false;
  snapGameplayCam();
  updateTrainHUD(); setHint();
  showMsg("Target Rings!", "Hit glowing targets · 60 seconds", 1600);
}
function feedTrainingBall() {
  Object.assign(ball, { x: rand(-1.0, 1.0), y: 1.35, z: L - 0.4, visible: true, live: true, serve: false, lastHitter: 1 });
  const tx = rand(-2.5, 2.5), tz = rand(0.4, 3.2);
  launchShot(tx, tz, { T: 1.15, top: 65, side: 0, clear: 0.35, tag: "drive" });
  sfx.hit(0.45, "drive", ball.x);
  aimYou();
}
function checkRingHit(px, py, pz) {
  if (game.mode !== "training" || !ball.live || ball.lastHitter !== 0) return;
  for (let i = 0; i < training.rings.length; i++) {
    const rg = training.rings[i];
    if (!rg.active) continue;
    if ((pz - rg.z) * (ball.z - rg.z) <= 0 && ball.z !== pz) {
      const u = (rg.z - pz) / (ball.z - pz);
      const hx = px + (ball.x - px) * u, hy = py + (ball.y - py) * u;
      if (Math.hypot(hx - rg.x, hy - rg.y) <= rg.r + 0.25) {
        training.combo++; training.comboT = 3.2;
        const mul = Math.min(5, 1 + 0.25 * (training.combo - 1));
        const pts = Math.round((rg.gold ? 250 : 100) * mul);
        training.score += pts;
        training.time = Math.min(60, training.time + (rg.gold ? 1.2 : 0.5));
        burstSparks(rg.x, rg.y, rg.z, rg.gold ? [1.0, 0.88, 0.22] : [0.22, 0.96, 0.98], 34, 6.5, 0.10, 3.6);
        sfx.ring(training.combo, rg.gold);
        wiiRumble(rg.gold ? 95 : 42);
        crowd.cheer = Math.min(1, crowd.cheer + 0.35); crowd.hop = 0;
        feedback(rg.gold ? `GOLD TARGET! +${pts}` : `TARGET! +${pts}`, `×${mul.toFixed(2)} combo`, rg.gold);
        spawnRing(i);
        updateTrainHUD();
      }
    }
  }
}

// 14. MAIN UPDATE LOOP & DYNAMIC BROADCAST CAMERA
// =========================================================================
const nudge = { x: 0, z: 0 };
const keys = new Set();

function movePlayer(p, dt) {
  p.prevVx = p.vx; p.prevVz = p.vz;
  const dx = p.tx - p.x, dz = p.tz - p.z, d = Math.hypot(dx, dz);
  const step = Math.min(d, p.speed * dt);
  if (d > 0.01) { p.vx = (dx / d) * (step / Math.max(dt, 1e-4)); p.vz = (dz / d) * (step / Math.max(dt, 1e-4)); p.x += (dx / d) * step; p.z += (dz / d) * step; }
  else { p.vx *= 0.8; p.vz *= 0.8; }
  // Court sneaker squeak on hard cut
  p.squeakCd = Math.max(0, p.squeakCd - dt);
  const sp = Math.hypot(p.vx, p.vz), psp = Math.hypot(p.prevVx, p.prevVz);
  if (p.squeakCd <= 0 && sp > 2.4 && psp > 2.4) {
    const dot = (p.vx * p.prevVx + p.vz * p.prevVz) / (sp * psp);
    if (dot < 0.25) { sfx.squeak(p.x); burstDust(p.x, p.z, 5); p.squeakCd = 0.45; }
  }
}

function readNudgeInput() {
  let nx = 0, nz = 0;
  // Looking from -Z toward +Z: screen-left is +X, screen-right is -X
  if (keys.has("KeyA") || keys.has("ArrowLeft") || wii.dpL) nx += 1;
  if (keys.has("KeyD") || keys.has("ArrowRight") || wii.dpR) nx -= 1;
  if (keys.has("KeyW") || keys.has("ArrowUp") || wii.dpU) nz += 1;
  if (keys.has("KeyS") || keys.has("ArrowDown") || wii.dpD) nz -= 1;
  return [nx, nz];
}
function updateNudge(dt) {
  const [nx, nz] = readNudgeInput();
  nudge.x = lerp(nudge.x, nx, clamp(dt * 12, 0, 1));
  nudge.z = lerp(nudge.z, nz, clamp(dt * 12, 0, 1));
  applyNudgeMove(dt);
}
function applyNudgeMove(dt) {
  if (game.phase === "rally" || game.phase === "training") {
    you.homeX = clamp(you.homeX + nudge.x * 2.6 * dt, -5.2, 5.2);
    you.homeZ = clamp(you.homeZ + nudge.z * 2.8 * dt, -1.45, NET - 1.2);
    if (!ball.live || ball.lastHitter !== 1) {
      you.tx = lerp(you.tx, you.homeX, clamp(dt * 4, 0, 1));
      you.tz = lerp(you.tz, you.homeZ, clamp(dt * 4, 0, 1));
    }
  }
}

function updateCamera(dt) {
  cam.shake = Math.max(0, cam.shake - dt * 3.4);
  cam.zoomPunch = Math.max(0, cam.zoomPunch - dt * 2.4);
  const ph = game.phase;
  if (ph === "title" || ph === "matchOver" || ph === "trainOver") {
    cam.orbitA += dt * 0.14;
    const tx = Math.sin(cam.orbitA) * 14.5, tz = NET - Math.cos(cam.orbitA) * 21.5;
    cam.ex = lerp(cam.ex, tx, clamp(dt * 2, 0, 1));
    cam.ey = lerp(cam.ey, 6.2 + Math.sin(cam.orbitA * 1.5) * 0.8, clamp(dt * 2, 0, 1));
    cam.ez = lerp(cam.ez, tz, clamp(dt * 2, 0, 1));
    cam.tx = lerp(cam.tx, 0, clamp(dt * 2, 0, 1));
    cam.ty = lerp(cam.ty, 1.0, clamp(dt * 2, 0, 1));
    cam.tz = lerp(cam.tz, NET, clamp(dt * 2, 0, 1));
    return;
  }
  const serving = ph === "serveReady" || ph === "toss";
  const wantEx = serving ? you.x * 0.52 : clamp(you.x * 0.40 + (ball.visible ? ball.x * 0.14 : 0), -4.2, 4.2);
  const wantEy = serving ? 4.75 : 5.35 - cam.zoomPunch * 0.35;
  const wantEz = serving ? -9.2 : -10.0 + clamp((you.z + 0.8) * 0.25, -0.4, 2.0);
  const wantTx = ball.visible ? clamp(ball.x * 0.22, -2.5, 2.5) : you.x * 0.2;
  const wantTy = ball.visible ? clamp(0.75 + ball.y * 0.12, 0.75, 1.7) : 0.95;
  const wantTz = serving ? NET + 0.6 : NET - 0.3;
  const k = clamp(dt * 4.5, 0, 1);
  cam.ex = lerp(cam.ex, wantEx, k); cam.ey = lerp(cam.ey, wantEy, k); cam.ez = lerp(cam.ez, wantEz, k);
  cam.tx = lerp(cam.tx, wantTx, k); cam.ty = lerp(cam.ty, wantTy, k); cam.tz = lerp(cam.tz, wantTz, k);
}
function snapGameplayCam() {
  cam.ex = you.x * 0.5; cam.ey = 4.9; cam.ez = -9.6;
  cam.tx = 0; cam.ty = 0.95; cam.tz = NET;
}

function update(rawDt) {
  if (game.mode === "golf") { golfUpdate(rawDt); return; }
  if (net.role === "guest" && game.mode === "net") { netGuestTick(rawDt); return; }
  if (game.paused) return;
  if (game.hitstop > 0) { game.hitstop -= rawDt; cam.shake = Math.max(0, cam.shake - rawDt * 1.8); return; }
  let dt = rawDt;
  if (game.slowMo > 0) { game.slowMo -= rawDt; dt *= 0.38; }

  // Ambient seagull cry timer
  sfxNodes.gullT -= dt;
  if (sfxNodes.gullT <= 0) { sfx.gull(); sfxNodes.gullT = rand(9, 17); }

  // Net hit ripple decay
  if (netHit[2] > 0.001) { netHit[3] += dt; netHit[2] *= Math.exp(-dt * 4.2); }
  crowd.cheer = Math.max(0, crowd.cheer - dt * 0.35);
  crowd.hop += dt * 11;

  updateNudge(dt);
  if (game.mode === "net") netHostStep(dt);
  const ph = game.phase;
  if (ph === "pointOver" || ph === "between") {
    game.timer -= rawDt;
    if (game.timer <= 0) {
      if (ph === "pointOver" && game.winner >= 0) { game.phase = "matchOver"; ball.visible = false; showEnd(); }
      else setupPoint();
    }
  }
  if (ph === "cpuServe") {
    game.timer -= dt;
    if (!game.tossed && game.timer < 0.56) {
      game.tossed = true;
      Object.assign(ball, { x: cpu.x + 0.18, y: 1.6, z: cpu.z - 0.35, vx: 0, vy: 5.2, vz: 0, w: { x: 0, y: 0, z: 0 }, spin: 0, visible: true, live: false, tossing: true, netted: false });
      cpu.tossArm = 1.0;
    }
    if (game.tossed && ball.vy < 0.15) cpuServe();
  }
  if (ph === "toss") {
    game.tossT += dt;
    const meter = $("serveMeter");
    meter.hidden = game.server !== 0;
    const yPct = clamp((ball.y - 1.1) / 2.1, 0, 1) * 100;
    $("servePin").style.bottom = yPct + "%";
    if (ball.y < 1.05 && ball.vy < 0) {
      ball.visible = false; meter.hidden = true; game.phase = "serveReady";
      if (game.server === 0) feedback("Missed the toss", "swing to toss again");
      else netEv({ k: "fb", a: ["Missed the toss", "swing to toss again", false] });
      setHint();
    }
  } else {
    $("serveMeter").hidden = true;
  }

  // Training loop
  if (ph === "training") {
    training.time = Math.max(0, training.time - dt);
    if (training.comboT > 0) { training.comboT -= dt; if (training.comboT <= 0) training.combo = 0; }
    for (const rg of training.rings) {
      if (rg.active && rg.gold) rg.x = rg.baseX + Math.sin(game.now * 1.5 + rg.seed) * 1.45;
    }
    training.feedT -= dt;
    if (training.feedT <= 0 && (!ball.live || ball.z > NET + 2)) {
      feedTrainingBall(); training.feedT = 2.05;
    }
    updateTrainHUD();
    if (training.time <= 0) {
      game.phase = "trainOver"; ball.visible = false;
      if (training.score > career.trainingBest) { career.trainingBest = training.score; saveCareer(); }
      showTrainEnd();
    }
  }

  // Fixed 240Hz physics sub-stepping
  const n = Math.max(1, Math.ceil(dt / (1 / 240))), h = dt / n;
  for (let i = 0; i < n; i++) {
    if (ball.visible) {
      const px = ball.x, py = ball.y, pz = ball.z;
      const ev = physStep(ball, h, false);
      checkRingHit(px, py, pz);
      if (ev === "bounce") onBounce();
      else if (ev === "net" && ball.live) { sfx.net(ball.x); burstSparks(ball.x, ball.y, NET, [1, 0.96, 0.85], 12, 3.2, 0.06, 2.0); }
    }
    cpuTry();
  }

  // CPU reaction & net rush logic
  if (game.mode === "match") {
    cpu.recover = Math.max(0, cpu.recover - dt);
    if (cpu.pending && cpu.react > 0) {
      cpu.react -= dt;
      if (cpu.react <= 0) {
        const t = cpu.pending, o = CAST[game.opp];
        const doRush = t.bz < o.rushZ && Math.random() < o.rush;
        if (doRush) { cpu.tx = clamp(t.x, -4.8, 4.8); cpu.tz = NET + 2.4; }
        else { cpu.tx = clamp(t.x + (t.x > cpu.x ? -0.45 : 0.45), -6.5, 6.5); cpu.tz = clamp(t.z, NET + 1.8, L + 2.8); }
        cpu.pending = null;
      }
    }
  }

  movePlayer(you, dt);
  if (game.mode !== "training") movePlayer(cpu, dt);
  updateCharacterRig(you, 0, dt, true);
  if (game.mode !== "training") updateCharacterRig(cpu, 1, dt, false);

  if (ball.visible && ball.live) {
    trail.push({ x: ball.x, y: ball.y, z: ball.z });
    if (trail.length > 24) trail.shift();
  } else if (trail.length) trail.shift();

  for (let i = marks.length - 1; i >= 0; i--) { marks[i].age += dt; if (marks[i].age > 1.5) marks.splice(i, 1); }
  updateParticles(dt);
  updateCamera(dt);
}

let msgTimer = 0, fbTimer = 0, speedTimer = 0;

function updateTelemetry(mph, isRocket) {

  if (netCtx !== "guest") lb.classList.toggle("show", !!game.lobArmed);
}
function ptLabel(i) {
  const a = game.pts[i], b = game.pts[1 - i];
  if (a >= 3 && b >= 3) return a > b ? "AD" : "40";
  return ["0", "15", "30", "40"][Math.min(a, 3)];
}
function updateHUD() {
  const o = CAST[game.opp];
  $("oppNameHud").textContent = oppName(); $("oppTierHud").textContent = game.mode === "net" ? "LAN" : o.tierLabel;
  for (const i of [0, 1]) {
    $("g" + i).textContent = game.games[i]; $("p" + i).textContent = ptLabel(i);
    $("srv" + i).classList.toggle("on", game.server === i);
  }
  const badge = $("scoreBadge");

  if (e.pointerType === "touch") touchy = true;
  if (game.mode === "golf") { golfPointer("move", e); return; }
  const t = performance.now();
  samples.push({ x: e.clientX, y: e.clientY, t });
  while (samples.length && t - samples[0].t > 85) samples.shift();
  if (samples.length < 3) return;
  const a = samples[0], b = samples[samples.length - 1], dtm = b.t - a.t;

  if (game.mode === "golf") { golfPointer("up", e); return; }

// WebHID Wii Remote (Bluetooth + Mayflash DolphinBar Mode 4) with Gravity Filtering
const WII_IDS = [{ vendorId: 0x057e, productId: 0x0306 }, { vendorId: 0x057e, productId: 0x0330 }];
const isWii = d => WII_IDS.some(f => f.vendorId === d.vendorId && f.productId === d.productId);
const wii = {
  dev: null, armed: new Set(), lastErr: null, searchId: 0,
  g: { x: 0, y: 0, z: 1 }, reports: 0, lastT: 0,
  state: "idle", peak: 0, startT: 0, sumX: 0, sumY: 0, sumZ: 0, sumN: 0,
  aWas: false, pWas: false, bHeld: false, dpL: false, dpR: false, dpU: false, dpD: false
};
const setReporting = d => d.sendReport(0x12, new Uint8Array([0x04, 0x31]));

async function armWii(d) {
  try { if (!d.opened) await d.open(); } catch (e) { wii.lastErr = e; return; }
  if (!wii.armed.has(d)) { d.addEventListener("inputreport", onWii); wii.armed.add(d); }
  try { await d.sendReport(0x15, new Uint8Array([0x00])); } catch (e) { wii.lastErr = e; }
  try { await setReporting(d); } catch (e) { wii.lastErr = e; }
}
async function connectWii(interactive = true) {
  if (wii.dev) return;
  if (!("hid" in navigator)) { if (interactive) showMsg("Wii Remote", "Needs Chrome or Edge on desktop", 2600); return; }
  let devs;
  try {
    devs = (await navigator.hid.getDevices()).filter(isWii);
    if (!devs.length && interactive) await navigator.hid.requestDevice({ filters: WII_IDS });
    devs = (await navigator.hid.getDevices()).filter(isWii);
  } catch (e) { showMsg("Device Picker", e.message || String(e), 3500); return; }
  if (!devs.length) return;
  $("wiiLbl").textContent = "Searching…";
  wii.lastErr = null;
  const id = ++wii.searchId;
  await Promise.all(devs.map(armWii));
  setTimeout(() => {
    if (wii.dev || id !== wii.searchId) return;
    $("wiiLbl").textContent = "Wii Remote";
    if (interactive) showMsg("No remote answered", wii.lastErr ? String(wii.lastErr.message || wii.lastErr) : "Press a button on the synced remote & retry", 4200);
  }, 2000);
}
function adoptWii(d) {
  wii.dev = d; wii.reports = 0; wii.state = "idle";
  $("wiiLed").classList.add("on"); $("wiiLbl").textContent = "Wii Ready";
  d.sendReport(0x11, new Uint8Array([0x10])).catch(() => {});
  showMsg("Wii Remote Connected", "Swing like a real racket!", 1800); setHint(); wiiRumble(140);
}
if (navigator.hid && navigator.hid.addEventListener) {
  navigator.hid.addEventListener("disconnect", e => {
    wii.armed.delete(e.device);
    if (e.device === wii.dev) { wii.dev = null; $("wiiLed").classList.remove("on"); $("wiiLbl").textContent = "Wii Remote"; setHint(); }
  });
  navigator.hid.addEventListener("connect", e => { if (isWii(e.device) && !wii.dev) armWii(e.device); });
}
function onWii(e) {
  if (!wii.dev) adoptWii(e.device);
  if (e.device !== wii.dev) return;
  const dv = e.data;
  if (e.reportId === 0x20) { setReporting(wii.dev).catch(() => {}); return; }
  if (e.reportId !== 0x31 && e.reportId !== 0x30) return;
  const b0 = dv.getUint8(0), b1 = dv.getUint8(1);
  wii.dpL = !!(b0 & 0x01); wii.dpR = !!(b0 & 0x02); wii.dpD = !!(b0 & 0x04); wii.dpU = !!(b0 & 0x08);
  const a = !!(b1 & 0x08), pauseBtn = !!(b1 & 0x80) || !!(b0 & 0x10);
  wii.bHeld = !!(b1 & 0x04);
  if (a && !wii.aWas) {
    if (!$("overlay").hidden) {
      if (game.paused) { game.paused = false; $("overlay").hidden = true; }
      else if (game.mode === "golf") golfEnter();
      else if (game.mode === "net") { if (game.phase !== "matchOver") $("overlay").hidden = true; }
      else if (!net.ws) startMatch();
    }
    else if (game.mode === "golf") golfWiiButton("A");
    else if (game.phase === "serveReady") humanSwing(0, "drive");
    else if (game.phase === "rally" || game.phase === "training") { game.lobArmed = !game.lobArmed; updateTelemetry(); }
  }
  if (game.mode === "golf" && $("overlay").hidden) golfWiiDpad(wii.dpL, wii.dpR, wii.dpU, wii.dpD, !!(b1 & 0x02));
  if (pauseBtn && !wii.pWas && game.phase !== "title" && game.phase !== "matchOver" && game.phase !== "trainOver" && game.phase !== "golfOver") {
    if (game.mode === "net") { if ($("overlay").hidden) showNetMenu(); else $("overlay").hidden = true; }
    else if (game.paused) { game.paused = false; $("overlay").hidden = true; } else showPause();
  }
  wii.aWas = a; wii.pWas = pauseBtn;
  if (e.reportId !== 0x31 || dv.byteLength < 5) return;

  const now = performance.now(), dt = wii.lastT ? clamp((now - wii.lastT) / 1000, 0.002, 0.05) : 0.01;
  wii.lastT = now; wii.reports++;
  const rx = (dv.getUint8(2) - 0x80) / 25, ry = (dv.getUint8(3) - 0x80) / 25, rz = (dv.getUint8(4) - 0x80) / 25;
  const tau = wii.state === "armed" ? 2.0 : 0.18, alpha = 1 - Math.exp(-dt / tau);
  wii.g.x += (rx - wii.g.x) * alpha; wii.g.y += (ry - wii.g.y) * alpha; wii.g.z += (rz - wii.g.z) * alpha;
  if (wii.reports < 15) return;
  const lx = rx - wii.g.x, ly = ry - wii.g.y, lz = rz - wii.g.z, mag = Math.hypot(lx, ly, lz);

  if (wii.state === "cool") {
    if (mag < 1.0 && game.now - game.lastSwing > 0.30) wii.state = "idle";
    return;
  }
  if (wii.state === "idle" && mag > 1.70 && game.now - game.lastSwing > 0.30) {
    wii.state = "armed"; wii.peak = mag; wii.startT = now; wii.sumX = lx; wii.sumY = ly; wii.sumZ = lz; wii.sumN = 1;
  } else if (wii.state === "armed") {
    if (mag > wii.peak) wii.peak = mag;
    if (mag >= wii.peak * 0.7) { wii.sumX += lx; wii.sumY += ly; wii.sumZ += lz; wii.sumN++; }
    if (now - wii.startT > 75) {
      if (wii.peak >= 1.85) {
        const gln = Math.hypot(wii.g.x, wii.g.y, wii.g.z) || 1;
        const up = ((wii.sumX * wii.g.x + wii.sumY * wii.g.y + wii.sumZ * wii.g.z) / (wii.sumN * gln));
        const intent = wii.bHeld || up < -0.55 ? "slice" : "drive";
        humanSwing(clamp((wii.peak - 1.55) / 3.1, 0.15, 1), intent);
        wii.state = "cool";
      } else wii.state = "idle";
    }
  }
}
function wiiRumble(ms) {
  if (netCtx === "guest") { netEv({ k: "rum", a: [ms] }); return; }
  const d = wii.dev; if (!d) return;
  d.sendReport(0x11, new Uint8Array([0x11])).then(() => setTimeout(() => d.sendReport(0x11, new Uint8Array([0x10])).catch(() => {}), ms)).catch(() => {});
}
function wiiRumblePattern(arr) {
  if (!wii.dev) return;
  let t = 0;
  arr.forEach((ms, i) => { if (i % 2 === 0) setTimeout(() => wiiRumble(ms), t); t += ms; });
}

// 17. LAN MULTIPLAYER — host-authoritative netcode over the lagoon-server.ps1 WebSocket relay
//     The host runs the whole simulation. The guest plays the far-court player: its swings and
//     court nudges are sent to the host, which simulates them in a 180°-mirrored copy of the
//     world (so all the near-player shot code is reused), then streams 30 Hz snapshots back.
//     The guest renders everything in its own mirrored frame, so it always sees itself up close.
// =========================================================================
const NET_PORT = 8765;
const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const net = {

// ---------- GUEST ----------
function netGuestSwing(power, intent) {

function netGuestStart(m) {

function netUnpack(p, a) {

// ---------- CONNECTION & LOBBY ----------
function netClose() {

}
function netConnect(role, addrRaw) {
  netClose();
  const nameEl = $("lanName");
  net.myName = ((nameEl && nameEl.value) || net.myName || (role === "host" ? "Host" : "Buddy")).trim().slice(0, 14) || "Player";
  try { localStorage.setItem("lagoon-name", net.myName); } catch {}
  let host = String(addrRaw || "").trim().replace(/^(wss?|https?):\/\//i, "").replace(/\/.*$/, "");
  if (!host) host = "localhost";
  if (!/:\d+$/.test(host) && !host.startsWith("[")) host += ":" + NET_PORT;
  if (role === "guest") { net.addr = String(addrRaw || "").trim(); try { localStorage.setItem("lagoon-addr", net.addr); } catch {} }
  net.role = role; net.err = ""; net.target = host;
  let ws;
  try { ws = new WebSocket("ws://" + host + "/"); }
  catch (e) { net.role = null; net.err = `That address doesn't look right (${escHtml(host)}).`; lanRefresh(); return; }
  net.ws = ws;
  lanRefresh();
  ws.onopen = () => { net.connected = true; netSend({ t: "hello", role, name: net.myName }); lanRefresh(); };
  ws.onerror = () => {
    net.err = role === "host"
      ? `Couldn't reach the server on this computer. Start it first — Mac: <b>python3 lagoon-server.py</b> in Terminal (or <b>Start-Lagoon-Server.command</b>), Windows: <b>Start-Lagoon-Server.bat</b> — then press Host again.`
      : `Couldn't reach <b>${escHtml(host)}</b>. Check the address, that the host's server window is open, and that Windows Firewall allowed it.`;
  };
  ws.onclose = () => {
    const was = net.peer;
    netClose(); if (!net.err) net.err = "Disconnected from the server.";
    if (was) netPeerLost("Connection to the server was lost."); else lanRefresh();
  };

}
function netOnMessage(m) {
  switch (m.t) {
    case "sys":

      if (net.count >= 2) netSend({ t: "hello", role: net.role, name: net.myName });
      else if (net.peer) netPeerLost(`${net.peerName || "Your buddy"} left the game.`);
      lanRefresh(); break;
    case "hello":
      if (m.role === net.role) { net.err = `Someone else is already connected as ${m.role}. One PC must Host and the other Join.`; lanRefresh(); return; }
      if (!net.peer) {
        net.peer = true; net.peerName = String(m.name || (m.role === "host" ? "Host" : "Buddy")).slice(0, 14);
        netSend({ t: "hello", role: net.role, name: net.myName });
        sfx.ui(); showMsg(net.role === "host" ? "Buddy joined!" : "Connected!", `${net.peerName} is in the lobby`, 1600);
      }
      lanRefresh(); break;
    case "start": if (net.role === "guest") netGuestStart(m); break;
    case "s": if (net.role === "guest") netApplySnapshot(m); break;
    case "sw": if (net.role === "host") netRemoteSwing(m.p, m.i); break;
    case "nud": if (net.role === "host") { net.rnx = clamp(+m.x || 0, -1, 1); net.rnz = clamp(+m.z || 0, -1, 1); } break;

}

// =========================================================================
let lastTs = 0, fpsFrames = 0, fpsAcc = 0, slowStreak = 0;
function frame(ts) {
  const t = ts * 0.001, dt = Math.min(0.05, lastTs ? t - lastTs : 0.016);
  lastTs = t; game.now = t;
  update(dt);
  netHostSend();
  renderFrame();
  // Lightweight FPS tracker & auto-stepdown if consistently < 35fps on Ultra
  fpsFrames++; fpsAcc += dt;
  if (fpsAcc >= 0.75) {
    const fps = Math.round(fpsFrames / fpsAcc);
    $("fpsTag").textContent = `${fps} FPS`;
    $("fpsTag").hidden = false;
    if (fps < 34 && qualIdx < 2) {
      slowStreak++;
      if (slowStreak >= 3) { qualIdx++; $("qualLbl").textContent = QUALITY_TIERS[qualIdx].name; resize(); slowStreak = 0; }
    } else slowStreak = 0;
    fpsFrames = 0; fpsAcc = 0;
  }
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
updateActivePreset();
resize();
updateHUD();
showTitle();
// Pre-pose characters for the live orbiting title backdrop
updateCharacterRig(you, 0, 0.016, true);
updateCharacterRig(cpu, 1, 0.016, false);
requestAnimationFrame(frame);
connectWii(false);

})();
</script>
